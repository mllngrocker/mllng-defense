<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}</style>

<body>
<title>말랑말랑 수비대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: handheld column — status strip, skill row, field window (400x560), tip line, action pad */
:root{
  --bg:#dcefff;--bg2:#c8e3fa;--panel:#ffffff;--ink:#3a2a32;--muted:#7c6a76;--line:#3a2a32;
  --honey:#ffd25e;--leaf:#9be37a;--rose:#ff86a8;--sky:#9fd0ff;--btn-ink:#3a2a32;
  --f-disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2233;--bg2:#242e46;--panel:#2b344b;--ink:#f4eaf0;--muted:#b9aab6;--line:#0d111d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b2233;--bg2:#242e46;--panel:#2b344b;--ink:#f4eaf0;--muted:#b9aab6;--line:#0d111d;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--bg2) 1.6px,transparent 1.8px);background-size:18px 18px;color:var(--ink);font-family:var(--f-disp);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-user-select:none;user-select:none;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-width:0}
.pill{background:var(--panel);border:2.5px solid var(--line);border-radius:999px;box-shadow:0 3px 0 var(--line);padding:3px 8px;display:flex;gap:4px;align-items:center;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .h{color:#ff5c7f}.pill .c{color:#f0a818}.pill small{color:var(--muted);font-size:11px;letter-spacing:.06em}
#stage{margin-left:auto;background:var(--leaf);color:var(--btn-ink);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block}
button{font:inherit;color:var(--btn-ink);background:var(--honey);border:2.5px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);padding:5px 10px;cursor:pointer;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button:disabled{filter:grayscale(.8);opacity:.55}
button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.sk{background:var(--sky);display:flex;gap:3px;align-items:center;font-size:12px;padding:4px 7px;white-space:nowrap}
.sk em{font-style:normal;background:var(--panel);color:var(--ink);border-radius:8px;padding:0 5px;font-size:11px}
.sp{flex:1}
#pause,#spd{background:var(--panel);color:var(--ink);min-width:36px;padding:4px 7px;font-size:13px}
#field{position:relative;width:min(100%,max(250px,calc((100vh - 215px)*.714)));width:min(100%,max(250px,calc((100dvh - 215px)*.714)));aspect-ratio:400/560;margin:0 auto;max-width:100%}
#cv{width:100%;height:100%;display:block;border-radius:18px;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);touch-action:manipulation;background:#7cc95e}
#tip{background:var(--panel);border:2.5px solid var(--line);border-radius:14px;padding:6px 10px;font-family:var(--f-body);font-size:13.5px;text-align:center;min-height:34px;display:flex;align-items:center;justify-content:center}
#bar{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:7px}
#bar button{padding:10px 4px;font-size:16px}
#sum{background:var(--rose);display:flex;flex-direction:column;align-items:center;line-height:1.05}
#sum small{font-size:12px}
#mrg{background:var(--leaf)}
#mrg.ready{animation:glow 1s infinite alternate}
@keyframes glow{to{background:#d8ff9a;transform:translateY(-2px)}}
#dex,#set{background:var(--panel);color:var(--ink)}
#cut{position:absolute;left:-6px;right:-6px;top:34%;height:92px;display:flex;align-items:center;gap:8px;padding:0 16px;
  background:linear-gradient(100deg,transparent 0,var(--cc,#ff86a8) 10%,var(--cc,#ff86a8) 90%,transparent);transform:skewY(-5deg);opacity:0;pointer-events:none;overflow:hidden}
#cut::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 3px,transparent 3px 22px);animation:speed .3s linear infinite}
@keyframes speed{to{background-position:-25px 0}}
#cut canvas{position:relative;width:110px;height:92px;flex:none}
#cut div{position:relative;color:#fff;text-shadow:2px 2px 0 #3a2a32,-1px -1px 0 #3a2a32,1px -1px 0 #3a2a32,-1px 1px 0 #3a2a32;min-width:0}
#cut b{display:block;font-weight:400;font-size:14px;opacity:.95}
#cut span{display:block;font-size:27px}
#cut.go{animation:cut 1.25s ease-out}
#cut.boss{--cc:#c0283f}
@keyframes cut{0%{opacity:0;transform:skewY(-5deg) translateX(-90px)}14%{opacity:1;transform:skewY(-5deg) translateX(0)}82%{opacity:1;transform:skewY(-5deg) translateX(8px)}100%{opacity:0;transform:skewY(-5deg) translateX(90px)}}
#bossbar{position:absolute;top:calc(48px * var(--k,1));left:14%;right:14%;background:rgba(40,16,30,.82);border:2.5px solid #12060c;border-radius:12px;padding:4px 8px 6px;color:#fff;font-size:13px}
#bossbar .bn{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
#bossbar .tr{position:relative;height:9px;border-radius:6px;background:#4a2236;overflow:hidden;margin-top:3px}
#bfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff3b5c,#ff9a3a);border-radius:6px;transition:width .15s}
#bsh{position:absolute;inset:0 auto 0 0;background:rgba(150,220,255,.75);border-radius:6px}
#ov{position:fixed;inset:0;background:rgba(20,12,24,.6);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px max(16px,env(safe-area-inset-left,0px))}
#box{background:var(--panel);color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:20px;padding:16px;max-width:420px;width:100%;max-height:86vh;overflow:auto;font-family:var(--f-body);font-size:14px;line-height:1.55}
#box h2,#box h3{font-family:var(--f-disp);font-weight:400;margin:0 0 6px;text-wrap:balance}
#box h2{font-size:30px;text-align:center;color:var(--rose)}
#box h3{font-size:19px;margin-top:10px}
#box .lead{text-align:center;color:var(--muted);margin:0 0 8px}
#box ul{margin:6px 0 10px;padding-left:20px}
#box .go{display:block;width:100%;font-size:20px;padding:11px;background:var(--rose);margin-top:8px}
.dexu{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-bottom:2px dashed var(--bg2)}
.dexu .nm{font-family:var(--f-disp);font-size:16px}
.dexu .gr{display:flex;gap:2px;justify-content:space-between}
.dexu .gr figure{margin:0;text-align:center;font-size:10.5px;color:var(--muted);flex:1;min-width:0}
.dexu canvas{display:block;margin:0 auto;max-width:100%}
.dexe{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dexe figure{margin:0;text-align:center;font-size:11.5px}
#title canvas{display:block;margin:0 auto;max-width:100%}
@media (prefers-reduced-motion:reduce){#cut.go{animation-duration:.01s}#mrg.ready{animation:none}}
</style>

<div id="app">
  <div class="row">
    <span class="pill"><span class="h">♥</span><b id="lives">10</b></span>

  <div class="row">
    <button class="sk" id="sk-stun" data-k="stun">★ 기절 <em>1</em></button>
    <button class="sk" id="sk-blast" data-k="blast">✸ 섬멸 <em>1</em></button>
    <button class="sk" id="sk-slow" data-k="slow">❄ 감속 <em>1</em></button>
    <span class="sp"></span>
    <button id="pause" aria-label="일시정지">❚❚</button>
    <button id="spd">×1</button>
  </div>
  <div id="field">
    <canvas id="cv"></canvas>
    <div id="bossbar" hidden><div class="bn"><span id="bname"></span><span id="bpct"></span></div><div class="tr"><i id="bfill"></i><b id="bsh"></b></div></div>

  </div>
  <div id="tip">캐릭터를 소환해서 마을을 지켜요</div>
  <nav id="bar">
    <button id="sum"><span>소환</span><small>● <span id="sumcost">10</span></small></button>
    <button id="mrg">합성</button>
    <button id="dex">도감</button>
    <button id="set">설정</button>
  </nav>
</div>
<div id="ov"><div id="box"></div></div>
<script>
/* ================= CONFIG : 밸런스 수치는 여기서 조정 ================= */
const CONFIG={
  lives:10,maxWave:30,startCoin:40,summonCost:10,summonInc:1,

  gradeMul:[1,2.8,8,24],gradeNames:['일반','희귀','영웅','전설'],gradeCol:['#c9c2b8','#35c2c4','#a46bff','#ffc23d'],
  mergeNeed:3,ultCharge:14,skillMax:3,skillStart:1,skillRegenWaves:5,
  units:{

    haneul:{n:'하늘냥',body:'#fffdf7',dmg:5,rate:.4,range:110,atk:'sword',fx:'#3c9dff',shout:'하늘베기!!',ult:'앞선 적 5마리 연속 베기',desc:'파란 검으로 빠르게 베는 중거리 검사'},

    mong:{n:'몽글이',body:'#ece4f4',dmg:3,rate:1.1,range:140,atk:'star',shout:'몽글 바람~!',ult:'모든 적 감속 + 아군 공격속도 증가',desc:'별을 쏘아 적을 느리게 하는 서포터'},
    bam:{n:'밤톨이',body:'#f6d29a',dmg:4,rate:1.1,range:90,atk:'bottle',shout:'캬아~~~~!',ult:'한 모금 후 함성! 모든 적 밀쳐내기',desc:'병을 던져 적을 뒤로 밀어내는 탱커'},
    haesa:{n:'햇살사자',body:'#ffd766',dmg:8,rate:1.2,range:120,atk:'sun',shout:'태양이 내려온다!',ult:'거대한 해를 떨어뜨려 범위 피해',desc:'햇살을 내리꽂는 범위 마법사'},
    sudal:{n:'수달검객',body:'#d9a477',dmg:26,rate:1.9,range:155,atk:'sword',fx:'#ffd21f',shout:'일섬!!',ult:'가장 강한 적을 일격 (보스 2배)',desc:'노란 검의 암살자. 보스에게 2배 피해'}
  },
  enemies:{

    rock:{n:'이끼 바위',hp:2.3,spd:.65,r:14,lc:'#8a8f84'},
    seed:{n:'씨앗 꼬마',hp:.35,spd:1.1,r:7,lc:'#b98249'},
    puff:{n:'민들레 유령',hp:.8,spd:1.25,r:11,fly:1,lc:'#ffffff'},
    shield:{n:'껍질 방패병',hp:2,spd:.8,r:12,elite:1,sh:1.2,lc:'#b07a45'},
    bud:{n:'꽃봉오리 치유사',hp:2,spd:.8,r:12,elite:1,heal:1,lc:'#ff8fb8'}
  },
  bosses:[
    {n:'잡초대왕',hp:12,spd:.45,r:28,lc:'#4fa83d',desc:'체력이 절반 아래면 분노해서 빨라져요'},
    {n:'가시 히드라',hp:14,spd:.4,r:30,lc:'#e24a6a',desc:'4초마다 씨앗 꼬마를 뱉어내요'},
    {n:'그림자 뿌리왕',hp:16,spd:.38,r:32,lc:'#9b4dff',desc:'6초마다 아군 둘을 묶고 보호막을 둘러요'}
  ],
  stages:[
    {n:'햇살 초원',deco:'meadow',amb:'petal',g1:'#a8e27f',g2:'#6fbf55',p1:'#c4ef9a',p2:'#5aa845',b1:'#5fae48',b2:'#86cf62',pe:'#c9a46c',pa:'#ecd6a4',ph:'#fff4d8',fr:'#8a6a48',t1:'#d6f2b8',t2:'#c4eaa2',te:'#8fbf6e',pool:'#7cc8ff',vig:.06},
    {n:'시든 가을 언덕',deco:'autumn',amb:'leaf',g1:'#d8bd6c',g2:'#a8803f',p1:'#e6cf8a',p2:'#946c33',b1:'#9c7a3a',b2:'#c4a058',pe:'#8e6436',pa:'#c99c66',ph:'#ecd2a6',fr:'#6b4a2e',t1:'#efdcaa',t2:'#e3cc93',te:'#a88a55',pool:'#8a6a4a',vig:.16},
    {n:'저주받은 가시밭',deco:'cursed',amb:'ember',crack:1,g1:'#5e4266',g2:'#2c1a33',p1:'#7a5a84',p2:'#1f1226',b1:'#3b2742',b2:'#6a4a72',pe:'#2e1d33',pa:'#5c4558',ph:'#8a7088',fr:'#24152a',t1:'#7d6886',t2:'#6f5a78',te:'#3f2d46',pool:'#9b4dff',vig:.3},
    {n:'무지개 초원',deco:'rainbow',amb:'petal',rainbow:1,g1:'#bdf093',g2:'#7fcf60',p1:'#d4f7ad',p2:'#62b84d',b1:'#64b84c',b2:'#93d96c',pe:'#cdab72',pa:'#f2deb0',ph:'#fffbe8',fr:'#9a7650',t1:'#e2f8c6',t2:'#d0f1b0',te:'#97c776',pool:'#8fd8ff',vig:.02}
  ]
};
const TIPS=['같은 캐릭터 3개(같은 등급)를 모아 합성하면 모습이 멋지게 변해요','캐릭터를 눌러 선택하고, 다른 칸을 누르면 자리를 옮겨요','10웨이브마다 보스가 나와요. 잡으면 땅의 모습이 바뀌어요','수달검객은 보스에게 2배 피해를 줘요','5웨이브마다 스킬 사용 횟수가 1씩 충전돼요','밤톨이의 "캬아~"는 모든 적을 뒤로 밀어내요','강한 스킬로 단번에 섬멸!'];

/* ================= 기본 상수/도구 ================= */
const $=s=>document.querySelector(s);
const W=400,H=560,COLS=5,ROWS=7,CS=54,GX=65,GY=91,OL='#3a2a32';
const PATH=[[-24,26],[374,26],[374,534],[26,534],[26,122]];
const SEG=[];let TOT=0;
for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);SEG.push({a,b,l,s0:TOT});TOT+=l}
function posAt(s){s=Math.max(0,Math.min(TOT,s));for(const q of SEG){if(s<=q.s0+q.l){const k=(s-q.s0)/q.l;return[q.a[0]+(q.b[0]-q.a[0])*k,q.a[1]+(q.b[1]-q.a[1])*k]}}return PATH[PATH.length-1]}
const cellXY=i=>[GX+(i%COLS)*CS+CS/2,GY+Math.floor(i/COLS)*CS+CS/2];
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DPR=Math.min(2,window.devicePixelRatio||1);
const cv=$('#cv');cv.width=W*DPR;cv.height=H*DPR;
const MAIN=cv.getContext('2d');let g=MAIN;
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function E(x,y,rx,ry,fill,stroke,lw,rot){g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2.4;g.stroke()}}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function star(x,y,r,n=5,inner=.45){g.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,rr=i%2?r*inner:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath()}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function shade(h,p){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(p>0?v+(255-v)*p:v*(1+p))));return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}

/* ================= 배경 (스테이지별 미리 그림) ================= */
function flower(x,y,c,s){for(let i=0;i<5;i++){const a=i/5*TAU;E(x+Math.cos(a)*s,y+Math.sin(a)*s,s*.8,s*.8,c)}E(x,y,s*.6,s*.6,'#ffd23f')}
function tuft(x,y,c){g.strokeStyle=c;g.lineWidth=1.6;g.lineCap='round';for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(x+i*1.5,y);g.lineTo(x+i*3,y-5-(2-Math.abs(i))*1.5);g.stroke()}}
function bush(x,y,r,c1,c2){E(x,y+r*.35,r*1.15,r*.45,'rgba(0,0,0,.15)');for(const[a,b,s]of[[-.5,0,.7],[.5,0,.7],[0,-.35,.8]])E(x+a*r,y+b*r,r*s,r*s,c2,'rgba(58,42,50,.55)',1.4);E(x,y-.1*r,r*.75,r*.62,c1);E(x-r*.25,y-r*.4,r*.25,r*.16,'rgba(255,255,255,.3)')}
function mush(x,y,c,glow){if(glow)E(x,y-3,9,9,hexA(c,.25));RR(x-1.5,y-3,3,5,1);g.fillStyle='#f3ead8';g.fill();g.beginPath();g.ellipse(x,y-3,5,4,0,Math.PI,0);g.closePath();g.fillStyle=c;g.fill();g.strokeStyle='rgba(58,42,50,.6)';g.lineWidth=1;g.stroke();E(x-1.5,y-5,1,1,'#fff');E(x+2,y-4.5,.8,.8,'#fff')}
function stump(x,y){E(x,y,6,4.5,'#9a6a3e','rgba(58,42,50,.6)',1.2);E(x,y,3.5,2.6,null,'#c79a6a',1)}

let AC=null,MG=null,NB=null,mute=false;const lastS={};
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=mute?0:.5;MG.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(f,d,type='sine',v=.1,f2,dl=0){if(!AC)return;const t0=AC.currentTime+dl,o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);a.gain.setValueAtTime(.0001,t0);a.gain.linearRampToValueAtTime(v,t0+.01);a.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(a);a.connect(MG);o.start(t0);o.stop(t0+d+.03)}
function noise(d,v=.1,hp=1000,dl=0){if(!AC)return;const t0=AC.currentTime+dl,s=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain();s.buffer=NB;f.type='highpass';f.frequency.value=hp;a.gain.setValueAtTime(v,t0);a.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(a);a.connect(MG);s.start(t0);s.stop(t0+d+.03)}
const SFX={
  summon(){tone(660,.08,'sine',.09);tone(990,.14,'sine',.09,null,.07)},
  merge(){[523,659,784,1046].forEach((f,i)=>tone(f,.16,'triangle',.08,null,i*.07))},
  sword(){noise(.09,.07,2500);tone(1300,.07,'triangle',.03,600)},
  claw(){noise(.06,.06,1800);noise(.05,.05,1800,.04)},
  tear(){tone(900,.12,'sine',.05,380)},
  star(){tone(1500,.07,'triangle',.035,2000)},
  toss(){tone(400,.1,'sine',.03,700)},
  clink(){tone(2200,.06,'triangle',.05);tone(2900,.09,'triangle',.04,null,.03)},
  plop(){tone(500,.08,'sine',.04,200)},
  sun(){tone(1200,.18,'sine',.04,1800)},
  pop(){tone(700,.06,'square',.025,1100)},
  ult(){tone(300,.35,'sawtooth',.05,1200);[784,988,1175].forEach(f=>tone(f,.4,'triangle',.04,null,.15))},
  boom(){noise(.4,.12,200);tone(120,.4,'sine',.12,40)},
  roar(){tone(140,.8,'sawtooth',.08,55);noise(.6,.05,300)},
  hurt(){tone(220,.28,'square',.06,90)},
  wave(){tone(523,.12,'triangle',.06);tone(784,.2,'triangle',.06,null,.1)},
  fanfare(){[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.07,null,i*.11))},
  stage(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.35,'sine',.06,null,i*.13))}
};
function sfx(k){if(!AC||mute)return;const n=performance.now();if(lastS[k]&&n-lastS[k]<55)return;lastS[k]=n;SFX[k]&&SFX[k]()}
const m2f=n=>440*Math.pow(2,(n-69)/12);
const MEL=[[72,76,79,76,74,72,74,76,72,67,69,72,74,72,69,67],[69,72,76,74,72,69,67,69,64,67,69,72,71,69,67,64],[57,60,63,62,60,58,57,55,57,58,60,63,62,58,57,55],[76,79,84,79,77,76,77,79,76,72,74,76,77,76,74,72]];
const BOSSM=[57,57,60,57,63,62,60,58,57,57,60,63,65,63,62,60];
let bstep=0;
setInterval(()=>{if(!AC||mute||!S||!S.started||S.paused||S.over)return;const boss=S.bossE&&!S.bossE.dead;const m=boss?BOSSM:MEL[S.stage];const n=m[bstep%16];
  tone(m2f(n),.16,boss?'square':'triangle',boss?.02:.032);if(bstep%4==0)tone(m2f(n-24),.4,'sine',.05);if(boss&&bstep%2==0)noise(.04,.025,6000);bstep++},170);

/* ================= 상태 ================= */
let S,BG=[];
function reset(){S={started:S?S.started:false,lives:CONFIG.lives,wave:0,coin:CONFIG.startCoin,cost:CONFIG.summonCost,grid:Array(COLS*ROWS).fill(null),en:[],q:[],pr:[],fx:[],pt:[],amb:[],later:[],
  time:0,wt:3,sel:-1,speed:1,paused:false,over:false,stage:0,bgPrev:null,bgFade:0,shake:0,flash:0,hurt:0,homeHit:0,tint:null,light:0,bolt:null,
  sk:{stun:CONFIG.skillStart,blast:CONFIG.skillStart,slow:CONFIG.skillStart},waveHP:CONFIG.hpBase,bossE:null,bossDown:0,winPending:0,kills:0};
  $('#pause').textContent='❚❚';$('#spd').textContent='×1';ui()}
function ui(){$('#lives').textContent=S.lives;$('#wave').textContent=S.wave+'/'+CONFIG.maxWave;$('#coin').textContent=S.coin;$('#sumcost').textContent=S.cost;
  $('#sum').disabled=S.over||S.coin<S.cost||!S.grid.includes(null);$('#stage').textContent=CONFIG.stages[S.stage].n;
  for(const k in S.sk){const b=$('#sk-'+k);b.querySelector('em').textContent=S.sk[k];b.disabled=S.sk[k]<1||S.over}}
let tipLock=0;function tip(s,ms){$('#tip').textContent=s;tipLock=performance.now()+(ms||0)}
setInterval(()=>{if(performance.now()>tipLock&&S&&S.sel<0)$('#tip').textContent=TIPS[Math.random()*TIPS.length|0]},7000);

/* ================= 이펙트 도우미 ================= */
function P(o){if(S.pt.length<650)S.pt.push(o)}
function txt(x,y,s,c,sz,dur){if(S.fx.length>170&&sz<16)return;S.fx.push({k:'txt',x,y,s,c,sz:sz||13,l:dur||.8,m:dur||.8})}
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rand(.3,1)*(sp||90);P({sh:'dot',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,gv:0,l:rand(.3,.6),m:.6,c,s:rand(1.5,3.5)})}}
function sparkle(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rand(30,110);P({sh:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,gv:60,l:rand(.5,.9),m:.9,c,s:rand(2.5,4.5)})}}
function splash(x,y,c,n){for(let i=0;i<n;i++)P({sh:'drop',x,y,vx:rand(-60,60),vy:rand(-100,-20),gv:320,l:.45,m:.45,c,s:rand(1.8,3)})}
function poof(x,y,r,c){for(let i=0;i<7;i++)P({sh:'smoke',x:x+rand(-r,r)*.5,y:y+rand(-r,r)*.5,vx:rand(-20,20),vy:rand(-30,-5),gv:0,l:.5,m:.5,c:'rgba(255,255,255,.9)',s:r*.45});
  for(let i=0;i<5;i++)P({sh:'leaf',x,y,vx:rand(-70,70),vy:rand(-100,-30),gv:240,l:.75,m:.75,c,s:rand(3,5),rot:rand(0,6),vr:rand(-10,10)})}
function banner(a,b){S.fx=S.fx.filter(f=>f.k!='banner');S.fx.push({k:'banner',s:a,sub:b||'',l:2,m:2})}
const fmt=n=>n>=1e4?(n/1e4).toFixed(1)+'만':String(Math.round(n));

/* ================= 소환 / 합성 ================= */
function summon(){if(S.over||S.coin<S.cost)return;const em=S.grid.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!em.length){tip('빈 칸이 없어요. 합성해서 자리를 만들어요',2500);return}
  const i=em[Math.random()*em.length|0],ks=Object.keys(CONFIG.units);S.coin-=S.cost;S.cost+=CONFIG.summonInc;
  const u={t:ks[Math.random()*ks.length|0],g:0,cd:.5,gauge:0,ph:Math.random()*6,face:1,spawn:.35,emo:{s:'♪',t:1.2}};S.grid[i]=u;
  const[x,y]=cellXY(i);sparkle(x,y,'#fff6a8',8);burst(x,y+10,'#ffffff',8,60);sfx('summon');ui()}
function merge(){let did=false;const by={};S.grid.forEach((u,i)=>{if(u&&u.g<3)(by[u.t+u.g]=by[u.t+u.g]||[]).push(i)});
  for(const k in by){const a=by[k];while(a.length>=CONFIG.mergeNeed){const ids=a.splice(0,CONFIG.mergeNeed),ti=ids[0],u=S.grid[ti],to=cellXY(ti);
    ids.slice(1).forEach(j=>{S.fx.push({k:'ghost',u:Object.assign({},S.grid[j],{emo:null,atk:0,ultT:0}),from:cellXY(j),to,l:.38,m:.38});S.grid[j]=null});
    u.g++;u.gauge=0;did=true;S.later.push({t:.38,f:()=>{u.sq=.35;u.happy=1.2;u.emo={s:'♥',t:1.2};const c=CONFIG.gradeCol[u.g];S.fx.push({k:'ring',x:to[0],y:to[1],l:.5,m:.5,c,R:40});sparkle(to[0],to[1],c,16);burst(to[0],to[1],'#fff',10,80);txt(to[0],to[1]-26,CONFIG.gradeNames[u.g]+'!',c,u.g==3?22:17,1.1)}})}}
  if(did)sfx('merge');else tip('같은 캐릭터 · 같은 등급이 3개 있어야 합성돼요',2500);ui()}

/* ================= 웨이브 ================= */
function startWave(){S.wave++;const w=S.wave;if(w>1)S.coin+=CONFIG.waveBonus;S.wt=CONFIG.waveInterval;
  if(w%CONFIG.skillRegenWaves==0)for(const k in S.sk)S.sk[k]=Math.min(CONFIG.skillMax,S.sk[k]+1);
  const hp=CONFIG.hpBase*Math.pow(CONFIG.hpGrowth,w-1);S.waveHP=hp;const n=6+Math.floor(w/2),L=[];let t=S.time+1.4;
  const add=(type,c,gap)=>{for(let i=0;i<c;i++){L.push({t,type,hp});t+=gap}};let a='WAVE '+w,b='';
  if(w%10==0){add('rock',3,.9);t+=1;add('boss'+(w/10),1,1.5);add('sprout',5,.6);a='BOSS WAVE';b=CONFIG.bosses[w/10-1].n}
  else if(w%5==0){const ev=['sprout','seed','puff'][((w/5-1)/2)|0]||'sprout';add(ev,ev=='seed'?n*2+6:n+5,ev=='seed'?.28:.42);a='EVENT WAVE '+w;b={sprout:'돌격전',seed:'군집전',puff:'공습전'}[ev]}
  else{const nm=['sprout','rock','seed','puff'];for(let i=0;i<n;i++){let ty=nm[Math.random()*4|0];if(w>=6&&i%4==3)ty=Math.random()<.5?'shield':'bud';add(ty,1,ty=='seed'?.35:.85)}}
  S.q=L;banner(a,b);sfx('wave');ui()}
function spawnE(type,base,s){const d=CONFIG.enemies[type],[x,y]=posAt(s||0);const e={type,d,hp:base*d.hp,max:base*d.hp,s:s||0,spd:CONFIG.speed*d.spd*(1+S.wave*CONFIG.speedGrowth),stun:0,slow:0,sh:(d.sh||0)*base,x,y,dir:1,ph:Math.random()*6,fl:0};S.en.push(e);return e}
function spawnBoss(n,base){const d=CONFIG.bosses[n-1],[x,y]=posAt(0);const e={type:'boss'+n,d,boss:n,hp:base*d.hp,max:base*d.hp,s:0,spd:CONFIG.speed*d.spd*(1+S.wave*CONFIG.speedGrowth*.5),stun:0,slow:0,sh:0,x,y,dir:1,ph:1,fl:0,tm:3};
  S.en.push(e);S.bossE=e;bossCut(e);S.shake=.5;sfx('roar')}
function bossAI(e,dt){
  if(e.boss==1&&!e.enr&&e.hp<e.max*.5){e.enr=1;e.spd*=1.6;txt(e.x,e.y-40,'크아앙!','#ff5c5c',22,1.2);S.shake=.4;sfx('roar')}
  if(e.boss==2){e.tm-=dt;if(e.tm<=0){e.tm=4;for(let k=0;k<3;k++)spawnE('seed',S.waveHP*.45,Math.max(0,e.s-8-k*10));txt(e.x,e.y-44,'퉤퉤퉤!','#ff8fb8',18,1);splash(e.x,e.y-20,'#8fdc6a',10)}}
  if(e.boss==3){e.tm-=dt;if(e.tm<=0){e.tm=6;const us=S.grid.map((u,i)=>u?i:-1).filter(i=>i>=0).sort(()=>Math.random()-.5).slice(0,2);
    us.forEach(i=>{const u=S.grid[i];u.stun=2.5;u.emo={s:'!',t:1};const[x,y]=cellXY(i);S.fx.push({k:'tendril',x:e.x,y:e.y,x2:x,y2:y,l:.7,m:.7})});
    e.sh+=e.max*.12;txt(e.x,e.y-48,'어둠이여…','#d9a0ff',18,1.2);sfx('roar')}}}

/* ================= 전투 ================= */
function pickTarget(range,x,y){let b=null;for(const e of S.en)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<=range&&(!b||e.s>b.s))b=e;return b}
function dmgE(e,d,crit,big){if(e.dead)return;let r=d;if(e.sh>0){const a=Math.min(e.sh,r);e.sh-=a;r-=a}e.hp-=r;e.fl=.12;
  txt(e.x+rand(-8,8),e.y-e.d.r-8,fmt(d)+(crit?'!':''),big?'#ffd23f':crit?'#ff3b3b':'#ffffff',big?20:crit?17:12,crit?.9:.7);if(e.hp<=0)kill(e)}
function hit(e,d,crit,src,big){if(!e||e.dead)return;dmgE(e,d,crit,big);if(e.dead&&src){src.happy=.6;if(Math.random()<.25)src.emo={s:'♪',t:.9}}}
function kill(e){e.dead=1;S.kills++;S.coin+=e.boss?CONFIG.bossCoin:CONFIG.killCoin*(e.d.elite?3:1);sfx('pop');poof(e.x,e.y,e.d.r,e.d.lc);
  if(e.boss){S.bossDown++;S.flash=.45;S.shake=.7;for(let i=0;i<5;i++)S.later.push({t:i*.12,f:()=>{burst(e.x+rand(-30,30),e.y+rand(-30,30),['#ffd23f','#ff6b8a','#fff'][i%3],18,140);sfx('boom')}});
    for(const k in S.sk)S.sk[k]=Math.min(CONFIG.skillMax,S.sk[k]+1);banner('보스 격파!',e.d.n+' 쓰러짐');sfx('fanfare');
    if(e.boss==3){S.en.forEach(o=>{if(!o.dead){o.dead=1;poof(o.x,o.y,o.d.r,o.d.lc)}});S.q=[]}
    const nb=S.bossDown;S.later.push({t:1.6,f:()=>setStage(Math.min(3,e.boss))});S.bossE=null}
  ui()}
function proj(type,x,y,t,dmg,crit,src,dur,arc){S.pr.push({type,sx:x,sy:y,x,y,t:0,dur,tgt:t,tx:t.x,ty:t.y,dmg,crit,src,arc,rot:0})}
function impact(p){const e=p.tgt;
  if(p.type=='tear'){hit(e,p.dmg,p.crit,p.src,p.big);splash(p.x,p.y,'#6cc8ff',7);sfx('plop')}
  else if(p.type=='star'){hit(e,p.dmg,p.crit,p.src);if(!e.dead)e.slow=Math.max(e.slow,1.5);sparkle(p.x,p.y,'#ffe066',5)}
  else if(p.type=='bottle'){hit(e,p.dmg,p.crit,p.src);if(!e.dead){if(!e.boss)e.s=Math.max(0,e.s-9);e.stun=Math.max(e.stun,.3)}splash(p.x,p.y,'#ffb23a',9);for(let i=0;i<4;i++)P({sh:'shard',x:p.x,y:p.y,vx:rand(-80,80),vy:rand(-90,-20),gv:300,l:.4,m:.4,c:'#fff',s:rand(2,4),rot:rand(0,6),vr:rand(-12,12)});sfx('clink')}}
function attack(u,i,x,y,t){const d=CONFIG.units[u.t];let dm=d.dmg*CONFIG.gradeMul[u.g]*(u.rage>0?2:1);const cr=Math.random()<CONFIG.critChance;if(cr)dm*=CONFIG.critMul;if(u.t=='sudal'&&t.boss)dm*=2;
  u.atk=.3;u.ax=Math.atan2(t.y-y,t.x-x);u.face=t.x<x-2?-1:1;
  switch(d.atk){
    case'sword':hit(t,dm,cr,u);S.fx.push({k:'slash',x:t.x,y:t.y,l:.28,m:.28,c:d.fx,a:u.ax+rand(-.5,.5)});for(let j=0;j<3;j++)P({sh:'spark',x:t.x,y:t.y,vx:rand(-90,90),vy:rand(-90,90),gv:0,l:.2,m:.2,c:d.fx,s:3});sfx('sword');break;
    case'claw':hit(t,dm,cr,u);for(const o of S.en)if(o!==t&&!o.dead&&Math.hypot(o.x-t.x,o.y-t.y)<30)hit(o,dm*.5,false,u);S.fx.push({k:'claw',x:t.x,y:t.y,l:.25,m:.25,a:rand(-.6,.6)});sfx('claw');break;
    case'sun':for(const o of S.en)if(!o.dead&&Math.hypot(o.x-t.x,o.y-t.y)<42)hit(o,o===t?dm:dm*.7,cr&&o===t,u);S.fx.push({k:'beam',x:t.x,y:t.y,l:.45,m:.45,r:42});sfx('sun');break;
    case'tear':proj('tear',x,y-6,t,dm,cr,u,.35,22);sfx('tear');break;
    case'star':proj('star',x,y-6,t,dm,cr,u,.28,0);sfx('star');break;
    case'bottle':proj('bottle',x,y-8,t,dm,cr,u,.5,46);sfx('toss');break}}
let cutUntil=0;
function cutin(u){const n=performance.now();if(n<cutUntil)return;cutUntil=n+1500;const d=CONFIG.units[u.t],el=$('#cut');el.className='';el.style.setProperty('--cc',CONFIG.gradeCol[u.g]=='#c9c2b8'?'#ff86a8':CONFIG.gradeCol[u.g]);
  $('#cutname').textContent=d.n+' · '+CONFIG.gradeNames[u.g];$('#cuttxt').textContent=d.shout;
  snap($('#cutpic'),110,92,()=>drawUnit(Object.assign({},u,{atk:0,ultT:.6,face:1,stun:0,emo:null,spawn:0,sq:0,happy:0,rage:0,haste:0}),55,56,AT,{sc:2.2,portrait:1,noShadow:1}));void el.offsetWidth;el.className='go'}
function bossCut(e){cutUntil=performance.now()+1500;const el=$('#cut');el.className='';$('#cutname').textContent='⚠ 보스 등장';$('#cuttxt').textContent=e.d.n;
  snap($('#cutpic'),110,92,()=>drawEnemy(Object.assign({},e,{x:55,y:52,dir:1,fl:0,stun:0,sh:0}),AT,{sc:1.15,portrait:1,noShadow:1}));void el.offsetWidth;el.className='boss go'}
function ult(u,i){const[x,y]=cellXY(i),d=CONFIG.units[u.t],base=d.dmg*CONFIG.gradeMul[u.g];u.gauge=0;u.ultT=1.2;
  if(u.t!='bam')txt(Math.max(60,Math.min(W-60,x)),y-30,d.shout,'#fff6a8',17,1.3);cutin(u);sfx('ult');S.shake=Math.max(S.shake,.25);
  const al=S.en.filter(e=>!e.dead);
  switch(u.t){
    case'komi':u.rage=5;al.sort((a,b)=>b.s-a.s).slice(0,6).forEach((e,k)=>S.later.push({t:k*.08,f:()=>{if(!e.dead)proj('tear',x,y-8,e,base*3,true,u,.4,40)}}));splash(x,y-16,'#6cc8ff',16);break;
    case'haneul':al.sort((a,b)=>b.s-a.s).slice(0,5).forEach((e,k)=>S.later.push({t:.1+k*.09,f:()=>{if(e.dead)return;hit(e,base*4,true,u,true);S.fx.push({k:'xslash',x:e.x,y:e.y,l:.4,m:.4,c:'#3c9dff'});sfx('sword')}}));break;
    case'kkang':S.fx.push({k:'ring',x,y,l:.7,m:.7,c:'#fff3a6',R:520});al.forEach(e=>{e.stun=Math.max(e.stun,1.5);hit(e,base*2,false,u)});break;
    case'mong':al.forEach(e=>e.slow=Math.max(e.slow,4));S.grid.forEach(v=>{if(v)v.haste=4});for(let j=0;j<36;j++)P({sh:'streak',x:rand(-60,W),y:rand(0,H),vx:rand(260,360),vy:rand(-20,20),gv:0,l:rand(.4,.8),m:.8,c:'rgba(255,255,255,.75)',s:2});break;
    case'bam':S.later.push({t:.45,f:()=>{S.fx.push({k:'kya',x:Math.max(90,Math.min(W-90,x)),y:y-38,l:1.6,m:1.6});S.tint={c:'255,170,60',l:.5,m:.5};S.shake=.5;sfx('boom');
      S.en.forEach(e=>{if(e.dead)return;e.s=Math.max(0,e.s-(e.boss?25:70));e.stun=Math.max(e.stun,.5);hit(e,base*2,false,u)});for(let j=0;j<10;j++)P({sh:'bubble',x:x+rand(-14,14),y:y-10,vx:rand(-30,30),vy:rand(-80,-40),gv:0,l:.9,m:.9,c:'#ffb23a',s:rand(2,5)})}});break;
    case'haesa':{const tg=al.sort((a,b)=>b.hp-a.hp)[0];if(tg){S.fx.push({k:'bigsun',x:tg.x,y:tg.y,l:.6,m:.6,tgt:tg});S.later.push({t:.55,f:()=>{const cx=tg.x,cy=tg.y;S.en.forEach(e=>{if(!e.dead&&Math.hypot(e.x-cx,e.y-cy)<85)hit(e,base*12,true,u,true)});S.fx.push({k:'ring',x:cx,y:cy,l:.5,m:.5,c:'#ffd23f',R:110});burst(cx,cy,'#ffd23f',26,160);S.shake=.45;sfx('boom')}})}break}
    case'sudal':{const tg=al.sort((a,b)=>b.hp-a.hp)[0];if(tg){S.fx.push({k:'iaido',x:tg.x,y:tg.y,l:.5,m:.5});S.flash=.25;S.later.push({t:.18,f:()=>hit(tg,base*16*(tg.boss?2:1),true,u,true)})}break}}}
function skill(k){if(S.sk[k]<1||S.over||!S.started)return;initAudio();S.sk[k]--;const al=S.en.filter(e=>!e.dead);

  if(S.shake>0&&!RM)g.translate(rand(-1,1)*S.shake*10,rand(-1,1)*S.shake*10);
  g.drawImage(BG[S.stage],0,0,W,H);if(S.bgFade>0&&S.bgPrev){g.globalAlpha=S.bgFade;g.drawImage(S.bgPrev,0,0,W,H);g.globalAlpha=1}
  for(const a of S.amb)if(a.k=='cloud'){E(a.x,a.y,90,34,'rgba(20,40,20,.07)');E(a.x+50,a.y-12,60,26,'rgba(20,40,20,.06)')}
  if(st.rainbow){['#ff6b6b','#ffb23a','#ffe066','#7ddc6a','#6cc8ff','#a46bff'].forEach((c,i)=>{g.strokeStyle=hexA(c,.32);g.lineWidth=9;g.beginPath();g.arc(W/2,H*.85,380-i*9,Math.PI*1.12,Math.PI*1.88);g.stroke()})}
  drawNest(t);drawHouse(t);drawBoard(t);
  const ens=S.en.filter(e=>!e.dead).sort((a,b)=>(a.d.fly?1:0)-(b.d.fly?1:0)||a.y-b.y);for(const e of ens)drawEnemy(e,t);
  for(const p of S.pr)drawProj(p);
  for(const f of S.fx)if(f.k!='txt'&&f.k!='banner')drawFx(f,t);
  for(const p of S.pt)drawPt(p);
  for(const a of S.amb){if(a.k=='petal'){g.save();g.translate(a.x,a.y);g.rotate(a.rot);E(0,0,3.6,2,a.c,'rgba(200,120,150,.5)',.8);g.restore()}
    else if(a.k=='leaf'){g.save();g.translate(a.x,a.y);g.rotate(a.rot);E(0,0,4.5,2.2,a.c,'rgba(90,50,20,.5)',.8);g.restore()}
    else if(a.k=='ember'){const fl=.6+.4*Math.sin(t*8+a.ph);g.globalAlpha=Math.min(1,a.l/2)*fl;E(a.x+Math.sin(t*2+a.ph)*4,a.y,2.2,2.2,a.c);g.globalAlpha=1}
    else if(a.k=='fog')E(a.x,a.y,a.r,a.r*.4,'rgba(120,80,140,.12)');
    else if(a.k=='bf'){const w=Math.abs(Math.sin(a.ph))*5+1;E(a.x-3,a.y,w,4,a.c,'rgba(58,42,50,.6)',1);E(a.x+3,a.y,w,4,a.c,'rgba(58,42,50,.6)',1);E(a.x,a.y,1,3,OL)}}
  if(!VG){VG=MAIN.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.78);VG.addColorStop(0,'rgba(25,5,30,0)');VG.addColorStop(1,'rgba(25,5,30,1)')}
  const vig=st.vig+(S.stage<3?(S.wave%10)/10*.18:0);g.globalAlpha=Math.min(.6,vig);g.fillStyle=VG;g.fillRect(-20,-20,W+40,H+40);
  if(S.hurt>0){g.globalAlpha=S.hurt*.6;g.fillStyle='rgba(255,40,60,1)';g.globalCompositeOperation='source-over';const hv=MAIN.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);hv.addColorStop(0,'rgba(255,40,60,0)');hv.addColorStop(1,'rgba(255,40,60,1)');g.fillStyle=hv;g.fillRect(-20,-20,W+40,H+40)}
  if(S.tint){g.globalAlpha=S.tint.l/S.tint.m*.3;g.fillStyle=`rgb(${S.tint.c})`;g.fillRect(-20,-20,W+40,H+40)}
  if(S.light>0&&S.bolt){g.globalAlpha=S.light;g.fillStyle='#ffffff';g.fillRect(-20,-20,W+40,H+40);g.globalAlpha=Math.min(1,S.light*2);g.strokeStyle='#f3e6ff';g.lineWidth=3;g.beginPath();S.bolt.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}
  if(S.flash>0){g.globalAlpha=Math.min(.8,S.flash*2);g.fillStyle='#ffffff';g.fillRect(-20,-20,W+40,H+40)}
  g.globalAlpha=1;
  for(const f of S.fx)if(f.k=='txt')drawTxt(f);for(const f of S.fx)if(f.k=='banner')drawBanner(f);
  g.restore()}

/* ================= 화면 / 입력 ================= */
function snap(cnv,w,h,fn){cnv.width=w*DPR;cnv.height=h*DPR;cnv.style.width=w+'px';cnv.style.height=h+'px';const c=cnv.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,w,h);const old=g;g=c;try{fn()}finally{g=old}}
function fakeE(type,boss){const d=boss?CONFIG.bosses[boss-1]:CONFIG.enemies[type];return{type:boss?'boss'+boss:type,d,boss,hp:1,max:1,s:0,ph:1,dir:1,stun:0,fl:0,sh:0,slow:0}}
function openOv(html){S.paused=true;$('#box').innerHTML=html;$('#ov').hidden=false}
function closeOv(){if(!S.started){showStart();return}$("#ov").hidden=true;if(S.started&&!S.over)S.paused=false;$('#pause').textContent='❚❚'}
function showStart(){$('#box').innerHTML=`<div id="title"><h2>말랑말랑 수비대</h2><p class="lead">잡초 군단이 몰려와요. 말랑한 친구들로 마을을 지켜요!</p><canvas id="tcv"></canvas>
  <ul><li>코인으로 친구를 소환하고, 같은 친구 3명을 모아 합성하면 더 멋진 모습으로 진화해요</li><li>10웨이브마다 보스가 나오고, 보스를 쓰러뜨리면 땅의 모습이 바뀌어요</li><li>30웨이브 마지막 보스를 쓰러뜨리면 승리!</li></ul>
  <button class="go" id="startBtn">시작하기</button></div>`;$('#ov').hidden=false;
  $('#startBtn').onclick=()=>{initAudio();S.started=true;S.paused=false;$('#ov').hidden=true;tip('소환 버튼을 눌러 첫 친구를 불러요!',5000)}}
const LINE=[['komi',0],['haneul',1],['kkang',0],['sudal',3],['mong',0],['bam',2],['haesa',1]];
function drawTitle(){const c=$('#tcv');if(!c||$('#ov').hidden)return;snap(c,330,92,()=>{LINE.forEach(([t,gr],i)=>drawUnit({t,g:gr,ph:i*1.3,face:1},26+i*46,54,AT,{sc:i==3?1.05:.9}))})}
function showDex(){let h='<h3>친구들</h3><p class="lead" style="text-align:left">합성할수록 스카프 → 망토와 은관 → 날개와 금관으로 변해요</p>';
  for(const k in CONFIG.units){const d=CONFIG.units[k];h+=`<div class="dexu"><div class="nm">${d.n}</div><div>${d.desc}</div><div style="color:var(--muted);font-size:12.5px">필살기 · ${d.ult}</div><div class="gr">${[0,1,2,3].map(gr=>`<figure><canvas data-u="${k}" data-g="${gr}"></canvas>${CONFIG.gradeNames[gr]}</figure>`).join('')}</div></div>`}
  h+='<h3>잡초 군단</h3><div class="dexe">'+Object.keys(CONFIG.enemies).map(k=>`<figure><canvas data-e="${k}"></canvas>${CONFIG.enemies[k].n}</figure>`).join('')+'</div>';
  h+='<h3>보스</h3>'+CONFIG.bosses.map((b,i)=>`<div class="dexu"><canvas data-b="${i+1}"></canvas><div class="nm">${(i+1)*10}웨이브 · ${b.n}</div><div>${b.desc}</div></div>`).join('');
  h+='<button class="go" id="closeBtn">닫기</button>';openOv(h);$('#closeBtn').onclick=closeOv;
  document.querySelectorAll('#box canvas[data-u]').forEach(c=>snap(c,64,66,()=>drawUnit({t:c.dataset.u,g:+c.dataset.g,ph:1,face:1},32,38,1.2,{sc:1.05,portrait:1})));
  document.querySelectorAll('#box canvas[data-e]').forEach(c=>snap(c,70,56,()=>drawEnemy(Object.assign(fakeE(c.dataset.e),{x:35,y:30}),1.2,{sc:1.4,portrait:1})));
  document.querySelectorAll('#box canvas[data-b]').forEach(c=>snap(c,130,96,()=>drawEnemy(Object.assign(fakeE(null,+c.dataset.b),{x:65,y:50}),1.2,{sc:1.05,portrait:1})))}
function showSet(){openOv(`<h3>설정</h3><button class="go" id="sndBtn" style="background:var(--sky)">소리: ${mute?'꺼짐':'켜짐'}</button><button class="go" id="rstBtn" style="background:var(--honey)">처음부터 다시</button><button class="go" id="closeBtn">닫기</button>`);
  $('#sndBtn').onclick=e=>{mute=!mute;if(MG)MG.gain.value=mute?0:.5;e.target.textContent='소리: '+(mute?'꺼짐':'켜짐')};$('#rstBtn').onclick=()=>{reset();S.started=true;closeOv()};$('#closeBtn').onclick=closeOv}
function end(win){if(S.over)return;S.over=true;const leg=S.grid.filter(u=>u&&u.g==3).length;
  openOv(`<h2>${win?'마을을 지켰어요!':'잡초가 마을에 닿았어요'}</h2><p class="lead">${win?'무지개 초원이 돌아왔어요':'다시 도전해 볼까요?'}</p><ul><li>도달 웨이브 ${S.wave} / ${CONFIG.maxWave}</li><li>쓰러뜨린 보스 ${S.bossDown}</li><li>물리친 잡초 ${S.kills}</li><li>전설 친구 ${leg}명</li></ul><button class="go" id="againBtn">다시 하기</button>`);
  $('#againBtn').onclick=()=>{reset();S.started=true;closeOv()}}
cv.addEventListener('pointerdown',ev=>{initAudio();if(!S.started||S.over)return;const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width,y=(ev.clientY-r.top)*H/r.height,c=Math.floor((x-GX)/CS),rw=Math.floor((y-GY)/CS);
  if(c<0||c>=COLS||rw<0||rw>=ROWS){S.sel=-1;return}const i=rw*COLS+c;
  if(S.sel<0){if(S.grid[i]){S.sel=i;const u=S.grid[i],d=CONFIG.units[u.t];u.sq=.25;tip(`${d.n} · ${CONFIG.gradeNames[u.g]} · 공격력 ${fmt(d.dmg*CONFIG.gradeMul[u.g])} · 필살기: ${d.ult}`,999999)}}
  else if(i===S.sel){S.sel=-1;tipLock=0}
  else{const a=S.grid[S.sel];S.grid[S.sel]=S.grid[i];S.grid[i]=a;if(a)a.sq=.3;if(S.grid[S.sel])S.grid[S.sel].sq=.3;S.sel=-1;tipLock=0;sfx('pop')}});
$('#sum').onclick=()=>{initAudio();summon()};$('#mrg').onclick=()=>{initAudio();merge()};
document.querySelectorAll('.sk').forEach(b=>b.onclick=()=>skill(b.dataset.k));
$('#pause').onclick=()=>{if(!S.started||S.over)return;S.paused=!S.paused;$('#pause').textContent=S.paused?'▶':'❚❚';if(S.paused)banner('일시정지')};
$('#spd').onclick=()=>{S.speed=S.speed%3+1;$('#spd').textContent='×'+S.speed};
$('#dex').onclick=showDex;$('#set').onclick=showSet;

/* ================= 루프 ================= */
let lastT=performance.now(),AT=0;
function frame(n){const rdt=Math.min(.05,(n-lastT)/1000);lastT=n;const run=S.started&&!S.paused&&!S.over;
  if(run||!S.started){AT+=rdt;ambUpdate(rdt)}
  if(run){for(let i=0;i<S.speed;i++)update(rdt);
    S.bgFade=Math.max(0,S.bgFade-rdt/2.4);for(const k of['shake','flash','hurt','homeHit'])if(S[k]>0)S[k]=Math.max(0,S[k]-rdt);if(S.tint){S.tint.l-=rdt;if(S.tint.l<=0)S.tint=null}}
  if(S.paused&&S.started&&!S.over){for(const f of S.fx)if(f.k=='banner'&&f.l>1)f.l=1.2}
  draw();drawTitle();
  const b=S.bossE;const bb=$('#bossbar');if(b&&!b.dead){if(bb.hidden)bb.hidden=false;$('#bname').textContent=b.d.n;$('#bpct').textContent=Math.ceil(Math.max(0,b.hp)/b.max*100)+'%';$('#bfill').style.width=Math.max(0,b.hp/b.max*100)+'%';$('#bsh').style.width=Math.min(100,b.sh/b.max*100)+'%'}else if(!bb.hidden)bb.hidden=true;
  requestAnimationFrame(frame)}
for(let i=0;i<4;i++)BG.push(makeBG(i));
reset();showStart();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
</script>
