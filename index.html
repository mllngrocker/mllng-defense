<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말랑 오락실</title>
<meta name="description" content="링크 하나로 바로 하는 말랑말랑 미니 게임 모음">
<meta name="theme-color" content="#fff7f2">
<meta property="og:title" content="말랑 오락실">
<meta property="og:description" content="링크 하나로 바로 하는 말랑말랑 미니 게임 모음">
<meta property="og:image" content="lost-home/thumb.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* Layout: slim brand bar, a featured hero (newest game), then a responsive card grid */
:root{
  --bg:#fff7f2;--bg2:#ffeef4;--card:#ffffff;--ink:#23191f;--muted:#7a6872;--line:rgba(35,25,31,.08);
  --rose:#ff5d8f;--rose2:#ff8fb1;--honey:#ffc83d;--mint:#3ccf9a;--sky:#4aa8ff;
  --sh-1:0 1px 2px rgba(60,20,40,.06),0 8px 24px rgba(60,20,40,.08);
  --sh-2:0 2px 4px rgba(60,20,40,.08),0 18px 40px rgba(60,20,40,.14);
  --f-disp:"Jua","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#16121a;--bg2:#1e1622;--card:#221b27;--ink:#f6edf2;--muted:#b3a3ad;--line:rgba(255,255,255,.08);
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--sh-2:0 2px 4px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,var(--bg2),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(74,168,255,.10),transparent 60%),var(--bg);
  color:var(--ink);font-family:var(--f-body);min-height:100vh;-webkit-font-smoothing:antialiased;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
/* brand bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,var(--rose2),var(--rose));display:grid;place-items:center;box-shadow:0 6px 14px rgba(255,93,143,.35);position:relative}
.logo::before,.logo::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;top:16px}
.logo::before{left:12px}.logo::after{right:12px}
.logo i{position:absolute;bottom:10px;width:12px;height:6px;border:2.5px solid #fff;border-top:0;border-radius:0 0 10px 10px}
.brand b{font-family:var(--f-disp);font-weight:400;font-size:24px;letter-spacing:.01em}
.count{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:var(--sh-1)}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:1.25fr 1fr;border-radius:28px;overflow:hidden;background:var(--card);box-shadow:var(--sh-2);text-decoration:none;color:inherit;isolation:isolate;transition:transform .2s}
.hero:hover{transform:translateY(-3px)}
.hero:focus-visible{outline:3px solid var(--rose);outline-offset:4px}
.hero .art{position:relative;min-height:260px;overflow:hidden}
.hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;image-rendering:pixelated;transition:transform .6s}
.hero:hover .art img{transform:scale(1.04)}
.hero .info{padding:28px 28px 26px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.kicker{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--rose);background:rgba(255,93,143,.12);border-radius:999px;padding:5px 10px}
.kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rose);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.hero h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.65}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:18px;color:#fff;background:linear-gradient(180deg,var(--rose2),var(--rose));border-radius:14px;padding:11px 22px;box-shadow:0 8px 18px rgba(255,93,143,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn svg{width:14px;height:14px}
/* section */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px -8px}
.sec h3{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:0}
.sec small{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--sh-1);display:flex;flex-direction:column;min-width:0;color:inherit;text-decoration:none;transition:transform .18s,box-shadow .18s}
a.card:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
a.card:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.card .thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg2)}
.card img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s}
a.card:hover img{transform:scale(1.05)}
.card .thumb .play{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:translateY(6px);opacity:0;transition:.2s}
a.card:hover .play,a.card:focus-visible .play{transform:none;opacity:1}
.card .thumb .play svg{width:16px;height:16px;fill:var(--rose);margin-left:2px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h4{font-family:var(--f-disp);font-weight:400;font-size:21px;margin:0;line-height:1.2}
.body p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.soon{background:transparent;box-shadow:none;border:2px dashed var(--line);border-color:rgba(122,104,114,.35)}
.soon .thumb{display:grid;place-items:center;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(122,104,114,.06) 12px 24px)}
.soon .thumb span{font-family:var(--f-disp);font-size:54px;color:var(--muted);opacity:.6}
h2,h4,p{word-break:keep-all}
.sec{flex-wrap:wrap;gap:4px 12px}.sec h3{white-space:nowrap}
.soon .thumb{aspect-ratio:auto;height:120px}
footer{text-align:center;color:var(--muted);font-size:13px;padding-top:6px}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero .art{min-height:0;aspect-ratio:4/3}.hero .info{padding:20px 20px 22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="./" aria-label="말랑 오락실 홈"><span class="logo" aria-hidden="true"><i></i></span><b>말랑 오락실</b></a>
    <span class="count" id="count"></span>
  </header>
  <div id="hero"></div>
  <div class="sec"><h3>모든 게임</h3><small>링크 하나로 바로 플레이 · 기록은 각자 기기에 저장</small></div>
  <section class="grid" id="games"></section>
  <footer>말랑 오락실 · 휴대폰에서도 바로 플레이할 수 있어요</footer>
</main>
<script>
/* 새 게임을 추가할 때는 이 목록에 한 줄만 넣으면 돼요. 맨 마지막 게임이 위쪽 대표 칸에 나와요 */
const GAMES=[
  {path:'mallang-defense/',title:'말랑말랑 수비대',desc:'말랑한 친구들을 소환하고 합성해서 50웨이브 동안 잡초 군단을 막는 디펜스 게임.',thumb:'mallang-defense/thumb.jpg',tags:['디펜스','합성','맵 5종']},
  {path:'lost-home/',title:'잃어버린 고향을 찾아서',desc:'고향 빙하를 잃은 백곰 북실이가 판자 하나 들고 10챕터를 모험하는 도트 방치형 RPG. 장비 뽑기, 펫, 마왕 메가와트까지.',thumb:'lost-home/thumb.jpg',tags:['방치형','RPG','챕터 10','펫 16종'],pixel:true}
];
const SOON=1;
const PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.8v12.4c0 .8.9 1.3 1.6.9l10-6.2c.6-.4.6-1.4 0-1.8l-10-6.2C3.9.5 3 1 3 1.8z" fill="currentColor"/></svg>';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tags=g=>`<div class="tags">${g.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`;
const f=GAMES[GAMES.length-1];
document.getElementById('hero').outerHTML=`<a class="hero" href="${f.path}"><div class="art"><img src="${f.thumb}" alt="${esc(f.title)} 게임 화면"></div>
  <div class="info"><span class="kicker">NEW · 새로 나온 게임</span><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p>${tags(f)}<span class="btn">${PLAY}지금 플레이</span></div></a>`;
document.getElementById('games').innerHTML=GAMES.slice().reverse().map(g=>`<a class="card" href="${g.path}"><div class="thumb"><img src="${g.thumb}" alt="${esc(g.title)} 게임 화면" loading="lazy"${g.pixel?' style="image-rendering:pixelated"':''}><span class="play">${PLAY.replace('currentColor','')}</span></div><div class="body"><h4>${esc(g.title)}</h4>${tags(g)}<p>${esc(g.desc)}</p></div></a>`).join('')
  +Array.from({length:SOON},()=>`<div class="card soon" aria-label="준비 중인 게임"><div class="thumb"><span>?</span></div><div class="body"><h4>다음 게임</h4><p>새 게임을 만드는 중이에요. 곧 여기에 나타나요!</p></div></div>`).join('');
document.getElementById('count').textContent=`게임 ${GAMES.length}개`;
</script>
</body>
</html>
