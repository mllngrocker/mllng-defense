<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<title>말랑말랑 수비대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: handheld column — status strip, skill row, field window (400x560), tip line, action pad */
:root{
  --bg:#dcefff;--bg2:#c8e3fa;--panel:#ffffff;--ink:#3a2a32;--muted:#7c6a76;--line:#3a2a32;
  --honey:#ffd25e;--leaf:#9be37a;--rose:#ff86a8;--sky:#9fd0ff;--btn-ink:#3a2a32;
  --f-disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2233;--bg2:#242e46;--panel:#2b344b;--ink:#f4eaf0;--muted:#b9aab6;--line:#0d111d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b2233;--bg2:#242e46;--panel:#2b344b;--ink:#f4eaf0;--muted:#b9aab6;--line:#0d111d;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--bg2) 1.6px,transparent 1.8px);background-size:18px 18px;color:var(--ink);font-family:var(--f-disp);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-user-select:none;user-select:none;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-width:0}
.pill{background:var(--panel);border:2.5px solid var(--line);border-radius:999px;box-shadow:0 3px 0 var(--line);padding:3px 8px;display:flex;gap:4px;align-items:center;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .h{color:#ff5c7f}.pill .c{color:#f0a818}.pill small{color:var(--muted);font-size:11px;letter-spacing:.06em}
#stage{margin-left:auto;background:var(--leaf);color:var(--btn-ink);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block}
button{font:inherit;color:var(--btn-ink);background:var(--honey);border:2.5px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);padding:5px 10px;cursor:pointer;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button:disabled{filter:grayscale(.8);opacity:.55}
button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.sk{background:var(--sky);display:flex;gap:3px;align-items:center;font-size:12px;padding:4px 7px;white-space:nowrap}
.sk em{font-style:normal;background:var(--panel);color:var(--ink);border-radius:8px;padding:0 5px;font-size:11px}
.sp{flex:1}
#pause,#spd{background:var(--panel);color:var(--ink);min-width:36px;padding:4px 7px;font-size:13px}
#field{position:relative;width:min(100%,max(250px,calc((100vh - 215px)*.714)));width:min(100%,max(250px,calc((100dvh - 215px)*.714)));aspect-ratio:400/560;margin:0 auto;max-width:100%}
#cv{width:100%;height:100%;display:block;border-radius:18px;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);touch-action:manipulation;background:#7cc95e}

.tiprow{display:flex;gap:6px;align-items:stretch}.tiprow #tip{flex:1;min-width:0}#sell{background:var(--honey);font-size:14px;white-space:nowrap;padding:4px 10px}
.mapc small.rec{color:var(--rose);font-family:var(--f-disp);font-size:11.5px}
#tip{background:var(--panel);border:2.5px solid var(--line);border-radius:14px;padding:6px 10px;font-family:var(--f-body);font-size:13.5px;text-align:center;min-height:34px;display:flex;align-items:center;justify-content:center}
#bar{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:7px}
#bar button{padding:10px 4px;font-size:16px}
#sum{background:var(--rose);display:flex;flex-direction:column;align-items:center;line-height:1.05}
#sum small{font-size:12px}
#mrg{background:var(--leaf)}
#mrg.ready{animation:glow 1s infinite alternate}
@keyframes glow{to{background:#d8ff9a;transform:translateY(-2px)}}
#dex,#set{background:var(--panel);color:var(--ink)}
#cut{position:absolute;left:-6px;right:-6px;top:34%;height:92px;display:flex;align-items:center;gap:8px;padding:0 16px;
  background:linear-gradient(100deg,transparent 0,var(--cc,#ff86a8) 10%,var(--cc,#ff86a8) 90%,transparent);transform:skewY(-5deg);opacity:0;pointer-events:none;overflow:hidden}
#cut::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 3px,transparent 3px 22px);animation:speed .3s linear infinite}
@keyframes speed{to{background-position:-25px 0}}
#cut canvas{position:relative;width:110px;height:92px;flex:none}
#cut div{position:relative;color:#fff;text-shadow:2px 2px 0 #3a2a32,-1px -1px 0 #3a2a32,1px -1px 0 #3a2a32,-1px 1px 0 #3a2a32;min-width:0}
#cut b{display:block;font-weight:400;font-size:14px;opacity:.95}
#cut span{display:block;font-size:27px}
#cut.go{animation:cut 1.25s ease-out}
#cut.boss{--cc:#c0283f}
@keyframes cut{0%{opacity:0;transform:skewY(-5deg) translateX(-90px)}14%{opacity:1;transform:skewY(-5deg) translateX(0)}82%{opacity:1;transform:skewY(-5deg) translateX(8px)}100%{opacity:0;transform:skewY(-5deg) translateX(90px)}}
#bossbar{position:absolute;top:8px;left:14%;right:14%;background:rgba(40,16,30,.82);border:2.5px solid #12060c;border-radius:12px;padding:4px 8px 6px;color:#fff;font-size:13px}
#bossbar .bn{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
#bossbar .tr{position:relative;height:9px;border-radius:6px;background:#4a2236;overflow:hidden;margin-top:3px}
#bfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff3b5c,#ff9a3a);border-radius:6px;transition:width .15s}
#bsh{position:absolute;inset:0 auto 0 0;background:rgba(150,220,255,.75);border-radius:6px}
#ov{position:fixed;inset:0;background:rgba(20,12,24,.6);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px max(16px,env(safe-area-inset-left,0px))}
#box{background:var(--panel);color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:20px;padding:16px;max-width:420px;width:100%;max-height:86vh;overflow:auto;font-family:var(--f-body);font-size:14px;line-height:1.55}
#box h2,#box h3{font-family:var(--f-disp);font-weight:400;margin:0 0 6px;text-wrap:balance}
#box h2{font-size:30px;text-align:center;color:var(--rose)}
#box h3{font-size:19px;margin-top:10px}
#box .lead{text-align:center;color:var(--muted);margin:0 0 8px}
#box ul{margin:6px 0 10px;padding-left:20px}
#box .go{display:block;width:100%;font-size:20px;padding:11px;background:var(--rose);margin-top:8px}
.dexu{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-bottom:2px dashed var(--bg2)}
.dexu .nm{font-family:var(--f-disp);font-size:16px}
.dexu .gr{display:flex;gap:2px;justify-content:space-between}
.dexu .gr figure{margin:0;text-align:center;font-size:10.5px;color:var(--muted);flex:1;min-width:0}
.dexu canvas{display:block;margin:0 auto;max-width:100%}
.dexe{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dexe figure{margin:0;text-align:center;font-size:11.5px}
#title canvas{display:block;margin:0 auto;max-width:100%}
.maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:4px 0 6px}
.mapc{background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 7px;font-family:var(--f-disp);min-width:0}
.mapc b{font-weight:400;font-size:14px}.mapc small{font-family:var(--f-body);font-size:11px;line-height:1.3;color:var(--muted)}
.mapc canvas{display:block;max-width:100%;border-radius:8px}
.mapc.on{background:var(--leaf);color:var(--btn-ink)}.mapc.on small{color:var(--btn-ink)}
@media (prefers-reduced-motion:reduce){#cut.go{animation-duration:.01s}#mrg.ready{animation:none}}
</style>

<div id="app">
  <div class="row">
    <span class="pill"><span class="h">♥</span><b id="lives">10</b></span>
    <span class="pill"><small>WAVE</small><b id="wave">0/30</b></span>
    <span class="pill"><span class="c">●</span><b id="coin">40</b></span>
    <span class="pill" id="stage">햇살 초원</span>
  </div>
  <div class="row">
    <button class="sk" id="sk-stun" data-k="stun">★ 기절 <em>1</em></button>
    <button class="sk" id="sk-blast" data-k="blast">✸ 섬멸 <em>1</em></button>
    <button class="sk" id="sk-slow" data-k="slow">❄ 감속 <em>1</em></button>
    <span class="sp"></span>
    <button id="pause" aria-label="일시정지">❚❚</button>
    <button id="spd">×1</button>
  </div>
  <div id="field">
    <canvas id="cv"></canvas>
    <div id="bossbar" hidden><div class="bn"><span id="bname"></span><span id="bpct"></span></div><div class="tr"><i id="bfill"></i><b id="bsh"></b></div></div>
    <div id="cut"><canvas id="cutpic"></canvas><div><b id="cutname"></b><span id="cuttxt"></span></div></div>
  </div>
  <div class="tiprow"><div id="tip">캐릭터를 소환해서 마을을 지켜요</div><button id="sell" hidden>판매</button></div>
  <nav id="bar">
    <button id="sum"><span>소환</span><small>● <span id="sumcost">10</span></small></button>
    <button id="mrg">합성</button>
    <button id="dex">도감</button>
    <button id="set">설정</button>
  </nav>
</div>
<div id="ov"><div id="box"></div></div>

const TIPS=['같은 캐릭터·같은 등급 2개를 모아 합성하면 완전히 새로운 모습으로 진화해요','캐릭터를 눌러 선택하고, 다른 칸을 누르면 자리를 옮겨요','10웨이브마다 보스가 나와요. 잡으면 땅의 모습이 바뀌어요','수달검객은 보스에게 2배 피해를 줘요','5웨이브마다 스킬 사용 횟수가 1씩 충전돼요','밤톨이의 "캬아~"는 모든 적을 뒤로 밀어내요','깡총이의 여의봉은 맞은 적 주변까지 때려요','설정에서 다른 맵으로 바꿀 수 있어요','캐릭터를 선택하면 판매 버튼이 나와요. 칸이 모자랄 때 써 보세요','설정에서 자동 합성을 켤 수 있어요','강한 스킬로 단번에 섬멸!'];

/* ================= 기본 상수/도구 ================= */
const $=s=>document.querySelector(s);
const W=400,H=560,COLS=7,ROWS=10,CS=52,GX=18,GY=24,OL='#3a2a32';
const cpx=(c,r)=>[GX+c*CS+CS/2,GY+r*CS+CS/2];
const cellXY=i=>cpx(i%COLS,Math.floor(i/COLS));
let PATH,SEG,TOT,PATHSET,BUILD,HOMEP,NESTP,SPEEDK=1;
function loadMap(mi){const m=CONFIG.maps[mi];PATH=m.wp.map(([c,r])=>cpx(c,r));SEG=[];TOT=0;
  for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);SEG.push({a,b,l,s0:TOT});TOT+=l}
  PATHSET=new Set();for(let i=0;i<m.wp.length-1;i++){let[c,r]=m.wp[i];const[c2,r2]=m.wp[i+1],dc=Math.sign(c2-c),dr=Math.sign(r2-r);
    for(;;){if(c>=0&&c<COLS&&r>=0&&r<ROWS)PATHSET.add(r*COLS+c);if(c===c2&&r===r2)break;c+=dc;r+=dr}}
  BUILD=new Set();for(let i=0;i<COLS*ROWS;i++){if(PATHSET.has(i))continue;const c=i%COLS,r=Math.floor(i/COLS);let near=false;
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const cc=c+a,rr=r+b;if(cc>=0&&cc<COLS&&rr>=0&&rr<ROWS&&PATHSET.has(rr*COLS+cc))near=true}if(near)BUILD.add(i)}
  HOMEP=PATH[PATH.length-1];const w0=m.wp[0],w1=m.wp[1];NESTP=cpx(w0[0]+Math.sign(w1[0]-w0[0]),w0[1]+Math.sign(w1[1]-w0[1]));SPEEDK=TOT/1666}
function posAt(s){s=Math.max(0,Math.min(TOT,s));for(const q of SEG){if(s<=q.s0+q.l){const k=(s-q.s0)/q.l;return[q.a[0]+(q.b[0]-q.a[0])*k,q.a[1]+(q.b[1]-q.a[1])*k]}}return PATH[PATH.length-1]}
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DPR=Math.min(2,window.devicePixelRatio||1);
const cv=$('#cv');cv.width=W*DPR;cv.height=H*DPR;
const MAIN=cv.getContext('2d');let g=MAIN;
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function E(x,y,rx,ry,fill,stroke,lw,rot){g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2.4;g.stroke()}}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function star(x,y,r,n=5,inner=.45){g.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,rr=i%2?r*inner:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath()}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function shade(h,p){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(p>0?v+(255-v)*p:v*(1+p))));return'#'+[n>>16,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')}

/* ================= 배경 (맵 x 스테이지별로 미리 그림) ================= */
function flower(x,y,c,s){for(let i=0;i<5;i++){const a=i/5*TAU;E(x+Math.cos(a)*s,y+Math.sin(a)*s,s*.8,s*.8,c)}E(x,y,s*.6,s*.6,'#ffd23f')}
function tuft(x,y,c){g.strokeStyle=c;g.lineWidth=1.6;g.lineCap='round';for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(x+i*1.5,y);g.lineTo(x+i*3,y-5-(2-Math.abs(i))*1.5);g.stroke()}}
function bush(x,y,r,c1,c2){E(x,y+r*.35,r*1.15,r*.45,'rgba(0,0,0,.15)');for(const[a,b,s]of[[-.5,0,.7],[.5,0,.7],[0,-.35,.8]])E(x+a*r,y+b*r,r*s,r*s,c2,'rgba(58,42,50,.55)',1.4);E(x,y-.1*r,r*.75,r*.62,c1);E(x-r*.25,y-r*.4,r*.25,r*.16,'rgba(255,255,255,.3)')}
function mush(x,y,c,glow){if(glow)E(x,y-3,9,9,hexA(c,.25));RR(x-1.5,y-3,3,5,1);g.fillStyle='#f3ead8';g.fill();g.beginPath();g.ellipse(x,y-3,5,4,0,Math.PI,0);g.closePath();g.fillStyle=c;g.fill();g.strokeStyle='rgba(58,42,50,.6)';g.lineWidth=1;g.stroke();E(x-1.5,y-5,1,1,'#fff');E(x+2,y-4.5,.8,.8,'#fff')}
function thorn(x,y,s){g.fillStyle='#2b1b30';for(let i=0;i<6;i++){const a=i/6*TAU;g.beginPath();g.moveTo(x+Math.cos(a+.35)*s*.3,y+Math.sin(a+.35)*s*.3);g.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s);g.lineTo(x+Math.cos(a-.35)*s*.3,y+Math.sin(a-.35)*s*.3);g.fill()}E(x,y,s*.35,s*.35,'#3d2644')}
function rock(x,y,s,c){E(x,y+s*.5,s*1.2,s*.4,'rgba(0,0,0,.18)');E(x,y,s*1.1,s*.8,c,'rgba(58,42,50,.6)',1.5);E(x-s*.35,y-s*.3,s*.35,s*.18,'rgba(255,255,255,.35)')}
function tree(x,y,s,c1,c2,trunk,fruit){E(x,y+s*.95,s*.95,s*.3,'rgba(0,0,0,.2)');RR(x-s*.16,y+s*.1,s*.32,s*.85,s*.1);g.fillStyle=trunk;g.fill();g.strokeStyle='rgba(58,42,50,.6)';g.lineWidth=1.4;g.stroke();
  for(const[a,b,k]of[[-.45,.05,.62],[.45,.05,.62],[0,-.35,.78],[-.25,-.05,.6],[.25,-.1,.6]])E(x+a*s,y+b*s,s*k,s*k*.92,c2,'rgba(58,42,50,.55)',1.4);
  E(x,y-.12*s,s*.82,s*.62,c1);E(x-s*.3,y-s*.45,s*.28,s*.16,'rgba(255,255,255,.3)');
  if(fruit)for(const[a,b]of[[-.4,-.1],[.35,.05],[.05,-.45]])E(x+a*s,y+b*s,s*.09,s*.09,fruit,'rgba(58,42,50,.5)',1)}
function deadTree(x,y,s){E(x,y+s*.95,s*.8,s*.25,'rgba(0,0,0,.3)');g.strokeStyle='#24152a';g.lineCap='round';g.lineWidth=s*.28;g.beginPath();g.moveTo(x,y+s*.9);g.lineTo(x,y-s*.2);g.stroke();
  g.lineWidth=s*.12;for(const[a,b,c,d]of[[0,-.1,-.55,-.6],[0,.1,.5,-.35],[-.3,-.35,-.4,-.85],[.3,-.25,.55,-.75],[0,-.2,.1,-.9]]){g.beginPath();g.moveTo(x+a*s,y+b*s);g.lineTo(x+c*s,y+d*s);g.stroke()}
  E(x+s*.15,y-s*.1,s*.08,s*.08,'#ff3b5c')}
function pond(x,y,s,c){E(x,y,s*1.15,s*.7,shade(c,-.3));E(x,y-1,s*1.05,s*.6,c);E(x-s*.4,y-s*.2,s*.3,s*.08,'rgba(255,255,255,.5)');E(x+s*.5,y+s*.15,s*.22,s*.12,'#6fc05a','rgba(58,42,50,.4)',1)}
function pine(x,y,s,snow){E(x,y+s*1.05,s*.8,s*.25,'rgba(0,0,0,.18)');RR(x-s*.12,y+s*.6,s*.24,s*.45,2);g.fillStyle='#7a4a2a';g.fill();
  for(let i=0;i<3;i++){const yy=y+s*.65-i*s*.5,w=s*(.95-i*.22);g.beginPath();g.moveTo(x-w,yy);g.lineTo(x,yy-s*.75);g.lineTo(x+w,yy);g.closePath();g.fillStyle=i%2?'#3f8a5a':'#4f9a66';g.fill();g.strokeStyle='rgba(58,42,50,.55)';g.lineWidth=1.3;g.stroke();
    if(snow){g.beginPath();g.moveTo(x-w*.55,yy-s*.3);g.lineTo(x,yy-s*.75);g.lineTo(x+w*.55,yy-s*.3);g.quadraticCurveTo(x,yy-s*.15,x-w*.55,yy-s*.3);g.fillStyle='#ffffff';g.fill()}}}
function snowman(x,y,s){E(x,y+s*.9,s*.8,s*.22,'rgba(0,0,0,.15)');E(x,y+s*.45,s*.6,s*.55,'#fff','rgba(58,42,50,.5)',1.3);E(x,y-s*.3,s*.42,s*.4,'#fff','rgba(58,42,50,.5)',1.3);E(x-s*.14,y-s*.36,1.4,1.4,OL);E(x+s*.14,y-s*.36,1.4,1.4,OL);g.fillStyle='#ff8a3d';g.beginPath();g.moveTo(x,y-s*.28);g.lineTo(x+s*.3,y-s*.24);g.lineTo(x,y-s*.2);g.fill();RR(x-s*.45,y-s*.05,s*.9,s*.14,3);g.fillStyle='#e2434f';g.fill()}
function lava(x,y,s){E(x,y,s*1.2,s*.72,'#3a1a10');E(x,y-1,s*1.05,s*.6,'#ff6a1a');E(x,y-2,s*.7,s*.36,'#ffb23a');E(x-s*.3,y-s*.15,s*.18,s*.08,'#fff2a0')}
function bigDecor(kind,x,y,R){const q=R();
  if(kind=='winter'){if(q<.55)pine(x,y-8,15,true);else if(q<.7)snowman(x,y-4,13);else if(q<.85)rock(x,y,11,'#cfe2f0');else pond(x,y,15,'#a8dcff');return}
  if(kind=='volcano'){if(q<.35)lava(x,y,15);else if(q<.65)deadTree(x,y-6,16);else rock(x,y,12,'#2a2028');return}
  if(kind=='meadow'||kind=='rainbow'){if(q<.5)tree(x,y-6,15,'#7ad35e','#4fae44','#9a6a3e',R()<.4?'#ff6b6b':null);else if(q<.7)bush(x,y,12,'#6cc955','#3f9a38');else if(q<.82)pond(x,y,15,'#7cc8ff');else{for(let i=0;i<5;i++)flower(x+(R()-.5)*30,y+(R()-.5)*26,['#ff9ec4','#fff','#ffd84a','#b9a6ff'][R()*4|0],2.4)}}
  else if(kind=='autumn'){if(q<.55)tree(x,y-6,15,'#f0a040','#cf6a2a','#7a4a2a',R()<.5?'#c0392b':null);else if(q<.75)bush(x,y,11,'#d9953f','#a8622a');else if(q<.9)rock(x,y,11,'#b8a88a');else{for(let i=0;i<4;i++)mush(x+(R()-.5)*26,y+(R()-.5)*20,'#e05a4a')}}
  else{if(q<.45)deadTree(x,y-6,17);else if(q<.7){for(let i=0;i<3;i++)thorn(x+(R()-.5)*24,y+(R()-.5)*20,8+R()*5)}else if(q<.85){for(let i=0;i<4;i++)mush(x+(R()-.5)*26,y+(R()-.5)*20,R()<.5?'#c86bff':'#4fe0d0',true)}else rock(x,y,12,'#4a3a4e')}}
function smallDecor(kind,x,y,R){const q=R();
  if(kind=='winter'){if(q<.5)E(x,y,rand(2,4),rand(1.2,2),'#ffffff');else{g.strokeStyle='#bfe3ff';g.lineWidth=1.2;for(let i=0;i<3;i++){const a=i*Math.PI/3;g.beginPath();g.moveTo(x-Math.cos(a)*3,y-Math.sin(a)*3);g.lineTo(x+Math.cos(a)*3,y+Math.sin(a)*3);g.stroke()}}return}
  if(kind=='volcano'){if(q<.4)E(x,y,1.6,1.6,'#ff8a3d');else tuft(x,y,'#1a0e0a');return}
  if(kind=='meadow'||kind=='rainbow'){if(q<.45)flower(x,y,['#ff9ec4','#fff','#ffd84a','#b9a6ff','#ff7a7a'][R()*5|0],1.8+R()*1.2);else tuft(x,y,'#4f9e3d')}
  else if(kind=='autumn'){if(q<.5)E(x,y,3.5,1.7,['#e8892f','#d4542c','#e6b43a'][R()*3|0],null,0,R()*6);else tuft(x,y,'#8f7032')}
  else{if(q<.4)thorn(x,y,4+R()*3);else tuft(x,y,'#24162a')}}
function freeSpot(x,y){if(x<2||x>W-2||y<2||y>H-2)return false;
  const c=Math.floor((x-GX)/CS),r=Math.floor((y-GY)/CS);if(c>=0&&c<COLS&&r>=0&&r<ROWS&&BUILD.has(r*COLS+c))return false;
  for(const q of SEG){const ax=q.a[0],ay=q.a[1],bx=q.b[0],by=q.b[1],l2=(bx-ax)**2+(by-ay)**2;let u=((x-ax)*(bx-ax)+(y-ay)*(by-ay))/l2;u=Math.max(0,Math.min(1,u));if(Math.hypot(x-(ax+u*(bx-ax)),y-(ay+u*(by-ay)))<24)return false}return true}
function makeBG(si,mi){
  const st=CONFIG.stages[si],c=document.createElement('canvas');c.width=W*DPR;c.height=H*DPR;const cx=c.getContext('2d');cx.setTransform(DPR,0,0,DPR,0,0);
  const old=g;g=cx;const R=rng(11+si*97+mi*7919),rr=(a,b)=>a+R()*(b-a);
  const gr=g.createRadialGradient(W/2,H*.45,40,W/2,H/2,430);gr.addColorStop(0,st.g1);gr.addColorStop(1,st.g2);g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<50;i++){g.globalAlpha=.22;E(rr(0,W),rr(0,H),rr(20,60),rr(10,26),R()<.5?st.p1:st.p2,null,0,rr(0,3))}g.globalAlpha=1;
  g.lineCap='round';
  for(let i=0;i<1000;i++){const x=rr(0,W),y=rr(0,H);g.strokeStyle=R()<.5?st.b1:st.b2;g.lineWidth=1.1;g.beginPath();g.moveTo(x,y);g.lineTo(x+rr(-2,2),y-rr(2.5,6));g.stroke()}
  if(st.crack){for(let i=0;i<16;i++){let x=rr(0,W),y=rr(0,H);g.beginPath();g.moveTo(x,y);for(let j=0;j<5;j++){x+=rr(-14,14);y+=rr(-14,14);g.lineTo(x,y)}g.strokeStyle=st.crackC||'rgba(255,80,200,.35)';g.lineWidth=3;g.stroke();g.strokeStyle='rgba(20,6,24,.7)';g.lineWidth=1.2;g.stroke()}}
  // 길
  g.lineJoin='round';const sp=(col,w,dy)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();PATH.forEach((p,i)=>i?g.lineTo(p[0],p[1]+(dy||0)):g.moveTo(p[0],p[1]+(dy||0)));g.stroke()};
  sp('rgba(0,0,0,.16)',46,4);sp(shade(st.pe,-.25),45);sp(st.pe,42);sp(st.pa,34);g.globalAlpha=.4;sp(st.ph,12);g.globalAlpha=1;
  for(let i=0;i<300;i++){const p=posAt(rr(0,TOT));E(p[0]+rr(-14,14),p[1]+rr(-14,14),rr(1,2.6),rr(.8,1.8),R()<.5?st.pe:shade(st.pa,-.15))}
  for(let i=0;i<70;i++){const p=posAt(rr(0,TOT)),s=R()<.5?-1:1,a=R()*TAU;E(p[0]+Math.cos(a)*19,p[1]+Math.sin(a)*19,rr(2.5,4),rr(2,3),shade(st.pe,-.15),'rgba(58,42,50,.35)',1)}
  // 배치 칸 (말랑 쿠션)
  BUILD.forEach(i=>{const[x,y]=cellXY(i),w=CS-8,alt=(i%COLS+Math.floor(i/COLS))%2;
    RR(x-w/2,y-w/2+3,w,w,13);g.fillStyle='rgba(0,0,0,.18)';g.fill();
    RR(x-w/2,y-w/2,w,w,13);g.fillStyle=st.te;g.fill();
    RR(x-w/2,y-w/2,w,w-3,13);g.fillStyle=alt?st.t1:st.t2;g.fill();g.strokeStyle='rgba(58,42,50,.35)';g.lineWidth=1.5;g.stroke();
    RR(x-w/2+5,y-w/2+3,w-10,w*.28,9);g.fillStyle='rgba(255,255,255,.4)';g.fill();
    for(const[a,b]of[[-1,-1],[1,-1],[-1,1],[1,1]])E(x+a*(w/2-6),y+b*(w/2-7),1.4,1.4,'rgba(58,42,50,.18)')});
  // 빈 칸 장식
  for(let i=0;i<COLS*ROWS;i++){if(PATHSET.has(i)||BUILD.has(i))continue;const[x,y]=cellXY(i);bigDecor(st.deco,x+rr(-5,5),y+rr(-4,6),R)}
  let placed=0;for(let i=0;i<3000&&placed<90;i++){const x=rr(0,W),y=rr(0,H);if(!freeSpot(x,y))continue;placed++;smallDecor(st.deco,x,y,R)}
  g=old;return c}
let BGC={};
function getBG(si){const k=S.map+'-'+si;return BGC[k]||(BGC[k]=makeBG(si,S.map))}
</script>
<script>
/* ================= 아군 캐릭터 그리기 =================
   등급마다 모습이 바뀜: 0 아기(작고 맨몸) → 1 모험가(스카프·모자) → 2 기사(갑옷·망토·투구) → 3 전설(빛나는 몸·황금갑옷·날개) */
const LOOK={
  komi:{body:'#fffdf8',acc:'#5cc6ff',dk:'#2f8fd6'},
  haneul:{body:'#fffdf8',acc:'#4b97f0',dk:'#2c62c4'},
  kkang:{body:'#ffe48a',acc:'#e8443a',dk:'#b8262a'},
  mong:{body:'#f1eaf7',acc:'#a57bff',dk:'#6b4fd8'},
  bam:{body:'#f8dcae',acc:'#e8892f',dk:'#9a5a24'},
  haesa:{body:'#ffd766',acc:'#ff9a3a',dk:'#d96a1a'},
  sudal:{body:'#dcae84',acc:'#e2434f',dk:'#a8262f'}};
const RAD=[12.5,14,15.5,17];
const TOPY={komi:-1.5,haneul:-1.35,kkang:-1.9,mong:-1.3,bam:-1.45,haesa:-1.3,sudal:-1.15};
function mochi(r){g.beginPath();g.moveTo(-r*1.08,r*.35);
  g.bezierCurveTo(-r*1.14,-r*.78,-r*.62,-r*1.06,0,-r*1.06);g.bezierCurveTo(r*.62,-r*1.06,r*1.14,-r*.78,r*1.08,r*.35);
  g.bezierCurveTo(r*1.04,r*.84,r*.55,r*.92,0,r*.92);g.bezierCurveTo(-r*.55,r*.92,-r*1.04,r*.84,-r*1.08,r*.35);g.closePath()}
function bodyFill(L,gr,r){const bg=g.createRadialGradient(-r*.35,-r*.55,r*.08,0,0,r*1.35);
  if(gr<3){bg.addColorStop(0,shade(L.body,.65));bg.addColorStop(.6,L.body);bg.addColorStop(1,shade(L.body,-.16))}
  else{bg.addColorStop(0,'#ffffff');bg.addColorStop(.5,shade(L.body,.4));bg.addColorStop(1,shade(L.acc,.3))}return bg}
function metal(gr,y0,y1){const m=g.createLinearGradient(0,y0,0,y1);if(gr>=3){m.addColorStop(0,'#fff6b8');m.addColorStop(.5,'#ffd23f');m.addColorStop(1,'#d8901a')}else{m.addColorStop(0,'#ffffff');m.addColorStop(.5,'#d5dce8');m.addColorStop(1,'#98a4b8')}return m}

function end(win){if(S.over)return;S.over=true;const leg=S.grid.filter(u=>u&&u.g==3).length,nb=recordRun();
  openOv(`<h2>${win?'마을을 지켰어요!':'잡초가 마을에 닿았어요'}</h2><p class="lead">${win?'무지개 초원이 돌아왔어요':'다시 도전해 볼까요?'}</p><ul><li>맵 ${CONFIG.maps[S.map].n}${nb?' · <b style="color:var(--rose)">새 최고 기록!</b>':` · 최고 ${REC.best[S.map]||0}웨이브`}</li><li>도달 웨이브 ${S.wave} / ${CONFIG.maxWave}</li><li>쓰러뜨린 보스 ${S.bossDown}</li><li>물리친 잡초 ${S.kills}</li><li>전설 친구 ${leg}명</li></ul><button class="go" id="againBtn">다시 하기</button>`);
  $('#againBtn').onclick=()=>{reset();S.started=true;closeOv()}}
cv.addEventListener('pointerdown',ev=>{initAudio();if(S.evo){if(S.evo.t<1.05)S.evo.t=1.05;else S.evo.t=S.evo.dur;return}if(!S.started||S.over)return;const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width,y=(ev.clientY-r.top)*H/r.height,c=Math.floor((x-GX)/CS),rw=Math.floor((y-GY)/CS);
  if(c<0||c>=COLS||rw<0||rw>=ROWS||!BUILD.has(rw*COLS+c)){S.sel=-1;tipLock=0;return}const i=rw*COLS+c;
  if(S.sel<0){if(S.grid[i]){S.sel=i;const u=S.grid[i],d=CONFIG.units[u.t];u.sq=.25;tip(`${d.titles[u.g]} · ${CONFIG.gradeNames[u.g]} · 공격력 ${fmt(d.dmg*CONFIG.gradeMul[u.g])} · 필살기: ${d.ult}`,999999)}}
  else if(i===S.sel){S.sel=-1;tipLock=0}
  else{const a=S.grid[S.sel];S.grid[S.sel]=S.grid[i];S.grid[i]=a;if(a)a.sq=.3;if(S.grid[S.sel])S.grid[S.sel].sq=.3;S.sel=-1;tipLock=0;sfx('pop')}});
$('#sum').onclick=()=>{initAudio();summon()};$('#mrg').onclick=()=>{initAudio();merge()};
document.querySelectorAll('.sk').forEach(b=>b.onclick=()=>skill(b.dataset.k));
$('#pause').onclick=()=>{if(!S.started||S.over)return;S.paused=!S.paused;$('#pause').textContent=S.paused?'▶':'❚❚';if(S.paused)banner('일시정지')};
$('#spd').onclick=()=>{S.speed=S.speed%3+1;$('#spd').textContent='×'+S.speed};
$('#dex').onclick=showDex;$('#set').onclick=showSet;$('#sell').onclick=()=>{initAudio();sell()};
let sellKey='';function updSell(){const u=S.sel>=0?S.grid[S.sel]:null,k=u?S.sel+'|'+u.g+'|'+u.t:'';if(k===sellKey)return;sellKey=k;const b=$('#sell');b.hidden=!u;if(u)b.textContent='판매 +'+sellValue(u)}

/* ================= 진화 연출 ================= */
let EVC=null,EVX=null;
function silo(u,col,sc){if(!EVC){EVC=document.createElement('canvas');EVC.width=260*DPR;EVC.height=260*DPR;EVX=EVC.getContext('2d')}
  EVX.setTransform(DPR,0,0,DPR,0,0);EVX.clearRect(0,0,260,260);const old=g;g=EVX;try{drawUnit(u,130,150,AT,{sc,portrait:1,noShadow:1})}finally{g=old}
  if(col){EVX.globalCompositeOperation='source-atop';EVX.fillStyle=col;EVX.fillRect(0,0,260,260);EVX.globalCompositeOperation='source-over'}return EVC}
function drawEvo(dt){const ev=S.evo;if(!ev)return;ev.t+=dt;const t=ev.t,D=ev.dur,c=CONFIG.gradeCol[ev.nu.g],d=CONFIG.units[ev.nu.t],cx=W/2,cy=H*.44,flipEnd=D*.45;
  if(t>=D){S.evo=null;return}
  g=MAIN;g.setTransform(DPR,0,0,DPR,0,0);const fin=t>D-.25?(D-t)/.25:1;g.save();g.globalAlpha=fin;
  g.fillStyle=`rgba(22,10,34,${Math.min(.82,t*5)})`;g.fillRect(0,0,W,H);
  g.save();g.translate(cx,cy);g.rotate(t*.8);const n=14;for(let i=0;i<n;i++){g.rotate(TAU/n);g.fillStyle=hexA(c,i%2?.18:.32);g.beginPath();g.moveTo(0,0);g.lineTo(-30,-420);g.lineTo(30,-420);g.closePath();g.fill()}g.restore();
  const gl=g.createRadialGradient(cx,cy,10,cx,cy,150);gl.addColorStop(0,hexA(c,.55));gl.addColorStop(1,hexA(c,0));g.fillStyle=gl;g.fillRect(0,0,W,H);
  if(t<flipEnd){const k=t/flipEnd,per=.26-k*.21,showNew=Math.floor(t/per)%2==1,pul=1+Math.sin(t*30)*.03;
    const sc=2.9*pul;g.drawImage(silo(showNew?ev.nu:ev.old,showNew?'#ffffff':'#fff6d6',sc),cx-130,cy-150,260,260);
    for(let i=0;i<2;i++){const a=Math.random()*TAU,rr=rand(90,150);ev.p.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr,vx:-Math.cos(a)*rr*2.2,vy:-Math.sin(a)*rr*2.2,l:.4,m:.4,c:'#fff6a8'})}}
  else{if(!ev.burst){ev.burst=true;sfx('evoDone');for(let i=0;i<46;i++){const a=Math.random()*TAU,v=rand(80,320);ev.p.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rand(.6,1.1),m:1.1,c:i%3?c:'#ffffff'})}}
    const k=t-flipEnd,bo=k<.3?1+Math.sin(k/.3*Math.PI)*.25:1;g.drawImage(silo(ev.nu,null,3*bo),cx-130,cy-150,260,260);
    if(k<.18){g.fillStyle=`rgba(255,255,255,${1-k/.18})`;g.fillRect(0,0,W,H)}
    const ty=Math.min(1,k/.25);g.textAlign='center';g.lineJoin='round';
    g.font='40px "Jua",sans-serif';g.lineWidth=7;g.strokeStyle=OL;const y1=cy-130+(1-ty)*-20;g.strokeText('진화!',cx,y1);g.fillStyle='#ffe066';g.fillText('진화!',cx,y1);
    g.font='24px "Jua",sans-serif';g.lineWidth=5;g.strokeText(d.titles[ev.nu.g],cx,cy+132);g.fillStyle='#ffffff';g.fillText(d.titles[ev.nu.g],cx,cy+132);
    g.font='16px "Jua",sans-serif';g.lineWidth=4;const gs=CONFIG.gradeNames[ev.nu.g]+'  '+'★'.repeat(ev.nu.g+1);g.strokeText(gs,cx,cy+158);g.fillStyle=c;g.fillText(gs,cx,cy+158);
    g.font='13px "Jua",sans-serif';g.lineWidth=3;g.strokeText('화면을 누르면 넘어가요',cx,H-22);g.fillStyle='rgba(255,255,255,.75)';g.fillText('화면을 누르면 넘어가요',cx,H-22);g.textAlign='left'}
  for(const p of ev.p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt;g.globalAlpha=fin*Math.max(0,p.l/p.m);g.fillStyle=p.c;star(p.x,p.y,3.5,4,.35);g.fill()}ev.p=ev.p.filter(p=>p.l>0);
  g.restore()}

/* ================= 루프 ================= */
let lastT=performance.now(),AT=0;
function frame(n){const rdt=Math.min(.05,(n-lastT)/1000);lastT=n;const run=S.started&&!S.paused&&!S.over&&!S.evo;
  if(run||!S.started||S.evo){AT+=rdt;ambUpdate(rdt)}
  if(run){for(let i=0;i<S.speed;i++)update(rdt);
    S.bgFade=Math.max(0,S.bgFade-rdt/2.4);for(const k of['shake','flash','hurt','homeHit'])if(S[k]>0)S[k]=Math.max(0,S[k]-rdt);if(S.tint){S.tint.l-=rdt;if(S.tint.l<=0)S.tint=null}}
  if(S.paused&&S.started&&!S.over){for(const f of S.fx)if(f.k=='banner'&&f.l>1)f.l=1.2}
  draw();drawEvo(rdt);drawTitle();updSell();
  const b=S.bossE;const bb=$('#bossbar');if(b&&!b.dead){if(bb.hidden)bb.hidden=false;$('#bname').textContent=b.d.n+(b.sh>0?' · 보호막':'');$('#bpct').textContent=Math.ceil(Math.max(0,b.hp)/b.max*100)+'%';$('#bfill').style.width=Math.max(0,b.hp/b.max*100)+'%';$('#bsh').style.width=Math.min(100,b.sh/b.max*100)+'%'}else if(!bb.hidden)bb.hidden=true;
  requestAnimationFrame(frame)}
loadMap(0);reset();showStart();
requestAnimationFrame(frame);
