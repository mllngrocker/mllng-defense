<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말랑 오락실</title>
<meta name="description" content="말랑말랑한 미니 게임 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one column of game cards under a marquee-style sign; 2 columns on wide screens */
:root{
  --bg:#fff4ec;--dot:#ffe2d1;--panel:#ffffff;--ink:#3a2a32;--muted:#7c6a76;--line:#3a2a32;
  --rose:#ff86a8;--honey:#ffd25e;--leaf:#9be37a;--sky:#9fd0ff;
  --f-disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#1d1822;--dot:#2a2230;--panel:#2b2433;--ink:#f6eaf0;--muted:#b9aab6;--line:#0f0b12;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.8px,transparent 2px);background-size:20px 20px;color:var(--ink);font-family:var(--f-body);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));min-height:100vh}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.sign{background:var(--rose);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:18px 16px 16px;text-align:center;position:relative;overflow:hidden}
.sign::before{content:"";position:absolute;inset:8px;border-radius:14px;border:3px dashed rgba(255,255,255,.7);pointer-events:none}
.sign h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(36px,9vw,56px);margin:0;color:#fff;text-shadow:3px 3px 0 var(--line);letter-spacing:.02em}
.sign p{margin:4px 0 0;color:#fff;font-family:var(--f-disp);font-size:16px;text-shadow:1px 1px 0 var(--line)}
.bulbs{display:flex;justify-content:center;gap:12px;margin-top:10px}
.bulbs i{width:10px;height:10px;border-radius:50%;background:#fff6a8;border:2px solid var(--line);animation:blink 1.2s infinite}
.bulbs i:nth-child(even){animation-delay:.6s}
@keyframes blink{50%{background:#ffd25e}}
.label{font-family:var(--f-disp);font-size:20px;margin:4px 2px -8px;display:flex;justify-content:space-between;align-items:baseline}
.label small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0;color:inherit;text-decoration:none;transition:transform .12s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px)}
a.card:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-bottom:3px solid var(--line);max-width:100%}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.body p{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-family:var(--f-disp);font-size:12px;border:2px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--honey);color:#3a2a32}
.tags span.new{background:var(--leaf)}
.play{margin-top:auto;align-self:flex-start;font-family:var(--f-disp);font-size:18px;background:var(--rose);color:#3a2a32;border:3px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);padding:6px 18px}
.soon{border-style:dashed;box-shadow:none;background:transparent}
.soon .ph{height:96px;display:grid;place-items:center;border-bottom:3px dashed var(--line);font-family:var(--f-disp);font-size:56px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.bulbs i{animation:none}.card{transition:none}}
</style>
</head>
<body>
<main>
  <header class="sign">
    <h1>말랑 오락실</h1>
    <p>친구랑 링크 하나로 바로 하는 말랑말랑 미니 게임들</p>
    <div class="bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </header>
  <div class="label"><span>게임 목록</span><small id="count"></small></div>
  <section class="grid" id="games"></section>
  <footer>휴대폰에서도 바로 플레이할 수 있어요 · 기록은 각자 기기에 저장돼요</footer>
</main>
<script>
/* 새 게임을 추가할 때는 이 목록에 한 줄만 넣으면 돼요 */
const GAMES=[
  {path:'mallang-defense/',title:'말랑말랑 수비대',desc:'말랑한 친구들을 소환하고 합성해서 50웨이브 동안 잡초 군단을 막는 디펜스 게임.',thumb:'mallang-defense/thumb.jpg',tags:['디펜스','합성','맵 5종']}
];
const SOON=1;
const el=document.getElementById('games');
el.innerHTML=GAMES.map(g=>`<a class="card" href="${g.path}"><img src="${g.thumb}" alt="${g.title} 게임 화면" loading="lazy"><div class="body"><h2>${g.title}</h2><div class="tags">${g.tags.map(t=>`<span>${t}</span>`).join('')}</div><p>${g.desc}</p><span class="play">플레이 ▶</span></div></a>`).join('')
  +Array.from({length:SOON},()=>`<div class="card soon" aria-label="준비 중인 게임"><div class="ph">?</div><div class="body"><h2>다음 게임</h2><p>새 게임을 만드는 중이에요. 곧 여기에 나타나요!</p></div></div>`).join('');
document.getElementById('count').textContent=`${GAMES.length}개`;
</script>
</body>
</html>
