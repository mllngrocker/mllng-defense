<title>잃어버린 고향을 찾아서</title>
<style>
:root{--ink:#16233f;--ink2:#4a5a7c;--paper:#f6f9ff;--glass:rgba(255,255,255,.12);--glass-b:rgba(255,255,255,.28);
 --gold:#ffcf3d;--gem:#7fe3ff;--hp:#ff5b6e;--exp:#8ae86a;--accent:#3d8bff;--accent2:#6b5bff;
 --f-title:"Jal","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-body:"Ssr","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0b1630;color:#fff;font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(120% 80% at 50% 0%,#1d3f7a 0%,#0b1630 60%,#060c1c 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
/* stage */
#stage{position:relative;flex:0 0 auto;height:min(56vh,560px);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* hud */
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 10px 0;display:flex;flex-direction:column;gap:7px;pointer-events:none;z-index:5}
.hrow{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:rgba(10,20,45,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--f-title);font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.pill i{width:20px;height:20px;display:block;flex:none}
#lvbox{flex:1;min-width:0;padding-left:5px}
#lvtxt{flex:none;max-width:100%;font-size:13px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lvbox{position:relative;flex-direction:column;align-items:stretch;justify-content:center;gap:0;padding:0 10px 3px}#lvbox .bar{position:absolute;left:10px;right:10px;bottom:2px;height:2px;min-width:0}
.pill.cur{height:24px;padding:0 7px 0 3px;gap:3px;font-size:12px;flex:none}.pill.cur i{width:16px;height:16px}
#stagebox{width:calc(100% - 170px);max-width:240px;padding-left:10px;padding-right:10px}#stname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#cpbox{font-size:12px;height:24px}
.bar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;min-width:30px}
.bar b{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#5fd35a,#c3ff79);box-shadow:0 0 8px rgba(160,255,120,.6);transition:width .25s}
#stagebox{justify-content:center;flex-direction:column;align-items:center;height:auto;padding:5px 16px 6px;border-radius:16px;gap:3px}
#toggles{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:auto}#toggles button{color:#fff;padding:0 7px}
#cpbox{position:absolute;left:0;top:4px;height:26px;padding:0 9px 0 5px;font-size:13px;color:#ffe9a8}#cpbox i{width:18px;height:18px}
#cpup{position:absolute;left:100%;top:2px;margin-left:4px;font:12px var(--f-title);color:#8aff8a;text-shadow:0 1px 2px #000;opacity:0;white-space:nowrap}#cpup.go{animation:cpup 1.4s ease-out}
@keyframes cpup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#stname{font-size:15px;letter-spacing:.5px}#stagebox{pointer-events:auto;cursor:pointer}#stname::after{content:" ▾";font-size:11px;opacity:.8}
#stsub{font-family:var(--f-body);font-size:11px;opacity:.85}
#killbar{width:150px;height:6px}
#killbar b{background:linear-gradient(90deg,#ffb93d,#ffe680);box-shadow:0 0 8px rgba(255,200,80,.6)}
#bossbtn{pointer-events:auto;font-family:var(--f-title);font-size:13px;padding:7px 14px;border-radius:999px;background:linear-gradient(#ff6a7d,#e2364f);box-shadow:0 3px 0 #9c1d33,0 0 18px rgba(255,80,100,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#bosstimer{width:170px;height:7px}#bosstimer b{background:linear-gradient(90deg,#ff3d5a,#ff9a6a)}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--f-title);font-size:34px;letter-spacing:1px;pointer-events:none;z-index:6;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px currentColor}
#banner.show{animation:ban 1.8s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(8,16,36,.8);border:1px solid rgba(255,255,255,.2);font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s;z-index:7;pointer-events:none}
#toast.show{opacity:1}
/* panel */
#panel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#e9f1ff,#dbe7fb);color:var(--ink);border-radius:22px 22px 0 0;margin-top:-18px;z-index:8;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
#tabs{display:flex;gap:6px;padding:10px 12px 6px}
.tab{flex:1;height:38px;border-radius:12px;font-family:var(--f-title);font-size:14px;color:var(--ink2);background:#cfdcf3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.tab.on{color:#fff;background:linear-gradient(#4f9bff,#2f6fe0);box-shadow:0 3px 0 #1f4fa8,0 6px 14px rgba(47,111,224,.35)}
#ptools{display:flex;align-items:center;gap:6px;padding:2px 14px 6px;font-size:12px;color:var(--ink2)}
#ptools .sp{flex:1}
.seg{display:flex;background:#cfdcf3;border-radius:10px;padding:2px}
.seg button{padding:5px 10px;border-radius:8px;font-family:var(--f-title);font-size:12px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#plist{flex:1;overflow-y:auto;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:16px;background:#fff;box-shadow:0 2px 0 rgba(30,60,120,.08),0 4px 14px rgba(30,60,120,.06)}
.ric{width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#eef4ff,#d6e3fb)}
.ric svg{width:32px;height:32px}
.rinfo{flex:1;min-width:0}
.rname{font-family:var(--f-title);font-size:15px;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname small{font-family:var(--f-body);font-size:11px;color:var(--ink2)}
.rval{font-size:12px;color:var(--ink2);margin-top:3px}.rval b{color:#2a8a3a}.ar{font:normal 12px system-ui,sans-serif}
.buy{flex:none;min-width:84px;height:46px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--f-title);font-size:13px;color:#5a3a00;background:linear-gradient(#ffe06a,#ffc22e);box-shadow:0 3px 0 #d39a12}
.buy small{font-family:var(--f-body);font-size:10px;opacity:.75}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #d39a12}
.buy.no{filter:grayscale(.9);opacity:.55}
.buy.max{background:#cfd8e8;box-shadow:0 3px 0 #a9b4c8;color:#56627a}
.info{padding:14px;border-radius:16px;background:#fff;font-size:13px;line-height:1.7;color:var(--ink2)}
.info h3{font-family:var(--f-title);font-size:16px;color:var(--ink);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.grid2 b{color:var(--ink);float:right}
/* lobby + modal */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center}
#lobby canvas{position:absolute;inset:0;width:100%;height:100%}
#ltitle{position:relative;margin-top:max(9vh,40px);text-align:center;font-family:var(--f-title);line-height:1.02;filter:drop-shadow(0 6px 0 rgba(10,20,60,.45)) drop-shadow(0 0 28px rgba(140,200,255,.55))}
#ltitle .t1{font-size:clamp(28px,8.5vw,40px);color:#eaf6ff}
#ltitle .t2{font-size:clamp(54px,17vw,82px);background:linear-gradient(#ffffff 10%,#9fdcff 55%,#5aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.25)}
#ltitle .t3{margin-top:10px;display:inline-block;font-size:12px;letter-spacing:3px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#dff1ff}
#lbtns{position:absolute;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 24px}
#lsub{font-size:13px;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.big{width:100%;max-width:340px;height:62px;border-radius:20px;font-family:var(--f-title);font-size:24px;color:#4a2c00;background:linear-gradient(#ffe57a,#ffbf2a);box-shadow:0 5px 0 #c88a0e,0 12px 30px rgba(255,190,40,.45);letter-spacing:1px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c88a0e}
.ghost{padding:8px 16px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
#modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,10,25,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:24px}
#mbox{width:100%;max-width:340px;max-height:calc(100% - 16px);overflow-y:auto;padding:20px 18px 16px;border-radius:22px;background:linear-gradient(#f4f8ff,#dfe9fb);color:var(--ink);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#mbox h2{font-family:var(--f-title);font-size:22px;margin-bottom:8px}
#mbox p{font-size:14px;line-height:1.6;color:var(--ink2)}
#mbtns{display:flex;gap:8px;margin-top:16px}#mbtns:empty{display:none}
#mbox{position:relative}#mx{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;font:15px var(--f-title);color:var(--ink2);background:#dfe8f8}
#mbtns{flex-wrap:wrap}#mbtns button small{display:block;font:11px var(--f-body);opacity:.8;margin-top:1px}
#mbtns button{flex:1 1 40%;min-height:46px;padding:6px 4px;line-height:1.15;border-radius:14px;font-family:var(--f-title);font-size:16px;background:#cfdcf3;color:var(--ink2)}
#mbtns button.ok{background:linear-gradient(#4f9bff,#2f6fe0);color:#fff;box-shadow:0 3px 0 #1f4fa8}
.tab{font-size:13px;padding:0 2px}
#skillbar{position:absolute;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 68px);z-index:6;display:flex;gap:4px}
.sk{position:relative;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(10,20,45,.6);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 12px rgba(120,220,255,.35)}
.sk svg{width:15px;height:15px;position:relative;z-index:1}.sk i{position:absolute;inset:0;background:conic-gradient(rgba(5,10,25,.72) var(--p,0%),transparent 0);z-index:2}
.sk.lock{opacity:.35}.sk b{position:absolute;z-index:3;font:9px var(--f-title);text-shadow:0 1px 2px #000}
#sauto{height:22px;padding:0 9px;border-radius:999px;font:11px var(--f-title);background:rgba(10,20,45,.6);border:1px solid rgba(255,255,255,.35)}#sspd{height:22px;padding:0 9px;border-radius:999px;font:11px var(--f-title);background:rgba(10,20,45,.6);border:1px solid rgba(255,255,255,.35)}#sspd.on{background:linear-gradient(#ffd84a,#ff9a2a);border-color:#ffe9a0;color:#4a2a00}#sauto.on{background:linear-gradient(#5ad0ff,#2f8ae0);border-color:#aee8ff}
.sec{font-family:var(--f-title);font-size:14px;margin:4px 2px 0;color:var(--ink)}
.eqcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff;box-shadow:0 4px 14px rgba(30,60,120,.08)}
.ibox{width:64px;height:64px;flex:none;border-radius:14px;background:linear-gradient(145deg,#2a3a5e,#141e36);border:2.5px solid var(--gc,#b8c2d0);box-shadow:0 0 12px var(--gc,transparent);position:relative}
.ibox img{width:100%;height:100%;display:block}.ibox .gb{position:absolute;left:-3px;top:-3px;padding:1px 5px;border-radius:7px;font:11px var(--f-title);color:#14182a;background:var(--gc)}
.ibox .cnt{position:absolute;right:3px;bottom:1px;font:11px var(--f-title);color:#fff;text-shadow:0 1px 2px #000}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;padding:2px}
.igrid .ibox{width:auto;height:auto;aspect-ratio:1;cursor:pointer}.igrid .ibox.on{outline:3px solid #3d8bff;outline-offset:2px}
.btn2{height:40px;padding:0 14px;border-radius:12px;font:14px var(--f-title);color:#fff;background:linear-gradient(#4f9bff,#2f6fe0);box-shadow:0 3px 0 #1f4fa8}.btn2.no{filter:grayscale(.9);opacity:.5}
.gacha{padding:16px;border-radius:18px;text-align:center;color:#fff;background:radial-gradient(120% 90% at 50% 0%,#4a3a9a,#1a1440);box-shadow:0 6px 20px rgba(40,20,90,.35)}
.gacha h3{font:22px var(--f-title);margin-bottom:4px}.gacha p{font-size:12px;opacity:.85}.gacha .row2{display:flex;gap:8px;margin-top:14px}.gacha .row2 button{flex:1;height:54px;border-radius:14px;font:16px var(--f-title);color:#4a2c00;background:linear-gradient(#ffe57a,#ffbf2a);box-shadow:0 4px 0 #c88a0e}
.odds{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;margin-top:12px;font-size:11px}.odds span b{font-family:var(--f-title)}
#mbox.wide{max-width:420px}.res{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:6px}
.res .ibox{width:auto;height:auto;aspect-ratio:1;animation:flip .45s backwards}.res .ibox .new{position:absolute;right:-3px;top:-4px;padding:0 4px;border-radius:6px;background:#ff4a6a;color:#fff;font:9px var(--f-title)}
@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:0}}
#acts{position:absolute;right:10px;bottom:26px;z-index:6;display:flex;gap:6px;align-items:center}
#dunbtn{height:34px;padding:0 12px;border-radius:12px;font:13px var(--f-title);color:#4a2c00;background:linear-gradient(#ffe57a,#ffbf2a);box-shadow:0 3px 0 #c88a0e}
#dunpanel{display:none;flex:1;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
body[data-dun] #tabs,body[data-dun] #ptools,body[data-dun] #plist,body[data-dun] #stagebox,body[data-dun] #dunbtn,body[data-dun] #bossbtn{display:none!important}

#dunhud{height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#fff}
#dunhud .dname{font:26px var(--f-title);letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.3),0 0 20px var(--dc)}#dunhud .dsub{font-size:12px;opacity:.85}
#dunhud .dtime{font:58px var(--f-title);line-height:1;margin-top:6px;text-shadow:0 0 24px var(--dc)}#dunhud .dtime small{font-size:18px;margin-left:3px}
#dunhud .dbar{width:80%;height:10px;flex:none}#dunhud .dbar b{background:var(--dc);box-shadow:0 0 12px var(--dc)}
#dunhud .dearn{font:20px var(--f-title);margin-top:4px}#dunhud .ghost{margin-top:auto}
body[data-dun="gold"]{--dc:#ffcf3d}body[data-dun="gem"]{--dc:#b98aff}body[data-dun="stone"]{--dc:#ff7a2a}
body[data-dun="gold"] #panel{background:radial-gradient(120% 100% at 50% 0%,#6a4a10,#2a1a04)}
body[data-dun="gem"] #panel{background:radial-gradient(120% 100% at 50% 0%,#3a2a8a,#0e0a2a)}
body[data-dun="stone"] #panel{background:radial-gradient(120% 100% at 50% 0%,#6a2408,#1a0804)}
body[data-dun] .pill{border-color:var(--dc);box-shadow:0 0 12px color-mix(in srgb,var(--dc) 50%,transparent)}
#wipe{position:absolute;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none;background:linear-gradient(110deg,transparent 0%,var(--dc) 20%,#140a04 40%,#140a04 60%,var(--dc) 80%,transparent 100%);background-size:300% 100%;background-position:100% 0}
#wipe.go{animation:wipe 1.4s ease-in-out forwards}#wipe div{text-align:center;color:#fff;opacity:0}#wipe.go div{animation:wipet 1.4s forwards}
#wipe b{display:block;font:34px var(--f-title);text-shadow:0 0 24px var(--dc)}#wipe small{font-size:13px;opacity:.85}
@keyframes wipe{0%{background-position:100% 0}45%,55%{background-position:50% 0}100%{background-position:0% 0}}
@keyframes wipet{0%,25%{opacity:0;transform:scale(1.3)}40%,65%{opacity:1;transform:scale(1)}85%,100%{opacity:0}}
.dunlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.dcard{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;color:#fff;background:linear-gradient(120deg,color-mix(in srgb,var(--dc) 70%,#000),#1a1430);box-shadow:0 0 14px color-mix(in srgb,var(--dc) 40%,transparent)}
.dcard b{font:17px var(--f-title)}.dcard small{grid-column:1;font-size:11px;opacity:.85}.dcard span{grid-row:1/3;grid-column:2;font:13px var(--f-title);padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.2)}
.dcard.done{filter:grayscale(.85);opacity:.6}
#qbtn{position:relative;height:34px;padding:0 10px;border-radius:12px;font:12px var(--f-title);color:#fff;background:rgba(10,20,45,.6);border:1px solid rgba(255,255,255,.3)}
#qbtn.dot::after{content:'';position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:#ff4a5a;box-shadow:0 0 6px #ff4a5a}
body[data-dun] #qbtn{display:none}
.qsec{font:15px var(--f-title);color:var(--ink);text-align:left;margin:12px 0 6px}.qsec small{font:11px var(--f-body);color:var(--ink2);margin-left:6px}
.attrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.att{padding:5px 0;border-radius:9px;background:#dfe8f8;font-size:10px;color:var(--ink2);text-align:center}.att b{display:block;font:13px var(--f-title);color:#1a6a9a}.att i{display:block;font-style:normal;font-size:9px;line-height:1.2;color:#b06a1a}
.att.got{background:#b8c4d8;opacity:.6}.att.now{background:linear-gradient(#ffe57a,#ffbf2a);color:#4a2c00;box-shadow:0 0 10px rgba(255,190,40,.6)}
.qrow{display:grid;grid-template-columns:1fr 64px;grid-template-rows:auto 6px;gap:3px 8px;align-items:center;text-align:left;font-size:12.5px;color:var(--ink);padding:8px 10px;border-radius:12px;background:#fff;margin-bottom:5px}
.qrow .bar{grid-column:1;height:6px;min-width:0}.qrow .bar b{background:linear-gradient(90deg,#4f9bff,#7fd0ff);box-shadow:none}
.qbtn2{grid-row:1/3;grid-column:2;height:34px;border-radius:10px;font:12px var(--f-title);background:#cfdcf3;color:var(--ink2)}.qbtn2.ok{background:linear-gradient(#ffe57a,#ffbf2a);color:#4a2c00;box-shadow:0 2px 0 #c88a0e}.qbtn2.got{opacity:.5}
#prologue{background:#000}#prologue canvas{position:absolute;inset:0;width:100%;height:100%}#pbg,#pfg{opacity:0}

#pphint{position:absolute;left:0;right:0;bottom:22px;color:#14182a;text-align:center;font-size:13px;opacity:.75;animation:pulse 1.6s infinite}
#pskip{position:absolute;right:14px;top:max(12px,env(safe-area-inset-top));color:#14182a;border-color:#14182a}
#victory{position:absolute;inset:0;z-index:35;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,200,60,.35),rgba(10,8,20,.75) 70%)}
#victory>div{text-align:center;color:#fff}#victory small{font:14px var(--f-title);letter-spacing:6px;color:#ffe27a}
#victory .vn{display:block;font:clamp(22px,7vw,32px) var(--f-title);margin:6px 16px 12px;text-shadow:0 0 24px #ffb02e}
#victory .vr{display:flex;gap:10px;justify-content:center}#victory .vr span{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);font:15px var(--f-title)}
#victory.go>div{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.titles{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ttl{padding:8px 10px;border-radius:12px;background:#fff;text-align:left;box-shadow:0 2px 0 rgba(30,60,120,.08)}
.ttl b{display:block;font:13px var(--f-title);color:var(--ink)}.ttl small{font-size:10.5px;color:var(--ink2)}.ttl.lock{opacity:.5}.ttl.on{background:linear-gradient(#fff7d6,#ffe9a0);box-shadow:0 0 0 2px #ffcf3d inset}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}.codex div{border-radius:10px;background:linear-gradient(145deg,#2a3a5e,#141e36);text-align:center;padding:2px 2px 4px}
.codex img{width:100%;aspect-ratio:1;display:block}.codex small{display:block;font-size:9px;color:#dfe8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.codex .unk b{display:grid;place-items:center;aspect-ratio:1;font:22px var(--f-title);color:#5a6a8a}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #d0daf0;font:15px var(--f-title);color:var(--ink)}.setrow input{width:22px;height:22px}
.chlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}.chcard{border-radius:14px;padding:9px 10px 10px;color:#fff;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.chcard b{font:14px var(--f-title);text-shadow:0 1px 3px rgba(0,0,0,.6)}.chcard.lock{filter:grayscale(.85);opacity:.55}.chcard.here{box-shadow:0 0 0 3px #ffcf3d}
.stg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:6px}.stg button{height:26px;border-radius:7px;background:rgba(10,20,45,.45);color:#fff;font:12px var(--f-title);border:1px solid rgba(255,255,255,.25)}
.stg button.boss{background:rgba(200,40,60,.7)}.stg button.cur{background:#ffcf3d;color:#4a2c00}.stg button:disabled{opacity:.3}
#setbtn{width:34px;height:34px;border-radius:12px;background:rgba(10,20,45,.55);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
#setbtn svg{width:20px;height:20px}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="bg"></canvas><canvas id="fg"></canvas>
  <div id="hud">
   <div class="hrow">
    <div class="pill" id="lvbox"><span id="lvtxt">Lv.1</span><div class="bar" id="expbar"><b></b></div></div>
    <div class="pill cur"><i data-ic="gold"></i><span id="goldtxt">0</span></div>
    <div class="pill cur"><i data-ic="gem"></i><span id="gemtxt">0</span></div>
    <div class="pill cur"><i data-ic="stone"></i><span id="stonetxt">0</span></div>
   </div>
   <div class="hrow" style="justify-content:center;position:relative">
    <div class="pill" id="cpbox"><i data-ic="cp"></i><span id="cptxt">0</span><b id="cpup"></b></div>
    <div class="pill" id="stagebox"><span id="stname">1-1 쓰레기 해변</span><div class="bar" id="killbar"><b></b></div><div class="bar" id="bosstimer" hidden><b></b></div><span id="stsub"></span></div>
    <div id="toggles"><button id="sauto">AUTO</button><button id="sspd">x1</button></div>
   </div>
   <div class="hrow" style="justify-content:center"><button id="bossbtn" hidden>보스 도전!</button></div>
  </div>
  <div id="banner"></div><div id="toast"></div>
  <div id="skillbar"></div>
  <div id="acts"><button id="qbtn">📜 퀘스트</button><button id="dunbtn">⛏ 던전</button><button id="setbtn" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button></div>
 </div>
 <div id="panel">
  <div id="tabs"><button class="tab on" data-tab="up">강화</button><button class="tab" data-tab="gear">장비</button><button class="tab" data-tab="skill">스킬</button><button class="tab" data-tab="pet">펫</button><button class="tab" data-tab="gacha">뽑기</button><button class="tab" data-tab="info">도감</button></div>
  <div id="ptools"><span id="phint">길게 누르면 연속 강화</span><span class="sp"></span><div class="seg" id="mult"><button data-m="1" class="on">x1</button><button data-m="10">x10</button><button data-m="0">MAX</button></div></div>
  <div id="plist"></div>
  <div id="dunpanel"></div>
 </div>
 <div id="lobby" class="screen">
  <canvas id="lbg"></canvas><canvas id="lfg"></canvas>
  <div id="ltitle"><div class="t1">잃어버린 고향을</div><div class="t2">찾아서</div><div class="t3">A POLAR BEAR'S JOURNEY</div></div>
  <div id="lbtns"><div id="lsub">처음 시작하는 모험</div><button class="big" id="startbtn">모험 시작</button></div>
 </div>
 <div id="prologue" class="screen" hidden><canvas id="pbg"></canvas><canvas id="pfg"></canvas><canvas id="pcm"></canvas><div id="pphint"></div><button id="pskip" class="ghost">건너뛰기</button></div>
 <div id="victory" hidden><div><small>BOSS CLEAR</small><b class="vn"></b><div class="vr"></div></div></div>
 <div id="wipe" hidden><div><b></b><small></small></div></div>
 <div id="modal" hidden><div id="mbox"><button id="mx" aria-label="닫기">✕</button><h2 id="mtitle"></h2><p id="mtext"></p><div id="mbtns"></div></div></div>
</div>
<!--SCRIPTS-->
</body>
</html>
