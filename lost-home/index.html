<title>잃어버린 고향을 찾아서</title>
<style>
:root{--ink:#16233f;--ink2:#4a5a7c;--paper:#f6f9ff;--glass:rgba(255,255,255,.12);--glass-b:rgba(255,255,255,.28);
 --gold:#ffcf3d;--gem:#7fe3ff;--hp:#ff5b6e;--exp:#8ae86a;--accent:#3d8bff;--accent2:#6b5bff;
 --f-title:"Jal","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-body:"Ssr","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0b1630;color:#fff;font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(120% 80% at 50% 0%,#1d3f7a 0%,#0b1630 60%,#060c1c 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
/* stage */
#stage{position:relative;flex:0 0 auto;height:min(56vh,560px);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* hud */
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 10px 0;display:flex;flex-direction:column;gap:7px;pointer-events:none;z-index:5}
.hrow{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:rgba(10,20,45,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--f-title);font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.pill i{width:20px;height:20px;display:block;flex:none}
#lvbox{flex:1;min-width:0;padding-left:5px}
#lvtxt{flex:none;max-width:100%;font-size:13px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lvbox{position:relative;flex-direction:column;align-items:stretch;justify-content:center;gap:0;padding:0 10px 3px}#lvbox .bar{position:absolute;left:10px;right:10px;bottom:2px;height:2px;min-width:0}
.pill.cur{height:24px;padding:0 7px 0 3px;gap:3px;font-size:12px;flex:none}.pill.cur i{width:16px;height:16px}
#stagebox{width:calc(100% - 170px);max-width:240px;padding-left:10px;padding-right:10px}#stname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#cpbox{font-size:12px;height:24px}
.bar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;min-width:30px}
.bar b{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#5fd35a,#c3ff79);box-shadow:0 0 8px rgba(160,255,120,.6);transition:width .25s}
#stagebox{justify-content:center;flex-direction:column;align-items:center;height:auto;padding:5px 16px 6px;border-radius:16px;gap:3px}
#toggles{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:auto}#toggles button{color:#fff;padding:0 7px}
#cpbox{position:absolute;left:0;top:4px;height:26px;padding:0 9px 0 5px;font-size:13px;color:#ffe9a8}#cpbox i{width:18px;height:18px}
#cpup{position:absolute;left:100%;top:2px;margin-left:4px;font:12px var(--f-title);color:#8aff8a;text-shadow:0 1px 2px #000;opacity:0;white-space:nowrap}#cpup.go{animation:cpup 1.4s ease-out}
@keyframes cpup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#stname{font-size:15px;letter-spacing:.5px}#stagebox{pointer-events:auto;cursor:pointer}#stname::after{content:" ▾";font-size:11px;opacity:.8}
#stsub{font-family:var(--f-body);font-size:11px;opacity:.85}
#killbar{width:150px;height:6px}
#killbar b{background:linear-gradient(90deg,#ffb93d,#ffe680);box-shadow:0 0 8px rgba(255,200,80,.6)}
#bossbtn{pointer-events:auto;font-family:var(--f-title);font-size:13px;padding:7px 14px;border-radius:999px;background:linear-gradient(#ff6a7d,#e2364f);box-shadow:0 3px 0 #9c1d33,0 0 18px rgba(255,80,100,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#bosstimer{width:170px;height:7px}#bosstimer b{background:linear-gradient(90deg,#ff3d5a,#ff9a6a)}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--f-title);font-size:34px;letter-spacing:1px;pointer-events:none;z-index:6;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px currentColor}
#banner.show{animation:ban 1.8s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(8,16,36,.8);border:1px solid rgba(255,255,255,.2);font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s;z-index:7;pointer-events:none}
#toast.show{opacity:1}
/* panel */
#panel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#e9f1ff,#dbe7fb);color:var(--ink);border-radius:22px 22px 0 0;margin-top:-18px;z-index:8;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
#tabs{display:flex;gap:6px;padding:10px 12px 6px}
.tab{flex:1;height:38px;border-radius:12px;font-family:var(--f-title);font-size:14px;color:var(--ink2);background:#cfdcf3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.tab.on{color:#fff;background:linear-gradient(#4f9bff,#2f6fe0);box-shadow:0 3px 0 #1f4fa8,0 6px 14px rgba(47,111,224,.35)}
#ptools{display:flex;align-items:center;gap:6px;padding:2px 14px 6px;font-size:12px;color:var(--ink2)}
#ptools .sp{flex:1}
.seg{display:flex;background:#cfdcf3;border-radius:10px;padding:2px}
.seg button{padding:5px 10px;border-radius:8px;font-family:var(--f-title);font-size:12px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#plist{flex:1;overflow-y:auto;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:16px;background:#fff;box-shadow:0 2px 0 rgba(30,60,120,.08),0 4px 14px rgba(30,60,120,.06)}
.ric{width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#eef4ff,#d6e3fb)}
.ric svg{width:32px;height:32px}
.rinfo{flex:1;min-width:0}
.rname{font-family:var(--f-title);font-size:15px;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname small{font-family:var(--f-body);font-size:11px;color:var(--ink2)}

/* ===== skin: bright blue panels, thick dark outlines, chunky 3D buttons ===== */
:root{--ln:#14182a;--b1:#2a9dff;--b2:#1477f0;--nv:#1c3d9e;--nv2:#142c78;--cy:#2fd6ff;--gr:#7ed957;--ye:#ffd23a;--rd:#ff4a5a;
 --ol:0 2px 0 var(--ln),1.6px 1.6px 0 var(--ln),-1.6px 1.6px 0 var(--ln),1.6px -1.6px 0 var(--ln),-1.6px -1.6px 0 var(--ln),0 -1.6px 0 var(--ln),1.6px 0 0 var(--ln),-1.6px 0 0 var(--ln);
 --ol1:0 1.5px 0 var(--ln),1px 1px 0 var(--ln),-1px 1px 0 var(--ln),1px -1px 0 var(--ln),-1px -1px 0 var(--ln)}
.pill{border-radius:9px;background:rgba(20,36,90,.82);border:2px solid var(--ln);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);backdrop-filter:none;-webkit-backdrop-filter:none;text-shadow:var(--ol1)}

#stagebox{background:linear-gradient(#f2f9ff,#d4ecff);border:2.5px solid var(--ln);border-radius:8px;color:#173a8c;text-shadow:none;box-shadow:0 3px 0 var(--ln)}
#stsub{color:#3a5aa8}
.bar{background:#1a2550;border:1.5px solid var(--ln);height:10px}

#bossbtn{border:2.5px solid var(--ln);border-radius:10px;background:linear-gradient(#ff6a6a,#e5303d);box-shadow:0 4px 0 var(--ln);text-shadow:var(--ol1);animation:pulse 1.1s infinite}

function cosId(){const k=S.eq.c;return k&&S.inv[k]?gsplit(k)[0]:null;}

 Non-human bosses enrage below 50% HP. 마왕 녹스 transforms at 66% and 33% HP. */
const BSK={
 barkas:[{n:'대지 분쇄',col:'#ff7a3a',kind:'slam',mul:4},{n:'강철 돌진',col:'#c8ccd6',kind:'charge',mul:3}],

 king:[{n:'어둠의 대검',col:'#ff2a3a',kind:'slash',mul:5},{n:'마왕의 낙인',col:'#ff3a6a',kind:'pillar',mul:5},{n:'멸망의 별',col:'#ff6a2a',kind:'rain',mul:4,ph:3}],

const TELE=.8,CAST=1.5;
function stepBoss(m,dt){if(!m||m.dead)return;if(m.skT==null){m.skT=4;m.phase=1;}

 else if(!m.enraged&&m.hp<m.max*.5){m.enraged=true;banner('분노!','#ff5a3a');sfx('boss');}
 if(m.frozen>0)return;
 if(!m.cast){m.skT-=dt;if(m.skT<=0&&!bear.dead&&m.x<W){const list=(BSK[m.id]||BSK._).filter(s=>!s.ph||s.ph<=m.phase);m.cast={s:pick(list),t:0,done:false,x0:m.x};num(m.x,m.y-ART_H[m.arch]*K*m.size-24*K,m.cast.s.n,'hurt');}return;}
 const c=m.cast,s=c.s;c.t+=dt;
 if(s.kind==='charge'){const k=c.t<TELE?0:c.t<TELE+.25?(c.t-TELE)/.25:Math.max(0,1-(c.t-TELE-.25)/.4);m.x=lerp(c.x0,BX+40*K,k);}

  if(!bear.dead)hurtBear(d);shake=Math.max(shake,12);hitstop=Math.max(hitstop,.08);sfx('crit');

  if(s.kind==='slam'){ring(BX,GY,s.col,70*K,.6);debris(BX,GY-5*K,14,'#8a7a6a',K);}
  if(s.kind==='rain')for(let i=0;i<24;i++)part({x:BX+rnd(-60,60)*K,y:-10,vx:rnd(-40,40),vy:rnd(500,800),g:400,life:.6,ml:.6,size:rnd(3,6),col:s.col,type:'spark'});

function kingWings(c,t){const f=Math.sin(t*3)*.15;for(const s of[1,.85]){c.save();c.translate(-6,-130);c.rotate(-.3-f);c.scale(s,s);c.beginPath();c.moveTo(0,0);c.lineTo(-30,-40);c.lineTo(-80,-46);c.quadraticCurveTo(-70,-20,-86,-8);c.quadraticCurveTo(-64,-6,-70,14);c.quadraticCurveTo(-46,4,-44,26);c.quadraticCurveTo(-26,10,0,10);c.closePath();

let AC=null,master=null,noiseBuf=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
 noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}

const _last={};
function tone(f0,f1,dur,type='sine',vol=.2,delay=0){const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function noise(dur,f,vol=.2,q=1,type='bandpass'){const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dur);}

  case'hit':noise(.09,900,.25,.8);tone(180,60,.09,'sine',.25);break;
  case'crit':noise(.14,2200,.3,.7);tone(320,90,.14,'triangle',.25);tone(1200,1800,.08,'sine',.08);break;
  case'kill':tone(520,1040,.12,'sine',.16);noise(.12,1600,.12,1.2);break;
  case'coin':tone(1320,1320,.06,'square',.04);tone(1760,1760,.09,'square',.04,.05);break;
  case'hurt':tone(220,110,.16,'sawtooth',.08);break;

 }}

function beginGame(){renderSkillbar();screen='game';if(!S.started){S.started=true;banner(theme().name,'#9fdcff');toast(`${S.name}(이)가 잃어버린 고향을 찾아 떠나요!`);save();}resizeStage();measureHud();updateHud();}
$('#startbtn').onclick=()=>{audioInit();$('#lobby').hidden=true;if(S.started){beginGame();return;}screen='pro';startPrologue(()=>askName(beginGame));};
function offlineReward(){if(!S.started||!S.t)return;const sec=Math.min(8*3600,(Date.now()-S.t)/1000);if(sec<60)return;
 const gold=Math.floor(mobGold(S.g)*.5*sec*.6),exp=mobExp(S.g)*.5*sec*.3;S.gold+=gold;gainExp(exp);save();
 const h=Math.floor(sec/3600),m=Math.floor(sec/60)%60;modal('자리 비운 사이',`${h?h+'시간 ':''}${m}분 동안 ${S.name||'백곰'}(이)가 사냥하다 잠들었어요.<br><b style="color:#d48a10">+${fmt(gold)} 골드</b>`,[['받기',null,1]]);$('#mtext').prepend(sleepCanvas());}

/* ---------- gear / skills / pets / gacha panels ---------- */
const SKICON={glacier:'<svg viewBox="0 0 32 32"><path d="M16 2v28M4 9l24 14M4 23L28 9" stroke="#bff4ff" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="4" fill="#fff"/></svg>',
 tornado:'<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h24M7 12h18M10 18h12M13 24h6M15 29h2"/></svg>',
 beam:'<svg viewBox="0 0 32 32"><defs><linearGradient id="bm" x1="0" x2="1"><stop offset="0" stop-color="#7affd8"/><stop offset="1" stop-color="#a88aff"/></linearGradient></defs><path d="M3 12h26v8H3z" fill="url(#bm)"/><path d="M3 15h26v2H3z" fill="#fff"/><circle cx="5" cy="16" r="5" fill="#fff"/></svg>'};
const gbox=(img,g,extra='',attr='',st='')=>`<div class="ibox" ${attr} style="--gc:${GCOL[g]};${st}"><img src="${img}" alt=""><span class="gb">${GRADES[g]}</span>${extra}</div>`;
function renderSkillbar(){$('#skillbar').innerHTML=Object.keys(SKILLS).map(k=>`<button class="sk" data-k="${k}" aria-label="${SKILLS[k].n}">${SKICON[k]}<i></i><b></b></button>`).join('');
 document.querySelectorAll('.sk').forEach(b=>b.onclick=()=>{if(!castSkill(b.dataset.k)&&!skOpen(b.dataset.k))toast(`${stageName(SKILLS[b.dataset.k].unlock)} 도달 시 열려요`);});
 $('#sauto').onclick=()=>{S.sauto=!S.sauto;save();updateSkillbar();};$('#sspd').onclick=()=>{S.spd=S.spd===2?1:2;save();updateSkillbar();};updateSkillbar();}
function updateSkillbar(){for(const b of document.querySelectorAll('.sk')){const k=b.dataset.k,open=skOpen(k);b.classList.toggle('lock',!open);
  b.querySelector('i').style.setProperty('--p',(open?skCd[k]/SKILLS[k].cd*100:100)+'%');b.querySelector('b').textContent=open&&skCd[k]>0?Math.ceil(skCd[k]):'';}
 const a=$('#sauto');if(a)a.classList.toggle('on',!!S.sauto);const sp=$('#sspd');if(sp){sp.textContent='x'+(S.spd||1);sp.classList.toggle('on',S.spd===2);}}
function eqCard(k,s){if(!k)return`<div class="info" style="padding:10px 14px">빈 칸 · 뽑기에서 얻을 수 있어요</div>`;const[id,g]=gsplit(k),it=ITEMS[id],m=slotMul(k);
 const eff=s==='w'?`${KIND[it.k].n} · 공격력 x${m<100?m.toFixed(1):fmt(m)}`:s==='a'?`체력 +${fmt(m*50)}%`:`체력 +${fmt(m*25)}% · 외형 변경`;
 return`<div class="eqcard" data-item="${k}">${gbox(itemIcon(id),g)}<div class="rinfo"><div class="rname">${it.n}<small>+${S.inv[k].lv}</small></div><div class="rval">${eff}</div>${it.ult?`<div class="rval" style="color:#9a3ad8">필살기 · ${ULTS[it.ult].n}</div>`:''}</div><button class="btn2" data-item="${k}">관리</button></div>`;}
// equipment tab shows only what's worn; the owned items of a slot type open in a picker popup
const ownOf=s=>Object.keys(S.inv).filter(x=>ITEMS[gsplit(x)[0]].s===s).sort((x,y)=>gsplit(y)[1]-gsplit(x)[1]||ITEMS[gsplit(x)[0]].n.localeCompare(ITEMS[gsplit(y)[0]].n));
function eqSection(s,title){const eq=SLOTS[s].map(x=>S.eq[x]),own=ownOf(s),mg=own.filter(canMerge).length;
 return `<div class="sec" style="display:flex;justify-content:space-between;align-items:center">${title}<button class="btn2" data-pick="${s}" style="height:28px;line-height:28px;padding:0 12px;font-size:11px">${own.length}종 보유 · 바꾸기${mg?` <b style="color:#bff7c8">합성 ${mg}</b>`:''}</button></div>${eq.map(k=>eqCard(k,s)).join('')}`;}
function pickPopup(s,title){const eq=SLOTS[s].map(x=>S.eq[x]);
 modal(title,`<div class="igrid">${ownOf(s).map(x=>{const[id,g]=gsplit(x);return gbox(itemIcon(id),g,`<span class="cnt">x${S.inv[x].n}</span>${canMerge(x)?'<span class="new" style="background:#2fb84a">합성</span>':''}`,`data-item="${x}"`).replace('class="ibox"',eq.includes(x)?'class="ibox on"':'class="ibox"');}).join('')||'<p>아직 없어요 · 뽑기에서 얻을 수 있어요</p>'}</div>`,[],1);
 $('#mtext').querySelectorAll('[data-item]').forEach(e=>e.onclick=()=>itemPopup(e.dataset.item));}
function itemPopup(k){const[id,g]=gsplit(k),it=ITEMS[id],o=S.inv[k];if(!o)return;const c=enhCost(g,o.lv),eq=SLOTS[it.s].some(x=>S.eq[x]===k);
 const info=`<div style="display:flex;gap:12px;align-items:center;text-align:left">${gbox(itemIcon(id),g)}<div><b style="color:${shade(GCOL[g],-.35)}">${GRADES[g]}등급</b> · 보유 ${o.n}개 · +${o.lv}<br>${it.s==='w'?KIND[it.k].n+' 무기':it.s==='a'?'장신구 (체력)':'코스튬 (체력 · 외형)'}${it.ult?`<br><span style="color:#9a3ad8">필살기 · ${ULTS[it.ult].n}</span>`:''}</div></div>
  <p style="margin-top:10px;font-size:12px">같은 장비 ${MERGE_N}개를 합성하면 <b>${it.n} ${GRADES[Math.min(6,g+1)]}등급</b> 1개가 돼요.</p><p style="margin-top:8px;font-size:12px;line-height:1.5"><b>강화</b>: 한 번에 장비 효과 +15% (지금 +${o.lv}). 골드 ${fmt(c)} 또는 <b>강화석</b> 1개가 들어요.<br><small>강화석은 던전에서 얻는 재료예요 · 보유 ${fmt(S.stone||0)}개</small></p>`;
 const btns=[];if(!eq)btns.push(['장착',()=>{const hp=bear.hp/MAXHP();equipItem(k);bear.hp=hp*MAXHP();save();renderPanel();},1]);
 else if(it.s!=='w')btns.push(['해제',()=>{for(const x of SLOTS[it.s])if(S.eq[x]===k)S.eq[x]=null;bear.hp=Math.min(bear.hp,MAXHP());save();renderPanel();}]);
 btns.push([['골드로 강화',`${fmt(c)} 골드`],()=>{if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;o.lv++;track('enh');sfx('level');save();updateHud();renderPanel();itemPopup(k);}]);
 if(S.stone>0)btns.push([['강화석으로 강화',`1개 사용 · 보유 ${S.stone}`],()=>{S.stone--;o.lv++;track('enh');sfx('level');save();renderPanel();itemPopup(k);}]);
 if(canMerge(k))btns.push(['합성',()=>{const nk=merge(k);track('merge');sfx('clear');banner(`${GRADES[g+1]}등급 ${it.n}!`,GCOL[g+1]);save();updateHud();renderPanel();itemPopup(nk);},1]);
 modal(it.n,info,btns);}
const PANEL={
 gear(L){const mc=Object.keys(S.inv).filter(canMerge).length;L.innerHTML=(mc?`<button class="btn2" id="mergeall" style="width:100%">모두 합성 (${mc}종)</button>`:'')+eqSection('w','무기')+eqSection('a','장신구 (2칸)')+eqSection('c','코스튬');
  L.querySelectorAll('[data-item]').forEach(e=>e.onclick=()=>itemPopup(e.dataset.item));
  L.querySelectorAll('[data-pick]').forEach(e=>e.onclick=()=>pickPopup(e.dataset.pick,{w:'무기',a:'장신구',c:'코스튬'}[e.dataset.pick]));
  const ma=$('#mergeall');if(ma)ma.onclick=()=>{const n=mergeAll();track('merge',n);sfx('clear');toast(`${n}번 합성했어요!`);updateHud();renderPanel();};},
 skill(L){L.innerHTML=Object.keys(SKILLS).map(k=>{const sk=SKILLS[k],open=skOpen(k),c=skCost(k);return `<div class="row"><div class="ric" style="background:linear-gradient(145deg,#2a3a5e,#141e36)">${SKICON[k]}</div>
  <div class="rinfo"><div class="rname">${sk.n}<small>${open?'Lv.'+skLv(k):'잠김'}</small></div><div class="rval">${open?`피해 ${fmt(skDmg(k))} · 재사용 ${sk.cd}초`:`${stageName(sk.unlock)} 도달 시 열려요`}</div><div class="rval">${sk.d}</div></div>
  ${open?`<button class="buy${S.gold<c?' no':''}" data-sk="${k}"><span>레벨업</span><small>${fmt(c)} 골드</small></button>`:''}</div>`;}).join('');
  L.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const k=b.dataset.sk,c=skCost(k);if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;S.skl[k]=skLv(k)+1;sfx('level');save();updateHud();renderPanel();});},
 pet(L){const own=Object.keys(S.pets).sort((x,y)=>gsplit(y)[1]-gsplit(x)[1]);if(!own.length){L.innerHTML='<div class="info"><h3>아직 펫이 없어요</h3>뽑기에서 펫 8종을 만날 수 있어요. 물개·펭귄·북극여우·갈매기는 S등급에 어른이 되고 SSS가 최고예요. 드물게 나오는 신수 백호·주작·기린·청룡은 H등급에서 신수로 진화해요.</div>';return;}
  const mc=own.filter(canMergePet).length;
  L.innerHTML=(mc?`<button class="btn2" id="pmergeall" style="width:100%">모두 합성 (${mc}종)</button>`:'')+own.map(k=>{const[id,g]=gsplit(k),P=PETS[id],o=S.pets[k];return `<div class="row" data-pk="${k}" style="cursor:pointer">${gbox(itemIcon(id,1,g),g,`<span class="cnt">x${o.n}</span>${canMergePet(k)?'<span class="new" style="background:#2fb84a">합성</span>':''}`)}
  <div class="rinfo"><div class="rname">${P.n}<small>${P.an[petStage(id,g)]} · +${o.lv}</small></div><div class="rval">${P.at} · 공격력의 <b>${Math.round(petMul(k)*100)}%</b></div><div class="rval">${PB_N[P.bk]} +${Math.round(petBonusOf(k)*10)/10}${P.bk==='crit'?'%p':'%'}${g>=3?' · <b style="color:#b07a00">펫 스킬</b>':''}</div></div>
  ${S.pet===k?'<span class="btn2" style="height:30px;line-height:30px;font-size:11px;background:#8a96b8;box-shadow:none">함께</span>':''}</div>`;}).join('');
  L.querySelectorAll('[data-pk]').forEach(e=>e.onclick=()=>petPopup(e.dataset.pk));
  const ma=$('#pmergeall');if(ma)ma.onclick=()=>{let n=0;for(let p=0;p<7;p++)for(const k of Object.keys(S.pets))while(canMergePet(k)){mergePet(k);n++;}sfx('clear');toast(`${n}번 합성했어요!`);renderPanel();};},
 gacha(L){const tot=GACHAW.reduce((a,b)=>a+b,0);L.innerHTML=`<div class="gacha"><h3>북극 보물 뽑기</h3><p>무기 · 장신구 · 코스튬 · 펫이 나와요. 더 좋은 장비는 자동으로 장착돼요.</p>
  <div class="row2"><button data-n="1">1회<br><small>보석 100</small></button><button data-n="10">10회<br><small>보석 450</small></button></div>
  <div class="odds">${GRADES.map((g,i)=>`<span style="color:${GCOL[i]}"><b>${g}</b> ${(GACHAW[i]/tot*100).toFixed(GACHAW[i]/tot<.01?2:1)}%</span>`).join('')}</div></div>
  <div class="info">보석은 스테이지 클리어(+3), 레벨 업(+10), 보스 처치(+30)로 모을 수 있어요.</div>`;
  L.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const r=gacha(+b.dataset.n);if(!r){toast('보석이 부족해요');return;}track('gacha',r.length);sfx('clear');updateHud();
   modal(`뽑기 결과`,`<div class="res">${r.map((x,i)=>{const g=x.g;return gbox(itemIcon(x.id,x.pet,x.g),g,x.isNew?'<span class="new">NEW</span>':'','',`animation-delay:${i*.08}s`);}).join('')}</div>`,[['확인',()=>renderPanel(),1]],1);});},
};

function petPopup(k){const[id,g]=gsplit(k),P=PETS[id],o=S.pets[k];if(!o)return;const c=enhCost(g,o.lv);
 const info=`<div style="display:flex;gap:12px;align-items:center;text-align:left">${gbox(itemIcon(id,1,g),g)}<div><b style="color:${shade(GCOL[g],-.35)}">${GRADES[g]}등급 ${P.an[petStage(id,g)]}</b><br>보유 ${o.n}마리 · +${o.lv}<br>${P.at} (${P.cd}초마다)</div></div>
  <p style="margin-top:10px;font-size:12px">${g>=P.max?`${GRADES[g]}등급이 이 펫의 최고 등급이에요.`:`같은 펫 ${MERGE_N}마리를 합성하면 <b>${P.n} ${GRADES[g+1]}등급</b>이 돼요.`}${g<3?` S등급이 되면 ${P.common?'어른으로':'젊은 모습으로'} 진화하고 5번째 공격마다 펫 스킬이 나가요.`:!P.common&&g<6?' H등급이 되면 신수로 진화해요.':''}</p><p style="margin-top:8px;font-size:12px;line-height:1.5"><b>강화</b>: 한 번에 펫 효과 +15% (지금 +${o.lv}). 골드 ${fmt(c)} 또는 <b>강화석</b> 1개가 들어요.<br><small>강화석은 던전에서 얻는 재료예요 · 보유 ${fmt(S.stone||0)}개</small></p>`;
 const btns=[];if(S.pet!==k)btns.push(['함께하기',()=>{const hp=bear.hp/MAXHP();S.pet=k;pet.x=0;bear.hp=hp*MAXHP();save();renderPanel();},1]);
 btns.push([['골드로 강화',`${fmt(c)} 골드`],()=>{if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;o.lv++;track('enh');sfx('level');save();updateHud();renderPanel();petPopup(k);}]);
 if(S.stone>0)btns.push([['강화석으로 강화',`1개 사용 · 보유 ${S.stone}`],()=>{S.stone--;o.lv++;track('enh');sfx('level');save();renderPanel();petPopup(k);}]);
 if(canMergePet(k))btns.push(['합성',()=>{const nk=mergePet(k);track('merge');sfx('clear');banner(`${GRADES[g+1]}등급 ${P.n}!`,GCOL[g+1]);renderPanel();petPopup(nk);},1]);
 modal(`${P.n}`,info,btns);}

/* chapter / stage select: tap the stage name. Only stages already reached can be picked */
function stageMenu(){if(dun||boss){toast(boss?'보스전 중에는 이동할 수 없어요':'던전 중에는 이동할 수 없어요');return;}const base=Math.floor(S.best/200)*200;
 modal('챕터 이동',`<div class="chlist">${THEMES.map((th,i)=>{const g0=base+i*10,open=g0<=S.best,here=Math.floor(S.g/10)*10===g0;
  return`<div class="chcard${open?'':' lock'}${here?' here':''}" style="background:linear-gradient(135deg,${th.sky[0]},${th.sky[1]} 60%,${th.sky[2]})"><b>${i+1}. ${th.name}</b>
  <div class="stg">${Array.from({length:10},(_,j)=>{const g=g0+j;return`<button data-g="${g}"${g>S.best?' disabled':''} class="${j===9?'boss':''}${g===S.g?' cur':''}">${j+1}</button>`;}).join('')}</div></div>`;}).join('')}</div>`,[],1);
 document.querySelectorAll('.stg button[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;$('#modal').hidden=true;if(g===S.g)return;
  S.g=g;S.kills=0;S.farm=false;for(const m of mobs)m.dead=true,m.dt=.3;shots.length=0;pshots.length=0;applyTheme();save();updateHud();banner(`${stageName(g)} ${theme().name}`,'#9fdcff');});
 const here=document.querySelector('.chcard.here');if(here)here.scrollIntoView({block:'center'});}
$('#stagebox').onclick=stageMenu;

/* ---------- boot + main loop ---------- */
resizeStage();measureHud();addEventListener('resize',()=>{resizeStage();measureHud();});
bear.hp=MAXHP();applyTheme();questDot();lobbyText();renderPanel();updateHud();offlineReward();
let last=performance.now(),saveT=10,hudT=0;
function frame(now){requestAnimationFrame(frame);const raw=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
 if(screen==='lobby'){drawLobby(t);return;}
 if(screen==='pro'){drawPrologue(t,raw);return;}
 let dt=Math.min(raw,1/20);if(hitstop>0){hitstop-=dt;dt*=.08;}shake=Math.max(0,shake-raw*30);
 step(dt);if(S.spd===2)step(dt);render(t);
 hudT-=raw;if(hudT<0){hudT=.25;updateHud();}
 saveT-=raw;if(saveT<0){saveT=10;save();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
requestAnimationFrame(frame);

</script>
