<title>잃어버린 고향을 찾아서</title>
<style>
:root{--ink:#16233f;--ink2:#4a5a7c;--paper:#f6f9ff;--glass:rgba(255,255,255,.12);--glass-b:rgba(255,255,255,.28);
 --gold:#ffcf3d;--gem:#7fe3ff;--hp:#ff5b6e;--exp:#8ae86a;--accent:#3d8bff;--accent2:#6b5bff;
 --f-title:"Jal","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-body:"Ssr","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0b1630;color:#fff;font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(120% 80% at 50% 0%,#1d3f7a 0%,#0b1630 60%,#060c1c 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
/* stage */
#stage{position:relative;flex:0 0 auto;height:min(56vh,560px);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* hud */
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 10px 0;display:flex;flex-direction:column;gap:7px;pointer-events:none;z-index:5}
.hrow{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:rgba(10,20,45,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--f-title);font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.pill i{width:20px;height:20px;display:block;flex:none}
#lvbox{flex:1;min-width:0;padding-left:5px}
#lvtxt{flex:none}
.bar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;min-width:30px}
.bar b{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#5fd35a,#c3ff79);box-shadow:0 0 8px rgba(160,255,120,.6);transition:width .25s}
#stagebox{justify-content:center;flex-direction:column;align-items:center;height:auto;padding:5px 16px 6px;border-radius:16px;gap:3px}
#stname{font-size:15px;letter-spacing:.5px}
#stsub{font-family:var(--f-body);font-size:11px;opacity:.85}
#killbar{width:150px;height:6px}
#killbar b{background:linear-gradient(90deg,#ffb93d,#ffe680);box-shadow:0 0 8px rgba(255,200,80,.6)}
#bossbtn{pointer-events:auto;font-family:var(--f-title);font-size:13px;padding:7px 14px;border-radius:999px;background:linear-gradient(#ff6a7d,#e2364f);box-shadow:0 3px 0 #9c1d33,0 0 18px rgba(255,80,100,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#bosstimer{width:170px;height:7px}#bosstimer b{background:linear-gradient(90deg,#ff3d5a,#ff9a6a)}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--f-title);font-size:34px;letter-spacing:1px;pointer-events:none;z-index:6;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px currentColor}
#banner.show{animation:ban 1.8s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(8,16,36,.8);border:1px solid rgba(255,255,255,.2);font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s;z-index:7;pointer-events:none}
#toast.show{opacity:1}
/* panel */
#panel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#e9f1ff,#dbe7fb);color:var(--ink);border-radius:22px 22px 0 0;margin-top:-18px;z-index:8;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
#tabs{display:flex;gap:6px;padding:10px 12px 6px}
.tab{flex:1;height:38px;border-radius:12px;font-family:var(--f-title);font-size:14px;color:var(--ink2);background:#cfdcf3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.tab.on{color:#fff;background:linear-gradient(#4f9bff,#2f6fe0);box-shadow:0 3px 0 #1f4fa8,0 6px 14px rgba(47,111,224,.35)}

<script>
'use strict';
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
const hexRGB=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];};
function fmt(n){n=Math.floor(n);if(n<1e4)return n.toLocaleString('en-US');
 for(const[v,s]of[[1e20,'해'],[1e16,'경'],[1e12,'조'],[1e8,'억'],[1e4,'만']])if(n>=v){const x=n/v;let t=x>=100?String(Math.floor(x)):x.toFixed(x>=10?1:2);if(t.includes('.'))t=t.replace(/\.?0+$/,'');return t+s;}}

/* ---------- save ---------- */
const KEY='lost-home-v3';
const S0={gold:0,gem:300,lv:1,exp:0,g:0,kills:0,best:0,up:{atk:0,hp:0,regen:0,crit:0,critd:0,aspd:0},farm:false,snd:true,mult:1,started:false,t:0,stats:{kills:0,bosses:0,gold:0,play:0},
 inv:{plank:{n:1,lv:0}},eq:{w:'plank',a1:null,a2:null,c:null},skl:{glacier:1,tornado:1,beam:1},sauto:true,pets:{},pet:null,hero:'bear',dun:{},stone:0};
let S=JSON.parse(JSON.stringify(S0));
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s,{up:Object.assign(S.up,s.up||{}),stats:Object.assign(S.stats,s.stats||{})});}catch(e){}
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function resetSave(){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}

/* ---------- growth (balance kept from the old game) ---------- */
const UPS=[
 {k:'atk',n:'공격력',d:'백곰의 기본 공격력',max:9999,cost:l=>10*Math.pow(1.1,l),val:l=>12*Math.pow(1.085,l)+6*l,show:v=>fmt(v)},

 if(blink>.5){c.beginPath();c.moveTo(x-r,y);c.quadraticCurveTo(x,y+r*.5,x+r,y);c.lineWidth=2.2;c.strokeStyle=OL;c.stroke();return;}
 ell(c,x,y,r,r*1.1);fs(c,'#fff',2);ell(c,x+look*r*.3,y+r*.1,r*.62,r*.72);c.fillStyle='#1a2140';c.fill();
 ell(c,x+look*r*.3-r*.22,y-r*.18,r*.22,r*.22);c.fillStyle='#fff';c.fill();
 if(angry){c.beginPath();c.moveTo(x-r*1.1*-look,y-r*1.25);c.lineTo(x+r*1.1*-look,y-r*.75);c.lineWidth=3;c.lineCap='round';c.strokeStyle=OL;c.stroke();}
}
function mouth(c,x,y,w,open=0){c.beginPath();if(open>0){ell(c,x,y,w*.6,w*.45*open);c.fillStyle='#4a1a2a';c.fill();c.lineWidth=2;c.strokeStyle=OL;c.stroke();}
 else{c.moveTo(x-w*.5,y);c.quadraticCurveTo(x,y+w*.35,x+w*.5,y);c.lineWidth=2.2;c.lineCap='round';c.strokeStyle=OL;c.stroke();}}
function fang(c,x,y,s=1){c.beginPath();c.moveTo(x-3*s,y);c.lineTo(x,y+5*s);c.lineTo(x+3*s,y);c.fillStyle='#fff';c.fill();}

 const N=16,out=[],inn=[];for(let i=0;i<=N;i++){const k=i/N,[o,n]=swingPts(p0+(p1-p0)*k,m.t);out.push(o);inn.push([lerp(o[0],n[0],Math.pow(k,.7)),lerp(o[1],n[1],Math.pow(k,.7))]);}
 const poly=(A,B)=>{c.beginPath();c.moveTo(A[0][0],A[0][1]);for(const q of A)c.lineTo(q[0],q[1]);for(let i=B.length-1;i>=0;i--)c.lineTo(B[i][0],B[i][1]);c.closePath();};
 // trail colour follows the weapon grade (C keeps the warm orange)
 const g=curWeapon().g,[r,gg,bb]=g?hexRGB(GCOL[g]).map(v=>Math.round(v*255)):[255,130,35];
 c.save();c.globalCompositeOperation='lighter';
 poly(out,inn);c.shadowColor=`rgb(${r},${gg},${bb})`;c.shadowBlur=18;c.fillStyle=`rgba(${r},${gg},${bb},${.55*fade})`;c.fill();c.shadowBlur=0;
 const mid=out.map((o,i)=>[lerp(o[0],inn[i][0],.45),lerp(o[1],inn[i][1],.45)]);poly(out,mid);c.fillStyle=`rgba(${Math.min(255,r+90)},${Math.min(255,gg+90)},${Math.min(255,bb+90)},${.8*fade})`;c.fill();
 const core=out.map((o,i)=>[lerp(o[0],inn[i][0],.18),lerp(o[1],inn[i][1],.18)]);poly(out,core);c.fillStyle=`rgba(255,255,255,${.95*fade})`;c.fill();
 c.restore();}

 c.lineTo(ex-n2[0]*w2,ey-n2[1]*w2);
 c.quadraticCurveTo(jx+d2x*L2*.45-n2[0]*w1*1.05,jy+d2y*L2*.45-n2[1]*w1*1.05,jx-nj[0]*w1,jy-nj[1]*w1);
 c.quadraticCurveTo(x+d1x*L1*.5-n1[0]*w0*1.08,y+d1y*L1*.5-n1[1]*w0*1.08,x-n1[0]*w0,y-n1[1]*w0);
 c.arc(x,y,w0,Math.atan2(-n1[1],-n1[0]),Math.atan2(n1[1],n1[0]),false);c.closePath();

function cosId(){const k=S.eq.c;return k&&S.inv[k]?gsplit(k)[0]:null;}

function castSkill(k){if(!skOpen(k)||skCd[k]>0||bear.dead)return false;skCd[k]=SKILLS[k].cd;track('skill');const live=mobs.filter(m=>!m.dead).sort((a,b)=>a.x-b.x);sfx('crit');
 if(k==='glacier'){const tg=live.slice(0,4);if(!tg.length)tg.push({x:BX+150*K});tg.forEach((m,i)=>skFx.push({k,x:m.x,t:-i*.12,hit:false}));}

 if(k==='beam'){skFx.push({k,t:0,tick:0});shake=Math.max(shake,6);}

function stepSkills(dt){
 for(const k in skCd){skCd[k]=Math.max(0,skCd[k]-dt);if(S.sauto&&skCd[k]===0&&skOpen(k)&&mobs.some(m=>!m.dead&&m.x<W))castSkill(k);}
 for(let i=skFx.length-1;i>=0;i--){const f=skFx[i];f.t+=dt;
  if(f.k==='glacier'){if(!f.hit&&f.t>=.35){f.hit=true;skHitAt(f.x,45*K,skDmg('glacier'),'#bff4ff');ring(f.x,GY,'#bff4ff',50*K);debris(f.x,GY-10*K,10,'#cfefff',K);shake=Math.max(shake,5);}if(f.t>.9)skFx.splice(i,1);}
  else if(f.k==='tornado'){f.x+=150*K*dt;f.tick-=dt;if(f.tick<=0){f.tick=.25;skHitAt(f.x,40*K,skDmg('tornado'),'#ffffff');}if(f.t>2.4||f.x>W+60)skFx.splice(i,1);}
  else if(f.k==='beam'){f.tick-=dt;if(f.t>.15&&f.t<.95&&f.tick<=0){f.tick=.16;skHitAt((BX+W)/2,W,skDmg('beam')/5,'#7affd8');}if(f.t>1.2)skFx.splice(i,1);}}
}

 for(const f of skFx){

  else if(f.k==='tornado'){const a=Math.min(1,f.t*4)*(f.t>2?1-(f.t-2)/.4:1);c.globalAlpha=a;
   for(let i=0;i<14;i++){const h=i/14,r=(8+h*30)*K,y=GY-h*110*K,ang=t*12+i*.9;c.beginPath();c.ellipse(f.x+Math.sin(ang)*r*.3,y,r,r*.28,0,0,TAU);c.strokeStyle=`rgba(235,248,255,${.25+.35*(1-h)})`;c.lineWidth=(3-h*1.5)*K;c.stroke();}

  else if(f.k==='beam'){const a=f.t<.15?f.t/.15:f.t>.95?Math.max(0,1-(f.t-.95)/.25):1,y=GY-62*K,hw=(22+6*Math.sin(t*30))*K*a;
   c.globalCompositeOperation='lighter';for(const[w2,al]of[[1.8,.25],[1,.6],[.45,1]]){const g=c.createLinearGradient(0,y-hw*w2,0,y+hw*w2);

    c.fillStyle=g;c.beginPath();c.moveTo(BX+18*K,y-hw*w2*.4);for(let x=BX+18*K;x<=W+20;x+=12){c.lineTo(x,y-hw*w2+Math.sin(x*.05-t*20)*3*K);}for(let x=W+20;x>=BX+18*K;x-=12){c.lineTo(x,y+hw*w2+Math.sin(x*.05-t*20+2)*3*K);}c.closePath();c.fill();}
   ell(c,BX+20*K,y,hw*1.2,hw*1.2);c.fillStyle='rgba(255,255,255,.7)';c.fill();c.globalCompositeOperation='source-over';}

const PETS={

 rudol:{n:'루돌',an:'순록',g:3,kind:'dash',mul:1.1,cd:2,at:'돌진해서 밀어내기',bk:'hp',bv:15,col:'#c69a66',push:1},
 orca:{n:'오르카',an:'범고래',g:4,kind:'aoe',mul:1.2,cd:3,at:'파도 박치기',bk:'critd',bv:40,col:'#5ab4f0',fly:1},

const PB_N={hp:'체력',gold:'골드 획득',atk:'공격력',crit:'치명타 확률',regen:'체력 회복',def:'받는 피해 감소',thorn:'피해 반사',critd:'치명타 피해',aspd:'공격 속도'};
for(const k of Object.keys(S.pets))if(!k.includes('#'))delete S.pets[k];
if(S.pet&&!S.pets[S.pet])S.pet=null;
function addPet(id,g){const k=gkey(id,g),own=S.pets[k];S.pets[k]={n:(own?.n||0)+1,lv:own?.lv||0};if(!S.pet||gsplit(S.pet)[1]<g)S.pet=k;return!own;}
const canMergePet=k=>{const[,g]=gsplit(k),o=S.pets[k];return o&&g<6&&o.n>=MERGE_N;};
function mergePet(k){if(!canMergePet(k))return null;const[id,g]=gsplit(k);S.pets[k].n-=MERGE_N;if(S.pets[k].n<=0){delete S.pets[k];if(S.pet===k)S.pet=null;}addPet(id,g+1);save();return gkey(id,g+1);}
function petMul(k){const[id,g]=gsplit(k);return PETS[id].mul*GMUL[g]*.6*enhMul(S.pets[k]?.lv||0);}
function petBonusOf(k){const[id,g]=gsplit(k),P=PETS[id];return P.bv*(1+.5*(g-P.g))*enhMul(S.pets[k]?.lv||0);}
// passive bonus of the equipped pet (percent, or +points for crit)
function PB(stat){if(!S.pet||!S.pets[S.pet])return 0;const[id]=gsplit(S.pet);return PETS[id].bk===stat?petBonusOf(S.pet):0;}
/* ---------- runtime ---------- */
const pet={x:0,y:0,cd:1,mode:'idle',t:0,tx:0,ph:0,hits:null,n:0,fx:[]};
function petHit(m,mul,col){const crit=Math.random()*100<stat('crit');const d=ATK()*petMul(S.pet)*mul*(crit?stat('critd')/100:1);hitMob(m,d,crit);sparks(m.x,m.y-35*K*m.size,8,col,280);return d;}
function stepPet(dt){if(!S.pet||!S.pets[S.pet])return;const[id,g]=gsplit(S.pet),P=PETS[id],home=BX-52*K,tg=front();pet.ph+=dt*9*Math.max(bear.walk,.2);
 if(!pet.x)pet.x=home;pet.cd-=dt;const air=P.fly?GY-(85+Math.sin(performance.now()/500)*6)*K:GY;
 for(let i=pet.fx.length-1;i>=0;i--){const f=pet.fx[i];f.t+=dt;if(f.kind==='wave'){f.x+=380*K*dt;for(const m of mobs)if(!m.dead&&!f.hit.has(m)&&Math.abs(m.x-f.x)<20*K){f.hit.add(m);petHit(m,f.mul,P.col);}if(f.x>W+40)pet.fx.splice(i,1);}else if(f.t>.6)pet.fx.splice(i,1);}
 if(pet.mode==='idle'){pet.x=lerp(pet.x,home,dt*4);pet.y=air;
  if(pet.cd<=0&&tg&&tg.x<W*.95&&!bear.dead){pet.cd=P.cd;pet.t=0;pet.n++;const sk=g>=3&&pet.n%5===0,mul=sk?3:1;pet.sk=sk;if(sk)num(pet.x,pet.y-60*K,'★'+P.at,'gold');
   if(P.kind==='proj'||P.kind==='heal')shots.push({x:pet.x+12*K,y:pet.y-24*K,vx:440*K,col:P.col,dmg:0,pet:1,mul,heal:P.kind==='heal'});
   else if(P.kind==='spines')for(let i=-1;i<=1;i++)shots.push({x:pet.x+12*K,y:pet.y-20*K+i*10*K,vx:460*K,col:P.col,dmg:0,pet:1,mul});
   else if(P.kind==='stun'){pet.fx.push({kind:'ring',t:0});for(const m of mobs)if(!m.dead&&m.x<W){m.frozen=Math.max(m.frozen||0,sk?2:.9);petHit(m,mul,P.col);}sfx('hurt');}
   else if(P.kind==='aoe')pet.fx.push({kind:'wave',t:0,x:pet.x,hit:new Set(),mul});
   else if(P.kind==='pierce'){pet.mode='slide';pet.hits=new Set();pet.mul=mul;}
   else{pet.mode='go';pet.tx=tg.x;pet.hitDone=false;pet.mul=mul;}}}
 else if(pet.mode==='slide'){pet.t+=dt;pet.x+=520*K*dt;pet.y=P.fly?air:GY;for(const m of mobs)if(!m.dead&&!pet.hits.has(m)&&Math.abs(m.x-pet.x)<22*K){pet.hits.add(m);petHit(m,pet.mul,P.col);}
  if(pet.x>W+40){pet.mode='idle';pet.x=-30*K;}}
 else{pet.t+=dt;const k=pet.mode==='go'?Math.min(1,pet.t/.35):1-Math.min(1,pet.t/.4);
  pet.x=lerp(home,pet.tx-24*K,k);pet.y=P.fly?lerp(air,GY-30*K,k):GY-Math.sin(k*Math.PI)*14*K*(pet.mode==='go'?1:0);
  if(pet.mode==='go'&&k>=1){if(!pet.hitDone){pet.hitDone=true;const m=mobs.find(o=>!o.dead&&Math.abs(o.x-pet.tx)<40*K)||front();
    if(m){const hits=P.kind==='multi'?3:1;for(let i=0;i<hits;i++)petHit(m,pet.mul,P.col);if(P.push)for(const o of mobs)if(!o.dead&&o.x<pet.tx+60*K)o.kb+=40*K;}}pet.mode='back';pet.t=0;}
  else if(pet.mode==='back'&&k<=0)pet.mode='idle';}}
// pet projectiles travel right on the shared shots list
function petShotHit(s){const tg=mobs.find(m=>!m.dead&&Math.abs(m.x-s.x)<20*K);if(tg){const d=petHit(tg,s.mul||1,s.col);if(s.heal){const h=MAXHP()*.03*(s.mul||1);bear.hp=Math.min(MAXHP(),bear.hp+h);num(BX,GY-120*K,'+'+fmt(h),'heal');}return true;}return s.x>W+20;}

/* ---------- S급 이상 무기 필살기 (10종) ----------
 Every hit fills the gauge; when full the weapon's ult fires automatically. Each tick hits every monster on screen. */

};
const ULT_HITS=12;let ultG=0,ultFx=null;
function ultCharge(){const w=curWeapon();if(!w.ult||ultFx)return;ultG=Math.min(1,ultG+1/ULT_HITS);}
function stepUlt(dt){const w=curWeapon();
 if(!ultFx&&w.ult&&ultG>=1&&!bear.dead&&mobs.some(m=>!m.dead&&m.x<W)){const U=ULTS[w.ult];ultG=0;ultFx={k:w.ult,t:0,i:0,g:w.g};banner(U.n,U.col);sfx('boss');hitstop=.12;shake=8;
  if(w.ult==='zero')for(const m of mobs)if(!m.dead)m.frozen=1.5;}
 if(!ultFx)return;const U=ULTS[ultFx.k];ultFx.t+=dt;
 while(ultFx.i<U.ticks.length&&ultFx.t>=U.ticks[ultFx.i]){ultFx.i++;const dmg=ATK()*U.dmg*(1+.3*(ultFx.g-3));
  for(const m of mobs)if(!m.dead&&m.x<W+20){const crit=Math.random()*100<stat('crit');hitMob(m,dmg*(crit?stat('critd')/100:1),crit);sparks(m.x,m.y-50*K*m.size,10,U.col,360);}shake=Math.max(shake,ultFx.k==='neon'||ultFx.k==='zero'?14:6);}
 if(ultFx.t>=U.dur)ultFx=null;}
function liveMobs(){return mobs.filter(m=>!m.dead&&m.x<W+20);}
function drawUlt(c,t){if(!ultFx)return;const f=ultFx,U=ULTS[f.k],p=f.t/U.dur,col=U.col,M=liveMobs(),fade=p>.85?1-(p-.85)/.15:1;c.save();
 const flash=(a)=>{c.globalCompositeOperation='source-over';c.fillStyle=`rgba(255,255,255,${a})`;c.fillRect(0,0,W,H);};
 const near=k=>U.ticks.reduce((m,x)=>Math.min(m,Math.abs(f.t-x)),9)<k;
 if(f.k==='bolt'){c.fillStyle=`rgba(10,10,40,${.35*fade})`;c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';
  if(near(.08))for(const m of M){c.beginPath();let x=m.x+rnd(-20,20),y=0;c.moveTo(x,y);while(y<m.y-20*K){y+=rnd(14,26)*K;x+=rnd(-14,14)*K;c.lineTo(x,y);}c.lineTo(m.x,m.y-30*K);c.strokeStyle=col;c.lineWidth=4*K;c.shadowColor=col;c.shadowBlur=20;c.stroke();c.strokeStyle='#fff';c.lineWidth=1.5*K;c.stroke();}
  if(near(.04))flash(.25);}
 else if(f.k==='neon'){c.fillStyle=`rgba(20,0,30,${.6*fade})`;c.fillRect(0,0,W,H);const y=GY-55*K;c.globalCompositeOperation='lighter';
  if(f.t<.55){const k=f.t/.55;c.strokeStyle=col;c.lineWidth=2;c.shadowColor=col;c.shadowBlur=14;c.beginPath();c.moveTo(BX,y);c.lineTo(BX+(W-BX)*k,y);c.stroke();}
  else{const k=Math.max(0,1-(f.t-.55)/.5);for(const[w2,a]of[[22,.35],[9,.7],[3,1]]){c.fillStyle=w2===3?`rgba(255,255,255,${a*k})`:`rgba(255,58,216,${a*k})`;c.fillRect(0,y-w2*K*k,W,w2*2*K*k);}if(f.t<.65)flash(.5);}}
 else if(f.k==='rainbow'){c.globalCompositeOperation='lighter';for(let i=0;i<3;i++){const k=(f.t-U.ticks[i]+.3);if(k<0||k>.9)continue;const r=k*W*1.1;for(let j=0;j<6;j++){c.beginPath();c.arc(BX,GY-50*K,r-j*7*K,0,TAU);c.strokeStyle=`hsla(${j*55+t*200},95%,65%,${(1-k/.9)*.8})`;c.lineWidth=6*K;c.stroke();}}}
 else if(f.k==='holy'){c.fillStyle=`rgba(255,240,180,${.15*fade})`;c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';for(const m of M){const k=Math.min(1,f.t/.6),w2=(18+Math.sin(t*20)*3)*K;
  const g=c.createLinearGradient(m.x-w2,0,m.x+w2,0);g.addColorStop(0,'rgba(255,240,170,0)');g.addColorStop(.5,`rgba(255,250,220,${.9*fade})`);g.addColorStop(1,'rgba(255,240,170,0)');c.fillStyle=g;c.fillRect(m.x-w2,0,w2*2,GY*k);
  c.beginPath();c.ellipse(m.x,GY,w2*1.6,w2*.4,0,0,TAU);c.strokeStyle=`rgba(255,240,170,${fade})`;c.lineWidth=2;c.stroke();}}
 else if(f.k==='deadeye'){c.fillStyle=`rgba(60,0,0,${.45*fade})`;c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';M.forEach((m,i)=>{const k=Math.min(1,f.t/(.5+i*.04)),r=(40-26*k)*K,y=m.y-ART_H[m.arch]*.5*K*m.size;

const BSK={
 barkas:[{n:'대지 분쇄',col:'#ff7a3a',kind:'slam',mul:4},{n:'강철 돌진',col:'#c8ccd6',kind:'charge',mul:3}],

const TELE=.8,CAST=1.5;
function stepBoss(m,dt){if(!m||m.dead)return;if(m.skT==null){m.skT=4;m.phase=1;}
 if(m.id==='king'){const ph=m.hp<m.max*.33?3:m.hp<m.max*.66?2:1;if(ph>m.phase){m.phase=ph;m.size*=1.1;m.skT=1.2;hitstop=.4;shake=16;banner(ph===2?'마왕 각성!':'진정한 마왕 녹스!','#ff2a3a');sfx('boss');sparks(m.x,m.y-90*K,40,'#ff2a3a',500);}}
 else if(!m.enraged&&m.hp<m.max*.5){m.enraged=true;banner('분노!','#ff5a3a');sfx('boss');}
 if(m.frozen>0)return;
 if(!m.cast){m.skT-=dt;if(m.skT<=0&&!bear.dead&&m.x<W){const list=(BSK[m.id]||BSK._).filter(s=>!s.ph||s.ph<=m.phase);m.cast={s:pick(list),t:0,done:false,x0:m.x};num(m.x,m.y-ART_H[m.arch]*K*m.size-24*K,m.cast.s.n,'hurt');}return;}
 const c=m.cast,s=c.s;c.t+=dt;
 if(s.kind==='charge'){const k=c.t<TELE?0:c.t<TELE+.25?(c.t-TELE)/.25:Math.max(0,1-(c.t-TELE-.25)/.4);m.x=lerp(c.x0,BX+40*K,k);}
 if(!c.done&&c.t>=TELE){c.done=true;const d=m.dmg*s.mul;
  if(!bear.dead)hurtBear(d);shake=Math.max(shake,12);hitstop=Math.max(hitstop,.08);sfx('crit');
  if(s.kind==='drain'){const h=m.max*.04;m.hp=Math.min(m.max,m.hp+h);num(m.x,m.y-120*K,'+'+fmt(h),'heal');}
  if(s.kind==='slam'){ring(BX,GY,s.col,70*K,.6);debris(BX,GY-5*K,14,'#8a7a6a',K);}
  if(s.kind==='rain')for(let i=0;i<24;i++)part({x:BX+rnd(-60,60)*K,y:-10,vx:rnd(-40,40),vy:rnd(500,800),g:400,life:.6,ml:.6,size:rnd(3,6),col:s.col,type:'spark'});
  if(s.kind==='pillar'||s.kind==='slash')sparks(BX,GY-60*K,30,s.col,420);}
 if(c.t>=CAST){m.cast=null;m.skT=rnd(6,8)/(m.enraged||m.phase>1?1.5:1);}}
function drawBossFx(c,t){const m=boss;if(!m||m.dead)return;c.save();
 if(m.enraged||m.phase>1){c.globalCompositeOperation='lighter';const cy=m.y-ART_H[m.arch]*.5*K*m.size,r=ART_H[m.arch]*.7*K*m.size;const g=c.createRadialGradient(m.x,cy,r*.2,m.x,cy,r);g.addColorStop(0,`rgba(255,40,60,${.18+.08*Math.sin(t*6)})`);g.addColorStop(1,'rgba(255,40,60,0)');c.fillStyle=g;c.fillRect(m.x-r,cy-r,r*2,r*2);c.globalCompositeOperation='source-over';}
 const cs=m.cast;if(cs){const s=cs.s;
  if(cs.t<TELE){const k=cs.t/TELE;c.fillStyle=`rgba(255,40,60,${.15+.25*k})`;c.beginPath();c.ellipse(BX,GY,(50+30*k)*K,(10+5*k)*K,0,0,TAU);c.fill();c.strokeStyle=`rgba(255,80,90,${.6+.4*Math.sin(t*30)})`;c.lineWidth=2;c.stroke();
   c.font=`${26*K}px Jal, sans-serif`;c.textAlign='center';c.fillStyle='#ff3a4a';c.strokeStyle='#200';c.lineWidth=4;c.strokeText('!',BX,GY-140*K);c.fillText('!',BX,GY-140*K);}
  else{const k=(cs.t-TELE)/(CAST-TELE),a=1-k;c.globalCompositeOperation='lighter';
   if(s.kind==='slash'){c.save();c.translate(BX+10*K,GY-60*K);c.rotate(-.5);const r=90*K;c.beginPath();c.arc(-r*.4,0,r,-1.1,1.1);c.arc(-r*.4-r*.3,0,r*.9,1,-1,true);c.closePath();c.fillStyle=s.col;c.globalAlpha=a;c.shadowColor=s.col;c.shadowBlur=24;c.fill();c.restore();}
   else if(s.kind==='pillar'){const g=c.createLinearGradient(0,GY,0,0);g.addColorStop(0,s.col);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=a;c.fillStyle=g;c.fillRect(BX-26*K,0,52*K,GY);c.fillStyle='rgba(255,255,255,.6)';c.fillRect(BX-6*K,0,12*K,GY);}
   else if(s.kind==='slam'){for(let i=0;i<3;i++){c.beginPath();c.ellipse(BX,GY,(40+k*120+i*20)*K,(8+k*20)*K,0,0,TAU);c.strokeStyle=s.col;c.globalAlpha=a*(1-i*.25);c.lineWidth=4;c.stroke();}}
   else if(s.kind==='drain'){c.globalAlpha=a;for(let i=0;i<5;i++){const q=(k*2+i/5)%1;ell(c,lerp(BX,m.x,q),lerp(GY-60*K,m.y-80*K,q)+Math.sin(q*9+i)*10*K,4*K,4*K);c.fillStyle=s.col;c.fill();}}
   else if(s.kind==='charge'){c.globalAlpha=a*.7;c.strokeStyle='#fff';c.lineWidth=2;for(let i=0;i<6;i++){const y=m.y-(20+i*18)*K;c.beginPath();c.moveTo(m.x+20*K,y);c.lineTo(m.x+(70+i*8)*K,y);c.stroke();}}}}
 c.restore();}

function kingWings(c,t){const f=Math.sin(t*3)*.15;for(const s of[1,.85]){c.save();c.translate(-6,-130);c.rotate(-.3-f);c.scale(s,s);c.beginPath();c.moveTo(0,0);c.lineTo(-30,-40);c.lineTo(-80,-46);c.quadraticCurveTo(-70,-20,-86,-8);c.quadraticCurveTo(-64,-6,-70,14);c.quadraticCurveTo(-46,4,-44,26);c.quadraticCurveTo(-26,10,0,10);c.closePath();

 c.strokeStyle='rgba(255,60,80,.5)';c.lineWidth=1.2;c.beginPath();c.moveTo(0,0);c.lineTo(-80,-46);c.moveTo(-30,-40);c.lineTo(-86,-8);c.moveTo(-30,-40);c.lineTo(-70,14);c.stroke();c.restore();}}

function track(ev,n=1){S.cnt[ev]=(S.cnt[ev]||0)+n;dailyReset();S.daily.c[ev]=(S.daily.c[ev]||0)+n;questDot();}
// main quest: target scales each full cycle so it never runs out
function curQuest(){const q=QUESTS[S.q.i%QUESTS.length],cyc=Math.floor(S.q.i/QUESTS.length),n=q.goldK?Math.floor(mobGold(Math.max(S.best,1))*200*(1+cyc)):Math.ceil(q.n*(1+cyc*.5));
 return{...q,n,have:Math.min(n,(S.cnt[q.ev]||0)-S.q.base),reward:30+cyc*10,text:q.d.replace('{n}',fmt(n))};}
function claimQuest(){const q=curQuest();if(q.have<q.n)return;S.gem+=q.reward;S.q.i++;S.q.base=S.cnt[QUESTS[S.q.i%QUESTS.length].ev]||0;sfx('clear');save();}
function canAttend(){return S.att.last!==today();}
function attend(){if(!canAttend())return null;const day=S.att.n%7,r=ATTEND[day];S.gem+=r.gem;S.stone=(S.stone||0)+(r.stone||0);S.att.n++;S.att.last=today();sfx('clear');save();return r;}
function dailyDone(i){dailyReset();return(S.daily.c[DAILY[i].ev]||0)>=DAILY[i].n;}
function claimDaily(i){if(!dailyDone(i)||S.daily.got.includes(i))return;S.daily.got.push(i);S.gem+=30;if(S.daily.got.length===DAILY.length&&!S.daily.all){S.daily.all=true;S.gem+=100;S.stone=(S.stone||0)+3;toast('일일 퀘스트 모두 완료! 보석 +100, 강화석 +3');}sfx('clear');save();}
function questReady(){dailyReset();const q=curQuest();return canAttend()||q.have>=q.n||DAILY.some((_,i)=>dailyDone(i)&&!S.daily.got.includes(i));}
function questDot(){const b=$('#qbtn');if(b)b.classList.toggle('dot',questReady());}
function questMenu(){dailyReset();const q=curQuest(),day=S.att.n%7;
 const att=ATTEND.map((r,i)=>{const isToday=i===day&&canAttend();return`<div class="att${i<day?' got':''}${isToday?' now':''}"><small>${i+1}일</small><b>${r.gem}</b>${r.stone?`<i>+석${r.stone}</i>`:''}</div>`;}).join('');
 const dl=DAILY.map((d,i)=>{const have=Math.min(d.n,S.daily.c[d.ev]||0),got=S.daily.got.includes(i);return`<div class="qrow"><span>${d.d}</span><div class="bar"><b style="width:${have/d.n*100}%"></b></div><button class="qbtn2${got?' got':have>=d.n?' ok':''}" data-di="${i}">${got?'완료':have>=d.n?'받기':`${fmt(have)}/${fmt(d.n)}`}</button></div>`;}).join('');
 modal('퀘스트',`<div class="qsec">출석 보상 <small>${canAttend()?'오늘 받을 수 있어요':'내일 다시 와요'}</small></div><div class="attrow">${att}</div>${canAttend()?'<button class="btn2" id="attbtn" style="width:100%;margin-top:6px">출석하기</button>':''}
  <div class="qsec">퀘스트 <small>보석 ${q.reward}</small></div><div class="qrow"><span>${q.text}</span><div class="bar"><b style="width:${q.have/q.n*100}%"></b></div><button class="qbtn2${q.have>=q.n?' ok':''}" id="mqbtn">${q.have>=q.n?'받기':`${fmt(q.have)}/${fmt(q.n)}`}</button></div>
  <div class="qsec">일일 퀘스트 <small>각 보석 30 · 모두 완료 시 보석 100 + 강화석 3</small></div>${dl}`,[['닫기']],1);
 const ab=$('#attbtn');if(ab)ab.onclick=()=>{const r=attend();if(r)toast(`출석 ${S.att.n%7||7}일차! 보석 +${r.gem}${r.stone?`, 강화석 +${r.stone}`:''}`);updateHud();questMenu();};
 $('#mqbtn').onclick=()=>{claimQuest();updateHud();questMenu();};
 document.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{claimDaily(+b.dataset.di);updateHud();questMenu();});questDot();}

function part(o){if(parts.length<600)parts.push(Object.assign({vx:0,vy:0,g:0,life:.6,ml:.6,size:4,col:'#fff',type:'spark',rot:0,vr:0,drag:.9},o));}
function sparks(x,y,n,col,spd=260){for(let i=0;i<n;i++){const a=rnd(-Math.PI,Math.PI),v=rnd(.3,1)*spd;part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,g:500,life:rnd(.25,.5),size:rnd(2,4.5),col,type:'spark'});}}
function debris(x,y,n,col,k){for(let i=0;i<n;i++){const a=rnd(-2.8,-.3),v=rnd(120,320);part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:900,life:rnd(.5,.9),size:rnd(3,7)*k,col,type:'chunk',rot:rnd(0,6),vr:rnd(-12,12),drag:.98});}}
function dust(x,y,n,k){for(let i=0;i<n;i++)part({x:x+rnd(-12,12)*k,y,vx:rnd(-50,50),vy:rnd(-40,-10),life:rnd(.4,.8),size:rnd(6,12)*k,col:'rgba(255,255,255,.5)',type:'puff',drag:.94});}
function ring(x,y,col,size,life=.35){part({x,y,life,ml:life,size,col,type:'ring'});}
function slash(x,y,k,crit){part({x,y,life:.18,ml:.18,size:60*k,col:crit?'#ffe27a':'#ffffff',type:'slash',rot:rnd(-.3,.3)});}
function num(x,y,v,kind){nums.push({x:x+rnd(-8,8),y,vy:-90,life:1,txt:typeof v==='string'?v:fmt(v),v:typeof v==='number'?v:0,kind});}
// damage colour by unit: [min value, top colour, bottom colour] — 만 yellow, 억 orange, 조 purple, 경 green, 해 pink

function drawDmg(c,x,y,txt,v,crit,size,alpha){const[,top,bot]=DMG_TIER.find(t=>v>=t[0]);const sz=size*(crit?1.45:1);
 c.font=`${sz}px Jal, sans-serif`;c.textAlign='center';c.textBaseline='alphabetic';c.lineJoin='round';c.globalAlpha=alpha;
 if(crit){c.shadowColor=bot;c.shadowBlur=sz*.5;}
 c.lineWidth=sz*(crit?.34:.26);c.strokeStyle='#160c1c';c.strokeText(txt,x,y);c.shadowBlur=0;
 c.lineWidth=sz*(crit?.12:.08);c.strokeStyle=crit?'rgba(255,255,255,.85)':'rgba(255,255,255,.35)';c.strokeText(txt,x,y);

 if(crit){c.save();c.beginPath();c.rect(x-sz*4,y-sz*.85,sz*8,sz*.32);c.clip();c.fillStyle='rgba(255,255,255,.45)';c.fillText(txt,x,y);c.restore();}

function stepFx(dt){
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
  if(p.type==='coin'){p.t=(p.t||0)+dt;if(p.t>.45){const k=Math.min(1,(p.t-.45)/.35);p.x=lerp(p.x,p.tx,k*.35);p.y=lerp(p.y,p.ty,k*.35);if(Math.hypot(p.x-p.tx,p.y-p.ty)<12){parts.splice(i,1);sfx('coin');pulseGold();continue;}p.life=1;continue;}}
  p.vy+=p.g*dt;const d=Math.pow(p.drag,dt*60);p.vx*=d;p.vy*=d;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
  if(p.type==='coin'&&p.y>GY-4){p.y=GY-4;p.vy*=-.45;p.vx*=.6;}}
 for(let i=nums.length-1;i>=0;i--){const n=nums[i];n.life-=dt;n.y+=n.vy*dt;n.vy*=Math.pow(.9,dt*60);if(n.life<=0)nums.splice(i,1);}
}

/* ---------- sound (synthesized, no files) ---------- */
let AC=null,master=null,noiseBuf=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
 noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
addEventListener('pointerdown',()=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();},{passive:true});
const _last={};
function tone(f0,f1,dur,type='sine',vol=.2,delay=0){const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function noise(dur,f,vol=.2,q=1,type='bandpass'){const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dur);}
function sfx(n){if(!AC||!S.snd)return;const now=performance.now();if(now-(_last[n]||0)<(n==='coin'?45:30))return;_last[n]=now;
 switch(n){
  case'hit':noise(.09,900,.25,.8);tone(180,60,.09,'sine',.25);break;
  case'crit':noise(.14,2200,.3,.7);tone(320,90,.14,'triangle',.25);tone(1200,1800,.08,'sine',.08);break;
  case'kill':tone(520,1040,.12,'sine',.16);noise(.12,1600,.12,1.2);break;
  case'coin':tone(1320,1320,.06,'square',.04);tone(1760,1760,.09,'square',.04,.05);break;
  case'hurt':tone(220,110,.16,'sawtooth',.08);break;
  case'level':[523,659,784,1047].forEach((f,i)=>tone(f,f,.18,'triangle',.14,i*.08));break;
  case'boss':tone(110,98,.9,'sawtooth',.12);tone(165,147,.9,'sawtooth',.08);noise(.8,300,.12,.5,'lowpass');break;
  case'clear':[784,988,1175,1568].forEach((f,i)=>tone(f,f,.22,'triangle',.13,i*.09));break;
  case'buy':tone(880,1320,.08,'sine',.1);break;
  case'shot':tone(700,300,.1,'square',.04);break;
 }}

let W=400,H=420,K=1,GY=336,BX=100,scroll=0,shake=0,hitstop=0,curTheme=-1,boss=null,bossT=0;
const bear={hp:1,atk:-1,cd:0,hit:0,dead:false,deadT:0,ph:0,walk:0,regT:0};
const mobs=[],shots=[],pshots=[];
function resizeStage(){const r=$('#stage').getBoundingClientRect();if(!(r.width>0&&r.height>0))return;W=r.width;H=r.height;DPR=Math.min(window.devicePixelRatio||1,2);
 fg.width=W*DPR;fg.height=H*DPR;const q=Math.min(DPR,1.5);bgStage.resize(Math.round(W*q),Math.round(H*q));
 K=H/430;GY=H*(1-bgStage.ground);BX=W*.24;}
function mobDef(id){const d=MOBS[id];return{id,name:d[0],arch:d[1],sub:d[2],b:d[3],a:d[4],fly:d[5].includes('f'),ranged:d[5].includes('r')};}
function mkMob(id,x,tier){const d=mobDef(id),g=S.g+loopMul()*0;const hpM=tier===2?20:tier===1?5:1,atM=tier===2?3:tier===1?1.8:1;
 const size=d.arch==='human'?(id==='king'?1.15:1):(tier===2?(d.arch==='golem'?1.15:1.75):tier===1?1.3:1)*(d.arch==='golem'&&tier!==2?.62:1);
 return Object.assign(d,{x,y:d.fly?GY-rnd(55,85)*K:GY,hp:mobHp(g)*hpM,max:mobHp(g)*hpM,dmg:mobAtk(g)*atM,cd:rnd(.3,1.2),atk:-1,ph:rnd(0,6),seed:rnd(0,9),tier,size,hit:0,kb:0,dead:false,dt:0,spd:rnd(55,75)*(d.fly?1.15:1)});}
function spawnWave(){const th=theme(),n=3+Math.floor(Math.random()*3);
 for(let i=0;i<n;i++){const mid=Math.random()<.12&&i===n-1;mobs.push(mkMob(mid?pick(th.mids):pick(th.mobs),W+40*K+i*rnd(55,80)*K,mid?1:0));}}
function startBoss(){const th=theme();boss=mkMob(th.boss,W+80*K,2);mobs.push(boss);bossT=30;S.farm=false;banner('BOSS!','#ff5a6a');sfx('boss');shake=10;updateHud();}
function bossFail(){if(!boss)return;boss=null;for(const m of mobs)m.dead=true,m.dt=.01;S.farm=true;S.kills=0;toast('보스를 물리치지 못했어요. 더 강해져서 다시 도전해요!');save();updateHud();}
function stageClear(){track('stage');S.g++;S.kills=0;S.best=Math.max(S.best,S.g);S.gem+=3;save();sfx('clear');
 if(S.g%200===0)modal('마왕 녹스를 쓰러뜨렸어요!','오염의 근원이 사라지고, 북극의 빙하가 다시 얼기 시작했어요.<br>백곰은 마침내 고향으로 돌아갑니다.<br><br><b>더 강해진 세계에서 여정이 다시 시작돼요.</b>',[['계속하기',null,1]]);
 const th=theme();banner(S.g%10===0?th.name:`STAGE ${stageName(S.g)}`,S.g%10===0?'#9fdcff':'#ffe27a');if(S.g%10===9)toast('다음은 챕터 보스 스테이지예요!');applyTheme();updateHud();}
function applyTheme(){if(dun)return;const i=Math.floor(S.g/10)%THEMES.length;if(i!==curTheme){curTheme=i;bgStage.theme(THEMES[i]);}}
function gainExp(v){S.exp+=v;let up=false;while(S.exp>=needExp(S.lv)){S.exp-=needExp(S.lv);S.lv++;S.gem+=10;up=true;}
 if(up){banner('LEVEL UP!','#8ae86a');sfx('level');bear.hp=MAXHP();ring(BX,GY,'#8ae86a',60*K,.6);sparks(BX,GY-60*K,20,'#b8ff8a',300);}}
function killMob(m){if(dun){m.dead=true;m.dt=0;debris(m.x,m.y-30*K,9,m.b,K);sparks(m.x,m.y-30*K,12,m.a,320);sfx('kill');dunKill(m);return;}m.dead=true;m.dt=0;const g=S.g,gold=mobGold(g)*(m.tier===2?25:m.tier===1?4:1)*(1+PB('gold')/100);S.gold+=gold;S.stats.gold+=gold;S.stats.kills++;gainExp(mobExp(g)*(m.tier===2?20:m.tier===1?3:1));
 const cx=m.x,cy=m.y-ART_H[m.arch]*.4*K*m.size;debris(cx,cy,m.tier?16:9,m.b,K);sparks(cx,cy,12,m.a,320);ring(cx,m.fly?cy:GY,'rgba(255,255,255,.8)',40*K*m.size);sfx('kill');
 for(let i=0,n=m.tier?8:3;i<n;i++)part({x:cx,y:cy,vx:rnd(-140,140),vy:rnd(-380,-180),g:1100,life:1,ml:1,size:5.5*K,type:'coin',rot:rnd(0,6),vr:9,tx:GOLDX,ty:GOLDY,drag:.99});
 num(cx,cy-20*K,'+'+fmt(gold),'gold');track('kill');track('gold',gold);
 if(m===boss){track('boss');const bn=boss.name;boss=null;S.stats.bosses++;S.gem+=30;hitstop=.25;shake=14;victory(bn,gold,30);stageClear();return;}
 if(!S.farm&&S.g%10!==9){S.kills++;if(S.kills>=KILLS)stageClear();}
 else if(!S.farm&&S.g%10===9){S.kills=Math.min(KILLS,S.kills+1);}
 updateHud();}
function hitMob(m,dmg,crit){m.hp-=dmg;dunHit(m,dmg);m.hit=1;m.kb+=(m.tier===2?3:14)*K*(crit?1.6:1);const cy=m.y-ART_H[m.arch]*.45*K*m.size;
 num(m.x,cy-ART_H[m.arch]*.3*K*m.size,dmg,crit?'crit':'');sparks(m.x-ART_W[m.arch]*K*m.size*.5,cy,crit?14:7,crit?'#ffe27a':'#ffffff',crit?380:260);
 if(crit){shake=Math.max(shake,6);hitstop=Math.max(hitstop,.05);sfx('crit');}else sfx('hit');if(m.hp<=0)killMob(m);}
function front(){let best=null;for(const m of mobs)if(!m.dead&&(!best||m.x<best.x))best=m;return best;}
function reachX(m){return BX+(40+ART_W[m.arch]*m.size)*K;}
// how far the bear can hit with the current weapon kind
function bearReach(m){const r=curWeapon().kind.range;return r?BX+r*K:reachX(m);}
function bearHit(t,mul){const crit=Math.random()*100<stat('crit');const dmg=ATK()*curWeapon().kind.mul*mul*(crit?stat('critd')/100:1)*rnd(.92,1.08);hitMob(t,dmg,crit);ultCharge();return[dmg,crit];}
function fireProj(t){const w=curWeapon(),k=w.k,sp=k==='gun'?900:k==='throw'?520:420;
 pshots.push({kind:k,it:w,col:w.col,x:BX+(k==='gun'?50:30)*K,y:GY-(k==='gun'?72:k==='magic'?96:105)*K,tx:t.x,ty:t.y-ART_H[t.arch]*.45*K*t.size,sp:sp*K,spin:0,tg:t});sfx(k==='gun'?'shot':'buy');}
function hurtBear(d,src){if(bear.dead)return;d*=1-Math.min(60,PB('def'))/100;if(src&&!src.dead&&PB('thorn'))hitMob(src,d*PB('thorn')/10,false);bear.hp-=d;bear.hit=1;num(BX,GY-110*K,d,'hurt');sfx('hurt');shake=Math.max(shake,3);
 if(bear.hp<=0){bear.dead=true;bear.deadT=1.6;bear.hp=0;dust(BX,GY,10,K);if(boss)bossFail();if(dun)endDungeon(false);}}
function step(dt){
 S.stats.play+=dt;applyTheme();
 // bear
 bear.hit=Math.max(0,bear.hit-dt*5);
 if(bear.dead){bear.deadT-=dt;if(bear.deadT<=0){bear.dead=false;bear.hp=MAXHP();for(const m of mobs)m.x+=120*K;ring(BX,GY,'#9fdcff',50*K);}}
 else bear.hp=Math.min(MAXHP(),bear.hp+REGEN()*dt);
 const f=front(),engaged=f&&f.x<=bearReach(f)+10*K,wk=curWeapon().k;
 bear.walk=lerp(bear.walk,(!engaged&&!bear.dead)?1:0,dt*6);const spd=120*K*bear.walk;
 scroll+=spd*dt/H;bear.ph+=dt*9*bear.walk;
 if(bear.atk>=0){bear.atk+=dt/bear.ad;
  const hitAt=wk==='gun'?.05:wk==='melee'?.5:.46;
  if(!bear.done&&bear.atk>=hitAt){bear.done=true;const t=front();if(t&&t.x<=bearReach(t)+14*K){
   if(wk!=='melee')fireProj(t);
   else{const[dmg,crit]=bearHit(t,1);slash(t.x-ART_W[t.arch]*t.size*K*.4,t.y-ART_H[t.arch]*t.size*K*.4,K*(t.tier===2?1.6:1),crit);for(const o of mobs)if(o!==t&&!o.dead&&o.x<t.x+50*K)hitMob(o,dmg*.4,false);}}}
  if(bear.atk>=1)bear.atk=-1;}
 bear.cd-=dt;const interval=curWeapon().kind.spd/(1.6*stat('aspd'));
 if(!bear.dead&&bear.atk<0&&bear.cd<=0&&f&&f.x<=bearReach(f)+10*K){bear.atk=0;bear.done=false;bear.ad=Math.min({melee:.38,gun:.22,throw:.42,magic:.5}[wk],interval*.9);bear.cd=interval;}
 // bear projectiles
 for(let i=pshots.length-1;i>=0;i--){const p=pshots[i];if(p.tg&&!p.tg.dead){p.tx=p.tg.x;p.ty=p.tg.y-ART_H[p.tg.arch]*.45*K*p.tg.size;}
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),st=p.sp*dt;p.spin+=dt*18;
  if(d<=st+6*K){pshots.splice(i,1);const t=p.tg&&!p.tg.dead?p.tg:mobs.find(m=>!m.dead&&Math.abs(m.x-p.tx)<30*K);if(!t)continue;
   const[dmg]=bearHit(t,1);if(p.kind==='magic'){ring(p.tx,p.ty,p.col,40*K);sparks(p.tx,p.ty,14,p.col,320);for(const o of mobs)if(o!==t&&!o.dead&&Math.abs(o.x-t.x)<55*K)hitMob(o,dmg*.5,false);}
   else if(p.kind==='throw'&&p.it.shape==='balloon'){ring(p.tx,p.ty,'#bfe8ff',30*K);sparks(p.tx,p.ty,12,'#bfe8ff',260);}continue;}
  p.x+=dx/d*st;p.y+=dy/d*st-(p.kind==='throw'?Math.sin(Math.min(1,(p.x-BX)/(p.tx-BX+1))*Math.PI)*60*K*dt:0);}
 // mobs
 if(dun)stepDungeon(dt);
 else{if(!boss&&S.g%10===9&&!S.farm&&S.kills>=KILLS&&!mobs.some(m=>!m.dead))startBoss();
 if(!mobs.some(m=>!m.dead)&&!(S.g%10===9&&!S.farm&&S.kills>=KILLS))spawnWave();}
 if(boss){bossT-=dt;if(bossT<=0)bossFail();stepBoss(boss,dt);}
 for(let i=mobs.length-1;i>=0;i--){const m=mobs[i];m.hit=Math.max(0,m.hit-dt*6);
  if(m.dead){m.dt+=dt;if(m.dt>.35)mobs.splice(i,1);continue;}
  m.x+=m.kb*dt*8;m.kb*=Math.pow(.02,dt);
  if(m.frozen>0){m.frozen-=dt;continue;}
  const stop=m.ranged?BX+170*K:reachX(m),ahead=mobs.find(o=>o!==m&&!o.dead&&o.x<m.x&&m.x-o.x<(ART_W[o.arch]*o.size+ART_W[m.arch]*m.size)*K*.9&&!o.fly&&!m.fly);
  const moving=m.x>stop&&!ahead;if(moving){m.x-=(m.spd*K+spd)*dt;m.ph+=dt*8;}else if(bear.walk>.1)m.x-=spd*dt;
  m.y=m.fly?GY-(70+Math.sin(performance.now()/600+m.seed)*10)*K:GY;
  if(m.atk>=0){m.atk+=dt/.45;if(!m.done&&m.atk>=.5){m.done=true;if(m.ranged){shots.push({x:m.x-20*K,y:m.y-ART_H[m.arch]*.45*K*m.size,vx:-300*K,col:m.a,dmg:m.dmg});sfx('shot');}else if(!bear.dead)hurtBear(m.dmg,m);}if(m.atk>=1)m.atk=-1;}
  m.cd-=dt;if(!moving&&m.x<=stop+6*K&&m.cd<=0&&m.atk<0&&!bear.dead&&!m.cast){m.atk=0;m.done=false;m.cd=(m.tier===2?1.6:1.4)/(m.enraged||m.phase>1?1.4:1);}}
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;if(s.pet){if(petShotHit(s))shots.splice(i,1);continue;}if(s.x<BX+18*K){if(!bear.dead)hurtBear(s.dmg);sparks(s.x,s.y,6,s.col,200);shots.splice(i,1);}}
 stepSkills(dt);stepPet(dt);stepUlt(dt);
 stepFx(dt);
}

const bearWithSwing=(c,m)=>{const h=HERO();h.draw(c,m);h.swing(c,m);};
function shadow(x,w){fc.fillStyle='rgba(10,20,40,.28)';fc.beginPath();fc.ellipse(x,GY+2*K,w,w*.22,0,0,TAU);fc.fill();}
const stageEl=$('#stage');
function render(t){
 if(stageEl.clientWidth!==Math.round(W)||stageEl.clientHeight!==Math.round(H)){const oG=GY;resizeStage();for(const m of mobs)m.y+=GY-oG;}
 const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;
 $('#bg').style.transform=fg.style.transform=shake?`translate(${sx}px,${sy}px)`:'';
 bgStage.draw(t,scroll);
 fc.setTransform(DPR,0,0,DPR,0,0);fc.clearRect(0,0,W,H);
 for(const m of mobs)if(!m.dead)shadow(m.x,ART_W[m.arch]*K*m.size*(m.fly?.6:1));if(!bear.dead)shadow(BX,30*K);
 const sorted=mobs.slice().sort((a,b)=>b.x-a.x);
 for(const m of sorted){const dd=m.dead?m.dt/.35:0;const s=K*m.size*(1+dd*.3);
  drawEnt(fc,ART[m.arch],{t,ph:m.ph,atk:m.cast&&m.cast.t>.5?Math.min(.99,(m.cast.t-.5)/.6):m.atk,a:m.a,b:m.b,sub:m.sub,seed:m.seed,id:m.id,phase:m.phase},m.x,m.y,s,m.dead?1:m.hit,1-dd);
  if(!m.dead&&m.tier!==2&&m.hp<m.max){const w=44*K*m.size,y=m.y-(ART_H[m.arch]+14)*K*m.size;fc.fillStyle='rgba(10,15,30,.6)';rr(fc,m.x-w/2-1,y-1,w+2,7,3.5);fc.fill();fc.fillStyle=m.tier?'#ffb03a':'#ff5b6e';rr(fc,m.x-w/2,y,w*clamp(m.hp/m.max,0,1),5,2.5);fc.fill();}}
drawBossFx(fc,t);drawPet(fc,t);
 if(!bear.dead||Math.floor(t*10)%2)drawEnt(fc,bearWithSwing,{t,ph:bear.ph,walk:bear.walk,atk:bear.atk,kind:curWeapon().k},BX,GY,K*.95,bear.hit*.7,bear.dead?.5:1);
 fc.globalCompositeOperation='lighter';for(const s of shots){const g=fc.createRadialGradient(s.x,s.y,0,s.x,s.y,12*K);g.addColorStop(0,'#fff');g.addColorStop(.4,s.col);g.addColorStop(1,'rgba(0,0,0,0)');fc.fillStyle=g;fc.beginPath();fc.arc(s.x,s.y,12*K,0,TAU);fc.fill();}
 fc.globalCompositeOperation='source-over';
 for(const p of pshots)drawProj(fc,p,t);
 drawSkills(fc,t);
 drawUlt(fc,t);
 drawFx(fc,K);
 // bear hp bar
 const bw=60*K,by=GY+12*K;fc.fillStyle='rgba(10,15,30,.55)';rr(fc,BX-bw/2-1,by-1,bw+2,8,4);fc.fill();const hpk=clamp(bear.hp/MAXHP(),0,1);
 const hg=fc.createLinearGradient(BX-bw/2,0,BX+bw/2,0);hg.addColorStop(0,'#5fd35a');hg.addColorStop(1,'#c3ff79');fc.fillStyle=hpk<.3?'#ff5b6e':hg;rr(fc,BX-bw/2,by,bw*hpk,6,3);fc.fill();
 const uw=curWeapon();if(uw.ult){fc.fillStyle='rgba(10,15,30,.55)';rr(fc,BX-bw/2-1,by+8,bw+2,6,3);fc.fill();fc.fillStyle=ultG>=1?`hsl(${t*300%360},90%,65%)`:ULTS[uw.ult].col;rr(fc,BX-bw/2,by+9,bw*ultG,4,2);fc.fill();}
 // boss bar
 if(boss&&!boss.dead){const w=W*.7,x=(W-w)/2,y=Math.max(120,H*.3);fc.font=`${15*K}px Jal, sans-serif`;fc.textAlign='center';fc.lineWidth=4;fc.strokeStyle='#1a1028';fc.strokeText(boss.name,W/2,y-8);fc.fillStyle='#ffd0d6';fc.fillText(boss.name,W/2,y-8);
  fc.fillStyle='rgba(10,10,25,.7)';rr(fc,x-2,y-2,w+4,14,7);fc.fill();const bg2=fc.createLinearGradient(x,0,x+w,0);bg2.addColorStop(0,'#ff3d5a');bg2.addColorStop(1,'#ff9a6a');fc.fillStyle=bg2;rr(fc,x,y,w*clamp(boss.hp/boss.max,0,1),10,5);fc.fill();}
}

let tab='up';
function costN(u,n){let c=0,l=S.up[u.k];for(let i=0;i<n&&l<u.max;i++,l++)c+=u.cost(l);return c;}
function buyCount(u){if(S.mult)return Math.min(S.mult,u.max-S.up[u.k]);let n=0,c=0,l=S.up[u.k];while(l<u.max&&n<500){const nc=u.cost(l);if(c+nc>S.gold)break;c+=nc;l++;n++;}return Math.max(1,n);}
function renderPanel(){const L=$('#plist');$('#ptools').style.display=tab==='up'?'':'none';
 if(tab==='up'){L.innerHTML=UPS.map(u=>`<div class="row" data-k="${u.k}"><div class="ric">${ICON[u.k]}</div><div class="rinfo"><div class="rname">${u.n}<small>Lv.<span class="lv"></span></small></div><div class="rval"></div></div><button class="buy"><span class="bt"></span><small class="bc"></small></button></div>`).join('');
  L.querySelectorAll('.row').forEach(r=>holdBuy(r.querySelector('.buy'),UPS.find(u=>u.k===r.dataset.k)));}
 else if(tab!=='info')PANEL[tab](L);
 else{const h=Math.floor(S.stats.play/3600),mi=Math.floor(S.stats.play/60)%60;
  L.innerHTML=`<div class="info"><h3>백곰의 기록</h3><div class="grid2"><span>최고 스테이지 <b>${stageName(S.best)}</b></span><span>레벨 <b>${S.lv}</b></span><span>처치한 몬스터 <b>${fmt(S.stats.kills)}</b></span><span>쓰러뜨린 보스 <b>${fmt(S.stats.bosses)}</b></span><span>모은 골드 <b>${fmt(S.stats.gold)}</b></span><span>플레이 시간 <b>${h}시간 ${mi}분</b></span></div></div>
  <div class="info"><h3>현재 능력치</h3><div class="grid2"><span>공격력 <b>${fmt(ATK())}</b></span><span>체력 <b>${fmt(MAXHP())}</b></span><span>초당 회복 <b>${fmt(REGEN())}</b></span><span>치명타 <b>${stat('crit').toFixed(1)}%</b></span><span>치명타 피해 <b>${fmt(stat('critd'))}%</b></span><span>공격 속도 <b>x${stat('aspd').toFixed(2)}</b></span></div></div>
  <div class="info"><h3>여정</h3>북극의 빙하가 녹아 고향을 잃은 백곰. 오염된 땅을 지나 마계의 마왕을 쓰러뜨리고 고향을 되찾아야 해요. 12·15·18챕터에는 마왕군 간부, 20챕터에는 마왕이 기다려요.</div>`;}
 refreshPanel();}
function refreshPanel(){if(tab!=='up')return;
 for(const r of document.querySelectorAll('#plist .row')){const u=UPS.find(x=>x.k===r.dataset.k),l=S.up[u.k],max=l>=u.max,n=buyCount(u),c=costN(u,n);
  r.querySelector('.lv').textContent=l;r.querySelector('.rval').innerHTML=max?`${u.show(u.val(l))} · 최대`:`${u.show(u.val(l))} <i class="ar">→</i> <b>${u.show(u.val(l+n))}</b>`;
  const b=r.querySelector('.buy');b.classList.toggle('max',max);b.classList.toggle('no',!max&&S.gold<c);
  r.querySelector('.bt').textContent=max?'MAX':`+${n} 강화`;r.querySelector('.bc').textContent=max?'':fmt(c)+' 골드';}}
function buy(u){const n=buyCount(u),c=costN(u,n);if(S.up[u.k]>=u.max||S.gold<c)return false;S.gold-=c;const hpK=bear.hp/MAXHP();S.up[u.k]+=n;track('up',n);if(u.k==='hp')bear.hp=hpK*MAXHP();sfx('buy');updateHud();return true;}
function holdBuy(btn,u){let tm=null,rep=0;const go=()=>{if(!buy(u)){stop();return;}rep++;tm=setTimeout(go,Math.max(45,220-rep*25));};const stop=()=>{clearTimeout(tm);tm=null;rep=0;save();};
 btn.addEventListener('pointerdown',e=>{e.preventDefault();if(!buy(u))return;tm=setTimeout(go,380);});['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>tm&&stop()));}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));renderPanel();});
document.querySelectorAll('#mult button').forEach(b=>{b.classList.toggle('on',+b.dataset.m===S.mult);b.onclick=()=>{S.mult=+b.dataset.m;document.querySelectorAll('#mult button').forEach(x=>x.classList.toggle('on',x===b));refreshPanel();save();};});
/* modal */
function modal(title,text,btns,wide){$('#mbox').classList.toggle('wide',!!wide);$('#mtitle').textContent=title;$('#mtext').innerHTML=text;const B=$('#mbtns');B.innerHTML='';
 for(const[label,fn,ok]of btns){const b=document.createElement('button');b.textContent=label;if(ok)b.className='ok';b.onclick=()=>{$('#modal').hidden=true;fn&&fn();};B.appendChild(b);}$('#modal').hidden=false;}
$('#setbtn').onclick=()=>modal('설정',`소리: <b>${S.snd?'켜짐':'꺼짐'}</b>`,[[S.snd?'소리 끄기':'소리 켜기',()=>{S.snd=!S.snd;save();}],['이름 바꾸기',()=>askName()],['처음부터',()=>modal('정말 처음부터?','모든 진행 상황이 지워져요.',[['취소'],['지우기',resetSave,1]])],['닫기',null,1]]);
/* lobby */
const bgLobby=new BG($('#lbg')),lfg=$('#lfg'),lc=lfg.getContext('2d');let screen='lobby';
bgLobby.theme(LOBBY_THEME);bgLobby.ground=.16;bgLobby.horizon=.36;
function lobbyText(){$('#lsub').textContent=S.started?`이어하기 · ${stageName(S.g)} ${theme().name}`:'처음 시작하는 모험';$('#startbtn').textContent=S.started?'이어하기':'모험 시작';}
function drawLobby(t){const r=$('#lobby').getBoundingClientRect();if(!r.width)return;const w=r.width,h=r.height,q=Math.min(DPR,1.5);
 if(lfg.width!==Math.round(w*DPR)||lfg.height!==Math.round(h*DPR)){lfg.width=w*DPR;lfg.height=h*DPR;bgLobby.resize(Math.round(w*q),Math.round(h*q));}
 bgLobby.draw(t,t*.01);lc.setTransform(DPR,0,0,DPR,0,0);lc.clearRect(0,0,w,h);
 const s=Math.min(w/380,h/700)*1.25,gy=Math.min(h*(1-bgLobby.ground)-h*.02,$('#lsub').getBoundingClientRect().top-r.top-30*s),bx=w*.5,bob=Math.sin(t*1.2)*3;
 lc.save();lc.translate(bx,gy+bob);lc.beginPath();lc.ellipse(0,6*s,90*s,16*s,0,0,TAU);const ig=lc.createLinearGradient(0,-10*s,0,22*s);ig.addColorStop(0,'#ffffff');ig.addColorStop(1,'#9cc8ea');lc.fillStyle=ig;lc.fill();
 lc.strokeStyle='rgba(255,255,255,.6)';lc.lineWidth=2;lc.stroke();lc.scale(s,s);HERO().draw(lc,{t,ph:0,walk:0,atk:-1,kind:curWeapon().k});lc.restore();
 lc.strokeStyle='rgba(255,255,255,.35)';lc.lineWidth=1.5;for(let i=0;i<3;i++){const k=(t*.4+i/3)%1;lc.globalAlpha=1-k;lc.beginPath();lc.ellipse(bx,gy+bob+8*s,(90+k*60)*s,(16+k*10)*s,0,0,TAU);lc.stroke();}lc.globalAlpha=1;}
function beginGame(){renderSkillbar();screen='game';if(!S.started){S.started=true;banner(theme().name,'#9fdcff');toast(`${S.name}(이)가 잃어버린 고향을 찾아 떠나요!`);save();}resizeStage();measureHud();updateHud();}
$('#startbtn').onclick=()=>{audioInit();$('#lobby').hidden=true;if(S.started){beginGame();return;}screen='pro';startPrologue(()=>askName(beginGame));};
$('#backarc').onclick=()=>{save();location.href='../';};
function offlineReward(){if(!S.started||!S.t)return;const sec=Math.min(8*3600,(Date.now()-S.t)/1000);if(sec<60)return;
 const gold=Math.floor(mobGold(S.g)*.5*sec*.6),exp=mobExp(S.g)*.5*sec*.3;S.gold+=gold;gainExp(exp);save();
 const h=Math.floor(sec/3600),m=Math.floor(sec/60)%60;modal('자리 비운 사이',`${h?h+'시간 ':''}${m}분 동안 ${S.name||'백곰'}(이)가 사냥하다 잠들었어요.<br><b style="color:#d48a10">+${fmt(gold)} 골드</b>`,[['받기',null,1]]);$('#mtext').prepend(sleepCanvas());}

/* ---------- gear / skills / pets / gacha panels ---------- */
const SKICON={glacier:'<svg viewBox="0 0 32 32"><path d="M16 2v28M4 9l24 14M4 23L28 9" stroke="#bff4ff" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="4" fill="#fff"/></svg>',
 tornado:'<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h24M7 12h18M10 18h12M13 24h6M15 29h2"/></svg>',
 beam:'<svg viewBox="0 0 32 32"><defs><linearGradient id="bm" x1="0" x2="1"><stop offset="0" stop-color="#7affd8"/><stop offset="1" stop-color="#a88aff"/></linearGradient></defs><path d="M3 12h26v8H3z" fill="url(#bm)"/><path d="M3 15h26v2H3z" fill="#fff"/><circle cx="5" cy="16" r="5" fill="#fff"/></svg>'};
const gbox=(img,g,extra='',attr='',st='')=>`<div class="ibox" ${attr} style="--gc:${GCOL[g]};${st}"><img src="${img}" alt=""><span class="gb">${GRADES[g]}</span>${extra}</div>`;
function renderSkillbar(){$('#skillbar').innerHTML=Object.keys(SKILLS).map(k=>`<button class="sk" data-k="${k}" aria-label="${SKILLS[k].n}">${SKICON[k]}<i></i><b></b></button>`).join('')+`<button id="sauto">AUTO</button>`;
 document.querySelectorAll('.sk').forEach(b=>b.onclick=()=>{if(!castSkill(b.dataset.k)&&!skOpen(b.dataset.k))toast(`${stageName(SKILLS[b.dataset.k].unlock)} 도달 시 열려요`);});
 $('#sauto').onclick=()=>{S.sauto=!S.sauto;save();updateSkillbar();};updateSkillbar();}
function updateSkillbar(){for(const b of document.querySelectorAll('.sk')){const k=b.dataset.k,open=skOpen(k);b.classList.toggle('lock',!open);
  b.querySelector('i').style.setProperty('--p',(open?skCd[k]/SKILLS[k].cd*100:100)+'%');b.querySelector('b').textContent=open&&skCd[k]>0?Math.ceil(skCd[k]):'';}
 const a=$('#sauto');if(a)a.classList.toggle('on',!!S.sauto);}
function eqCard(k,s){if(!k)return`<div class="info" style="padding:10px 14px">빈 칸 · 뽑기에서 얻을 수 있어요</div>`;const[id,g]=gsplit(k),it=ITEMS[id],m=slotMul(k);
 const eff=s==='w'?`${KIND[it.k].n} · 공격력 x${m<100?m.toFixed(1):fmt(m)}`:s==='a'?`체력 +${fmt(m*50)}%`:`체력 +${fmt(m*25)}% · 외형 변경`;
 return`<div class="eqcard" data-item="${k}">${gbox(itemIcon(id),g)}<div class="rinfo"><div class="rname">${it.n}<small>+${S.inv[k].lv}</small></div><div class="rval">${eff}</div>${it.ult?`<div class="rval" style="color:#9a3ad8">필살기 · ${ULTS[it.ult].n}</div>`:''}</div><button class="btn2" data-item="${k}">관리</button></div>`;}
function eqSection(s,title){const sl=SLOTS[s],eq=sl.map(x=>S.eq[x]),own=Object.keys(S.inv).filter(x=>ITEMS[gsplit(x)[0]].s===s).sort((x,y)=>gsplit(y)[1]-gsplit(x)[1]||ITEMS[gsplit(x)[0]].n.localeCompare(ITEMS[gsplit(y)[0]].n));
 return `<div class="sec">${title}</div>${eq.map(k=>eqCard(k,s)).join('')}<div class="igrid">${own.map(x=>{const[id,g]=gsplit(x);return gbox(itemIcon(id),g,`<span class="cnt">x${S.inv[x].n}</span>${canMerge(x)?'<span class="new" style="background:#2fb84a">합성</span>':''}`,`data-item="${x}"`).replace('class="ibox"',eq.includes(x)?'class="ibox on"':'class="ibox"');}).join('')}</div>`;}
function itemPopup(k){const[id,g]=gsplit(k),it=ITEMS[id],o=S.inv[k];if(!o)return;const c=enhCost(g,o.lv),eq=SLOTS[it.s].some(x=>S.eq[x]===k);
 const info=`<div style="display:flex;gap:12px;align-items:center;text-align:left">${gbox(itemIcon(id),g)}<div><b style="color:${shade(GCOL[g],-.35)}">${GRADES[g]}등급</b> · 보유 ${o.n}개 · +${o.lv}<br>${it.s==='w'?KIND[it.k].n+' 무기':it.s==='a'?'장신구 (체력)':'코스튬 (체력 · 외형)'}${it.ult?`<br><span style="color:#9a3ad8">필살기 · ${ULTS[it.ult].n}</span>`:''}</div></div>
  <p style="margin-top:10px;font-size:12px">같은 장비 ${MERGE_N}개를 합성하면 <b>${it.n} ${GRADES[Math.min(6,g+1)]}등급</b> 1개가 돼요.</p>`;
 const btns=[];if(!eq)btns.push(['장착',()=>{const hp=bear.hp/MAXHP();equipItem(k);bear.hp=hp*MAXHP();save();renderPanel();},1]);
 else if(it.s!=='w')btns.push(['해제',()=>{for(const x of SLOTS[it.s])if(S.eq[x]===k)S.eq[x]=null;bear.hp=Math.min(bear.hp,MAXHP());save();renderPanel();}]);
 btns.push([`강화 ${fmt(c)}`,()=>{if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;o.lv++;track('enh');sfx('level');save();updateHud();renderPanel();itemPopup(k);}]);
 if(S.stone>0)btns.push([`강화석 1개로 강화`,()=>{S.stone--;o.lv++;track('enh');sfx('level');save();renderPanel();itemPopup(k);}]);
 if(canMerge(k))btns.push(['합성',()=>{const nk=merge(k);track('merge');sfx('clear');banner(`${GRADES[g+1]}등급 ${it.n}!`,GCOL[g+1]);save();updateHud();renderPanel();itemPopup(nk);},1]);
 btns.push(['닫기']);modal(it.n,info,btns);}
const PANEL={
 gear(L){const mc=Object.keys(S.inv).filter(canMerge).length;L.innerHTML=(mc?`<button class="btn2" id="mergeall" style="width:100%">모두 합성 (${mc}종)</button>`:'')+eqSection('w','무기')+eqSection('a','장신구 (2칸)')+eqSection('c','코스튬');
  L.querySelectorAll('[data-item]').forEach(e=>e.onclick=()=>itemPopup(e.dataset.item));
  const ma=$('#mergeall');if(ma)ma.onclick=()=>{const n=mergeAll();track('merge',n);sfx('clear');toast(`${n}번 합성했어요!`);updateHud();renderPanel();};},
 skill(L){L.innerHTML=Object.keys(SKILLS).map(k=>{const sk=SKILLS[k],open=skOpen(k),c=skCost(k);return `<div class="row"><div class="ric" style="background:linear-gradient(145deg,#2a3a5e,#141e36)">${SKICON[k]}</div>
  <div class="rinfo"><div class="rname">${sk.n}<small>${open?'Lv.'+skLv(k):'잠김'}</small></div><div class="rval">${open?`피해 ${fmt(skDmg(k))} · 재사용 ${sk.cd}초`:`${stageName(sk.unlock)} 도달 시 열려요`}</div><div class="rval">${sk.d}</div></div>
  ${open?`<button class="buy${S.gold<c?' no':''}" data-sk="${k}"><span>레벨업</span><small>${fmt(c)} 골드</small></button>`:''}</div>`;}).join('');
  L.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const k=b.dataset.sk,c=skCost(k);if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;S.skl[k]=skLv(k)+1;sfx('level');save();updateHud();renderPanel();});},
 pet(L){const own=Object.keys(S.pets).sort((x,y)=>gsplit(y)[1]-gsplit(x)[1]);if(!own.length){L.innerHTML='<div class="info"><h3>아직 펫이 없어요</h3>뽑기에서 12종의 펫을 만날 수 있어요. 함께하는 펫 1마리가 백곰과 같이 싸우고 능력치 보너스를 줘요.</div>';return;}
  const mc=own.filter(canMergePet).length;
  L.innerHTML=(mc?`<button class="btn2" id="pmergeall" style="width:100%">모두 합성 (${mc}종)</button>`:'')+own.map(k=>{const[id,g]=gsplit(k),P=PETS[id],o=S.pets[k];return `<div class="row" data-pk="${k}" style="cursor:pointer">${gbox(itemIcon(id,1),g,`<span class="cnt">x${o.n}</span>${canMergePet(k)?'<span class="new" style="background:#2fb84a">합성</span>':''}`)}
  <div class="rinfo"><div class="rname">${P.n}<small>${P.an} · +${o.lv}</small></div><div class="rval">${P.at} · 공격력의 <b>${Math.round(petMul(k)*100)}%</b></div><div class="rval">${PB_N[P.bk]} +${Math.round(petBonusOf(k)*10)/10}${P.bk==='crit'?'%p':'%'}${g>=3?' · <b style="color:#b07a00">펫 스킬</b>':''}</div></div>
  ${S.pet===k?'<span class="btn2" style="height:30px;line-height:30px;font-size:11px;background:#8a96b8;box-shadow:none">함께</span>':''}</div>`;}).join('');
  L.querySelectorAll('[data-pk]').forEach(e=>e.onclick=()=>petPopup(e.dataset.pk));
  const ma=$('#pmergeall');if(ma)ma.onclick=()=>{let n=0;for(let p=0;p<7;p++)for(const k of Object.keys(S.pets))while(canMergePet(k)){mergePet(k);n++;}sfx('clear');toast(`${n}번 합성했어요!`);renderPanel();};},
 gacha(L){const tot=GACHAW.reduce((a,b)=>a+b,0);L.innerHTML=`<div class="gacha"><h3>북극 보물 뽑기</h3><p>무기 · 장신구 · 코스튬 · 펫이 나와요. 더 좋은 장비는 자동으로 장착돼요.</p>
  <div class="row2"><button data-n="1">1회<br><small>보석 100</small></button><button data-n="10">10회<br><small>보석 900</small></button></div>
  <div class="odds">${GRADES.map((g,i)=>`<span style="color:${GCOL[i]}"><b>${g}</b> ${(GACHAW[i]/tot*100).toFixed(GACHAW[i]/tot<.01?2:1)}%</span>`).join('')}</div></div>
  <div class="info">보석은 스테이지 클리어(+3), 레벨 업(+10), 보스 처치(+30)로 모을 수 있어요.</div>`;
  L.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const r=gacha(+b.dataset.n);if(!r){toast('보석이 부족해요');return;}track('gacha',r.length);sfx('clear');updateHud();
   modal(`뽑기 결과`,`<div class="res">${r.map((x,i)=>{const g=x.g;return gbox(itemIcon(x.id,x.pet),g,x.isNew?'<span class="new">NEW</span>':'','',`animation-delay:${i*.08}s`);}).join('')}</div>`,[['확인',()=>renderPanel(),1]],1);});},
};

function petPopup(k){const[id,g]=gsplit(k),P=PETS[id],o=S.pets[k];if(!o)return;const c=enhCost(g,o.lv);
 const info=`<div style="display:flex;gap:12px;align-items:center;text-align:left">${gbox(itemIcon(id,1),g)}<div><b style="color:${shade(GCOL[g],-.35)}">${GRADES[g]}등급 ${P.an}</b><br>보유 ${o.n}마리 · +${o.lv}<br>${P.at} (${P.cd}초마다)</div></div>
  <p style="margin-top:10px;font-size:12px">같은 펫 ${MERGE_N}마리를 합성하면 <b>${P.n} ${GRADES[Math.min(6,g+1)]}등급</b>이 돼요.${g<3?' S등급부터 5번째 공격마다 펫 스킬이 나가요.':''}</p>`;
 const btns=[];if(S.pet!==k)btns.push(['함께하기',()=>{const hp=bear.hp/MAXHP();S.pet=k;pet.x=0;bear.hp=hp*MAXHP();save();renderPanel();},1]);
 btns.push([`강화 ${fmt(c)}`,()=>{if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;o.lv++;track('enh');sfx('level');save();updateHud();renderPanel();petPopup(k);}]);
 if(S.stone>0)btns.push([`강화석 1개로 강화`,()=>{S.stone--;o.lv++;track('enh');sfx('level');save();renderPanel();petPopup(k);}]);
 if(canMergePet(k))btns.push(['합성',()=>{const nk=mergePet(k);track('merge');sfx('clear');banner(`${GRADES[g+1]}등급 ${P.n}!`,GCOL[g+1]);renderPanel();petPopup(nk);},1]);
 btns.push(['닫기']);modal(`${P.n}`,info,btns);}

/* ---------- boot + main loop ---------- */
resizeStage();measureHud();addEventListener('resize',()=>{resizeStage();measureHud();});
bear.hp=MAXHP();applyTheme();questDot();lobbyText();renderPanel();updateHud();offlineReward();
let last=performance.now(),saveT=10,hudT=0;
function frame(now){requestAnimationFrame(frame);const raw=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
 if(screen==='lobby'){drawLobby(t);return;}
 if(screen==='pro'){drawPrologue(t,raw);return;}
 let dt=Math.min(raw,1/20);if(hitstop>0){hitstop-=dt;dt*=.08;}shake=Math.max(0,shake-raw*30);
 step(dt);render(t);
 hudT-=raw;if(hudT<0){hudT=.25;updateHud();}
 saveT-=raw;if(saveT<0){saveT=10;save();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
requestAnimationFrame(frame);

</script>
</body>
</html>
