<title>잃어버린 고향을 찾아서</title>
<style>
:root{--ink:#16233f;--ink2:#4a5a7c;--paper:#f6f9ff;--glass:rgba(255,255,255,.12);--glass-b:rgba(255,255,255,.28);
 --gold:#ffcf3d;--gem:#7fe3ff;--hp:#ff5b6e;--exp:#8ae86a;--accent:#3d8bff;--accent2:#6b5bff;
 --f-title:"Jal","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-body:"Ssr","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0b1630;color:#fff;font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(120% 80% at 50% 0%,#1d3f7a 0%,#0b1630 60%,#060c1c 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
/* stage */
#stage{position:relative;flex:0 0 auto;height:min(56vh,560px);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* hud */
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 10px 0;display:flex;flex-direction:column;gap:7px;pointer-events:none;z-index:5}
.hrow{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:rgba(10,20,45,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--f-title);font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.pill i{width:20px;height:20px;display:block;flex:none}
#lvbox{flex:1;min-width:0;padding-left:5px}
#lvtxt{flex:none}
.bar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;min-width:30px}
.bar b{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#5fd35a,#c3ff79);box-shadow:0 0 8px rgba(160,255,120,.6);transition:width .25s}
#stagebox{justify-content:center;flex-direction:column;align-items:center;height:auto;padding:5px 16px 6px;border-radius:16px;gap:3px}
#stname{font-size:15px;letter-spacing:.5px}
#stsub{font-family:var(--f-body);font-size:11px;opacity:.85}
#killbar{width:150px;height:6px}
#killbar b{background:linear-gradient(90deg,#ffb93d,#ffe680);box-shadow:0 0 8px rgba(255,200,80,.6)}
#bossbtn{pointer-events:auto;font-family:var(--f-title);font-size:13px;padding:7px 14px;border-radius:999px;background:linear-gradient(#ff6a7d,#e2364f);box-shadow:0 3px 0 #9c1d33,0 0 18px rgba(255,80,100,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#bosstimer{width:170px;height:7px}#bosstimer b{background:linear-gradient(90deg,#ff3d5a,#ff9a6a)}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--f-title);font-size:34px;letter-spacing:1px;pointer-events:none;z-index:6;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px currentColor}
#banner.show{animation:ban 1.8s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(8,16,36,.8);border:1px solid rgba(255,255,255,.2);font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s;z-index:7;pointer-events:none}
#toast.show{opacity:1}
/* panel */
#panel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#e9f1ff,#dbe7fb);color:var(--ink);border-radius:22px 22px 0 0;margin-top:-18px;z-index:8;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
#tabs{display:flex;gap:6px;padding:10px 12px 6px}
.tab{flex:1;height:38px;border-radius:12px;font-family:var(--f-title);font-size:14px;color:var(--ink2);background:#cfdcf3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.tab.on{color:#fff;background:linear-gradient(#4f9bff,#2f6fe0);box-shadow:0 3px 0 #1f4fa8,0 6px 14px rgba(47,111,224,.35)}
#ptools{display:flex;align-items:center;gap:6px;padding:2px 14px 6px;font-size:12px;color:var(--ink2)}
#ptools .sp{flex:1}
.seg{display:flex;background:#cfdcf3;border-radius:10px;padding:2px}
.seg button{padding:5px 10px;border-radius:8px;font-family:var(--f-title);font-size:12px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#plist{flex:1;overflow-y:auto;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:16px;background:#fff;box-shadow:0 2px 0 rgba(30,60,120,.08),0 4px 14px rgba(30,60,120,.06)}
.ric{width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#eef4ff,#d6e3fb)}
.ric svg{width:32px;height:32px}
.rinfo{flex:1;min-width:0}
.rname{font-family:var(--f-title);font-size:15px;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname small{font-family:var(--f-body);font-size:11px;color:var(--ink2)}
.rval{font-size:12px;color:var(--ink2);margin-top:3px}.rval b{color:#2a8a3a}.ar{font:normal 12px system-ui,sans-serif}
.buy{flex:none;min-width:84px;height:46px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--f-title);font-size:13px;color:#5a3a00;background:linear-gradient(#ffe06a,#ffc22e);box-shadow:0 3px 0 #d39a12}
.buy small{font-family:var(--f-body);font-size:10px;opacity:.75}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #d39a12}
.buy.no{filter:grayscale(.9);opacity:.55}
.buy.max{background:#cfd8e8;box-shadow:0 3px 0 #a9b4c8;color:#56627a}
.info{padding:14px;border-radius:16px;background:#fff;font-size:13px;line-height:1.7;color:var(--ink2)}
.info h3{font-family:var(--f-title);font-size:16px;color:var(--ink);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.grid2 b{color:var(--ink);float:right}
/* lobby + modal */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center}
#lobby canvas{position:absolute;inset:0;width:100%;height:100%}
#ltitle{position:relative;margin-top:max(9vh,40px);text-align:center;font-family:var(--f-title);line-height:1.02;filter:drop-shadow(0 6px 0 rgba(10,20,60,.45)) drop-shadow(0 0 28px rgba(140,200,255,.55))}
#ltitle .t1{font-size:clamp(28px,8.5vw,40px);color:#eaf6ff}
#ltitle .t2{font-size:clamp(54px,17vw,82px);background:linear-gradient(#ffffff 10%,#9fdcff 55%,#5aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.25)}
#ltitle .t3{margin-top:10px;display:inline-block;font-size:12px;letter-spacing:3px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#dff1ff}
#lbtns{position:absolute;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 24px}
#lsub{font-size:13px;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.big{width:100%;max-width:340px;height:62px;border-radius:20px;font-family:var(--f-title);font-size:24px;color:#4a2c00;background:linear-gradient(#ffe57a,#ffbf2a);box-shadow:0 5px 0 #c88a0e,0 12px 30px rgba(255,190,40,.45);letter-spacing:1px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c88a0e}
.ghost{padding:8px 16px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
#modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,10,25,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:24px}
#mbox{width:100%;max-width:340px;padding:20px 18px 16px;border-radius:22px;background:linear-gradient(#f4f8ff,#dfe9fb);color:var(--ink);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#mbox h2{font-family:var(--f-title);font-size:22px;margin-bottom:8px}
#mbox p{font-size:14px;line-height:1.6;color:var(--ink2)}
#mbtns{display:flex;gap:8px;margin-top:16px}
#mbtns button{flex:1;height:46px;border-radius:14px;font-family:var(--f-title);font-size:16px;background:#cfdcf3;color:var(--ink2)}
#mbtns button.ok{background:linear-gradient(#4f9bff,#2f6fe0);color:#fff;box-shadow:0 3px 0 #1f4fa8}
.tab{font-size:13px;padding:0 2px}
#skillbar{position:absolute;left:10px;bottom:26px;z-index:6;display:flex;gap:7px;align-items:flex-end}
.sk{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(10,20,45,.6);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 12px rgba(120,220,255,.35)}
.sk svg{width:28px;height:28px;position:relative;z-index:1}.sk i{position:absolute;inset:0;background:conic-gradient(rgba(5,10,25,.72) var(--p,0%),transparent 0);z-index:2}
.sk.lock{opacity:.35}.sk b{position:absolute;z-index:3;font:13px var(--f-title);text-shadow:0 1px 2px #000}
#sauto{height:24px;padding:0 9px;border-radius:999px;font:11px var(--f-title);background:rgba(10,20,45,.6);border:1px solid rgba(255,255,255,.35)}#sauto.on{background:linear-gradient(#5ad0ff,#2f8ae0);border-color:#aee8ff}
.sec{font-family:var(--f-title);font-size:14px;margin:4px 2px 0;color:var(--ink)}
.eqcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff;box-shadow:0 4px 14px rgba(30,60,120,.08)}
.ibox{width:64px;height:64px;flex:none;border-radius:14px;background:linear-gradient(145deg,#2a3a5e,#141e36);border:2.5px solid var(--gc,#b8c2d0);box-shadow:0 0 12px var(--gc,transparent);position:relative}
.ibox img{width:100%;height:100%;display:block}.ibox .gb{position:absolute;left:-3px;top:-3px;padding:1px 5px;border-radius:7px;font:11px var(--f-title);color:#14182a;background:var(--gc)}
.ibox .cnt{position:absolute;right:3px;bottom:1px;font:11px var(--f-title);color:#fff;text-shadow:0 1px 2px #000}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;padding:2px}
.igrid .ibox{width:auto;height:auto;aspect-ratio:1;cursor:pointer}.igrid .ibox.on{outline:3px solid #3d8bff;outline-offset:2px}
.btn2{height:40px;padding:0 14px;border-radius:12px;font:14px var(--f-title);color:#fff;background:linear-gradient(#4f9bff,#2f6fe0);box-shadow:0 3px 0 #1f4fa8}.btn2.no{filter:grayscale(.9);opacity:.5}
.gacha{padding:16px;border-radius:18px;text-align:center;color:#fff;background:radial-gradient(120% 90% at 50% 0%,#4a3a9a,#1a1440);box-shadow:0 6px 20px rgba(40,20,90,.35)}
.gacha h3{font:22px var(--f-title);margin-bottom:4px}.gacha p{font-size:12px;opacity:.85}.gacha .row2{display:flex;gap:8px;margin-top:14px}.gacha .row2 button{flex:1;height:54px;border-radius:14px;font:16px var(--f-title);color:#4a2c00;background:linear-gradient(#ffe57a,#ffbf2a);box-shadow:0 4px 0 #c88a0e}
.odds{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;margin-top:12px;font-size:11px}.odds span b{font-family:var(--f-title)}
#mbox.wide{max-width:420px}.res{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:6px}
.res .ibox{width:auto;height:auto;aspect-ratio:1;animation:flip .45s backwards}.res .ibox .new{position:absolute;right:-3px;top:-4px;padding:0 4px;border-radius:6px;background:#ff4a6a;color:#fff;font:9px var(--f-title)}
@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:0}}
#setbtn{position:absolute;right:10px;bottom:28px;z-index:6;width:34px;height:34px;border-radius:12px;background:rgba(10,20,45,.55);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
#setbtn svg{width:20px;height:20px}
</style>
</head>

const gkey=(id,g)=>id+'#'+g, gsplit=k=>{const i=k.lastIndexOf('#');return[k.slice(0,i),+k.slice(i+1)];};
// older saves stored plain ids
for(const k of Object.keys(S.inv))if(!k.includes('#')){const v=S.inv[k];delete S.inv[k];if(ITEMS[k])S.inv[gkey(k,ITEMS[k].g)]=v;}
for(const s of['w','a'])if(S.eq[s]&&!S.eq[s].includes('#'))S.eq[s]=ITEMS[S.eq[s]]?gkey(S.eq[s],ITEMS[S.eq[s]].g):null;
if(!S.eq.w||!S.inv[S.eq.w]){S.inv[gkey('plank',0)]=S.inv[gkey('plank',0)]||{n:1,lv:0};S.eq.w=gkey('plank',0);}
const enhMul=lv=>1+.15*lv, enhCost=(g,lv)=>Math.floor(200*Math.pow(2.2,g)*Math.pow(1.35,lv));
function gearMul(slot){const k=S.eq[slot];if(!k||!S.inv[k])return 1;const[,g]=gsplit(k);return GMUL[g]*enhMul(S.inv[k].lv||0)*(slot==='a'?.6:1)+(slot==='a'?.4:0);}
function curWeapon(){const[id,g]=gsplit(S.eq.w||'plank#0');return Object.assign({id,kind:KIND[ITEMS[id].k]},ITEMS[id],{g});}
function rollGrade(){let r=Math.random()*GACHAW.reduce((a,b)=>a+b,0);for(let g=0;g<GACHAW.length;g++){r-=GACHAW[g];if(r<=0)return g;}return 0;}
function addItem(id,g){const k=gkey(id,g),own=S.inv[k];S.inv[k]={n:(own?.n||0)+1,lv:own?.lv||0};const s=ITEMS[id].s,cur=S.eq[s];if(!cur||gsplit(cur)[1]<g)S.eq[s]=k;return!own;}
function gacha(n){const cost=n>=10?900:100;if(S.gem<cost)return null;S.gem-=cost;const out=[];
 for(let i=0;i<n;i++){const g=rollGrade();
  if(Math.random()<.12){const pg=Math.min(g,4),pool=Object.keys(PETS).filter(k=>PETS[k].g===pg);const id=pick(pool.length?pool:Object.keys(PETS).filter(k=>PETS[k].g===0));out.push({pet:1,id,g:PETS[id].g,isNew:addPet(id,PETS[id].g)});continue;}
  const id=pick(Object.keys(ITEMS).filter(k=>ITEMS[k].g===g));out.push({id,g,isNew:addItem(id,g)});}
 save();return out;}
// merge: 3 of the same item+grade -> 1 of the same item, next grade
function canMerge(k){const[,g]=gsplit(k),o=S.inv[k];return o&&g<6&&o.n>=MERGE_N;}
function merge(k){if(!canMerge(k))return false;const[id,g]=gsplit(k);S.inv[k].n-=MERGE_N;if(S.inv[k].n<=0){delete S.inv[k];for(const s of['w','a'])if(S.eq[s]===k)S.eq[s]=null;}
 addItem(id,g+1);if(!S.eq.w)S.eq.w=gkey(id,g+1);return gkey(id,g+1);}
function mergeAll(){let n=0;for(let pass=0;pass<7;pass++)for(const k of Object.keys(S.inv))while(canMerge(k)){merge(k);n++;}save();return n;}

const PB_N={hp:'체력',gold:'골드 획득',atk:'공격력',crit:'치명타 확률',regen:'체력 회복',def:'받는 피해 감소',thorn:'피해 반사',critd:'치명타 피해',aspd:'공격 속도'};
for(const k of Object.keys(S.pets))if(!k.includes('#'))delete S.pets[k];
if(S.pet&&!S.pets[S.pet])S.pet=null;
function addPet(id,g){const k=gkey(id,g),own=S.pets[k];S.pets[k]={n:(own?.n||0)+1,lv:own?.lv||0};if(!S.pet||gsplit(S.pet)[1]<g)S.pet=k;return!own;}
const canMergePet=k=>{const[,g]=gsplit(k),o=S.pets[k];return o&&g<6&&o.n>=MERGE_N;};
function mergePet(k){if(!canMergePet(k))return null;const[id,g]=gsplit(k);S.pets[k].n-=MERGE_N;if(S.pets[k].n<=0){delete S.pets[k];if(S.pet===k)S.pet=null;}addPet(id,g+1);save();return gkey(id,g+1);}
function petMul(k){const[id,g]=gsplit(k);return PETS[id].mul*GMUL[g]*.6*enhMul(S.pets[k]?.lv||0);}
function petBonusOf(k){const[id,g]=gsplit(k),P=PETS[id];return P.bv*(1+.5*(g-P.g))*enhMul(S.pets[k]?.lv||0);}
// passive bonus of the equipped pet (percent, or +points for crit)
function PB(stat){if(!S.pet||!S.pets[S.pet])return 0;const[id]=gsplit(S.pet);return PETS[id].bk===stat?petBonusOf(S.pet):0;}

function stepPet(dt){if(!S.pet||!S.pets[S.pet])return;const[id,g]=gsplit(S.pet),P=PETS[id],home=BX-52*K,tg=front();pet.ph+=dt*9*Math.max(bear.walk,.2);
 if(!pet.x)pet.x=home;pet.cd-=dt;const air=P.fly?GY-(85+Math.sin(performance.now()/500)*6)*K:GY;
 for(let i=pet.fx.length-1;i>=0;i--){const f=pet.fx[i];f.t+=dt;if(f.kind==='wave'){f.x+=380*K*dt;for(const m of mobs)if(!m.dead&&!f.hit.has(m)&&Math.abs(m.x-f.x)<20*K){f.hit.add(m);petHit(m,f.mul,P.col);}if(f.x>W+40)pet.fx.splice(i,1);}else if(f.t>.6)pet.fx.splice(i,1);}
 if(pet.mode==='idle'){pet.x=lerp(pet.x,home,dt*4);pet.y=air;
  if(pet.cd<=0&&tg&&tg.x<W*.95&&!bear.dead){pet.cd=P.cd;pet.t=0;pet.n++;const sk=g>=3&&pet.n%5===0,mul=sk?3:1;pet.sk=sk;if(sk)num(pet.x,pet.y-60*K,'★'+P.at,'gold');

   else if(P.kind==='stun'){pet.fx.push({kind:'ring',t:0});for(const m of mobs)if(!m.dead&&m.x<W){m.frozen=Math.max(m.frozen||0,sk?2:.9);petHit(m,mul,P.col);}sfx('hurt');}

   else if(P.kind==='pierce'){pet.mode='slide';pet.hits=new Set();pet.mul=mul;}

 else if(pet.mode==='slide'){pet.t+=dt;pet.x+=520*K*dt;pet.y=P.fly?air:GY;for(const m of mobs)if(!m.dead&&!pet.hits.has(m)&&Math.abs(m.x-pet.x)<22*K){pet.hits.add(m);petHit(m,pet.mul,P.col);}
  if(pet.x>W+40){pet.mode='idle';pet.x=-30*K;}}
 else{pet.t+=dt;const k=pet.mode==='go'?Math.min(1,pet.t/.35):1-Math.min(1,pet.t/.4);
  pet.x=lerp(home,pet.tx-24*K,k);pet.y=P.fly?lerp(air,GY-30*K,k):GY-Math.sin(k*Math.PI)*14*K*(pet.mode==='go'?1:0);

/* ---------- S급 이상 무기 필살기 (10종) ----------
 Every hit fills the gauge; when full the weapon's ult fires automatically. Each tick hits every monster on screen. */
const ULTS={

};
const ULT_HITS=12;let ultG=0,ultFx=null;
function ultCharge(){const w=curWeapon();if(!w.ult||ultFx)return;ultG=Math.min(1,ultG+1/ULT_HITS);}
function stepUlt(dt){const w=curWeapon();
 if(!ultFx&&w.ult&&ultG>=1&&!bear.dead&&mobs.some(m=>!m.dead&&m.x<W)){const U=ULTS[w.ult];ultG=0;ultFx={k:w.ult,t:0,i:0,g:w.g};banner(U.n,U.col);sfx('boss');hitstop=.12;shake=8;
  if(w.ult==='zero')for(const m of mobs)if(!m.dead)m.frozen=1.5;}
 if(!ultFx)return;const U=ULTS[ultFx.k];ultFx.t+=dt;
 while(ultFx.i<U.ticks.length&&ultFx.t>=U.ticks[ultFx.i]){ultFx.i++;const dmg=ATK()*U.dmg*(1+.3*(ultFx.g-3));
  for(const m of mobs)if(!m.dead&&m.x<W+20){const crit=Math.random()*100<stat('crit');hitMob(m,dmg*(crit?stat('critd')/100:1),crit);sparks(m.x,m.y-50*K*m.size,10,U.col,360);}shake=Math.max(shake,ultFx.k==='neon'||ultFx.k==='zero'?14:6);}
 if(ultFx.t>=U.dur)ultFx=null;}
function liveMobs(){return mobs.filter(m=>!m.dead&&m.x<W+20);}
function drawUlt(c,t){if(!ultFx)return;const f=ultFx,U=ULTS[f.k],p=f.t/U.dur,col=U.col,M=liveMobs(),fade=p>.85?1-(p-.85)/.15:1;c.save();
 const flash=(a)=>{c.globalCompositeOperation='source-over';c.fillStyle=`rgba(255,255,255,${a})`;c.fillRect(0,0,W,H);};
 const near=k=>U.ticks.reduce((m,x)=>Math.min(m,Math.abs(f.t-x)),9)<k;
 if(f.k==='bolt'){c.fillStyle=`rgba(10,10,40,${.35*fade})`;c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';
  if(near(.08))for(const m of M){c.beginPath();let x=m.x+rnd(-20,20),y=0;c.moveTo(x,y);while(y<m.y-20*K){y+=rnd(14,26)*K;x+=rnd(-14,14)*K;c.lineTo(x,y);}c.lineTo(m.x,m.y-30*K);c.strokeStyle=col;c.lineWidth=4*K;c.shadowColor=col;c.shadowBlur=20;c.stroke();c.strokeStyle='#fff';c.lineWidth=1.5*K;c.stroke();}
  if(near(.04))flash(.25);}
 else if(f.k==='neon'){c.fillStyle=`rgba(20,0,30,${.6*fade})`;c.fillRect(0,0,W,H);const y=GY-55*K;c.globalCompositeOperation='lighter';
  if(f.t<.55){const k=f.t/.55;c.strokeStyle=col;c.lineWidth=2;c.shadowColor=col;c.shadowBlur=14;c.beginPath();c.moveTo(BX,y);c.lineTo(BX+(W-BX)*k,y);c.stroke();}
  else{const k=Math.max(0,1-(f.t-.55)/.5);for(const[w2,a]of[[22,.35],[9,.7],[3,1]]){c.fillStyle=w2===3?`rgba(255,255,255,${a*k})`:`rgba(255,58,216,${a*k})`;c.fillRect(0,y-w2*K*k,W,w2*2*K*k);}if(f.t<.65)flash(.5);}}
 else if(f.k==='rainbow'){c.globalCompositeOperation='lighter';for(let i=0;i<3;i++){const k=(f.t-U.ticks[i]+.3);if(k<0||k>.9)continue;const r=k*W*1.1;for(let j=0;j<6;j++){c.beginPath();c.arc(BX,GY-50*K,r-j*7*K,0,TAU);c.strokeStyle=`hsla(${j*55+t*200},95%,65%,${(1-k/.9)*.8})`;c.lineWidth=6*K;c.stroke();}}}
 else if(f.k==='holy'){c.fillStyle=`rgba(255,240,180,${.15*fade})`;c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';for(const m of M){const k=Math.min(1,f.t/.6),w2=(18+Math.sin(t*20)*3)*K;
  const g=c.createLinearGradient(m.x-w2,0,m.x+w2,0);g.addColorStop(0,'rgba(255,240,170,0)');g.addColorStop(.5,`rgba(255,250,220,${.9*fade})`);g.addColorStop(1,'rgba(255,240,170,0)');c.fillStyle=g;c.fillRect(m.x-w2,0,w2*2,GY*k);
  c.beginPath();c.ellipse(m.x,GY,w2*1.6,w2*.4,0,0,TAU);c.strokeStyle=`rgba(255,240,170,${fade})`;c.lineWidth=2;c.stroke();}}
 else if(f.k==='deadeye'){c.fillStyle=`rgba(60,0,0,${.45*fade})`;c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';M.forEach((m,i)=>{const k=Math.min(1,f.t/(.5+i*.04)),r=(40-26*k)*K,y=m.y-ART_H[m.arch]*.5*K*m.size;
  c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.arc(m.x,y,r,0,TAU);c.moveTo(m.x-r-6,y);c.lineTo(m.x+r+6,y);c.moveTo(m.x,y-r-6);c.lineTo(m.x,y+r+6);c.stroke();});if(near(.03))flash(.3);}
 else if(f.k==='rail'){const y=GY-62*K,k=f.t<.4?f.t/.4:fade,hw=(f.t<.4?3:30+8*Math.sin(t*40))*K*k;c.globalCompositeOperation='lighter';
  for(const[m2,a]of[[2,.3],[1,.7],[.35,1]]){c.fillStyle=m2<.5?`rgba(255,255,255,${a*k})`:`rgba(90,240,255,${a*k})`;c.fillRect(BX+20*K,y-hw*m2,W,hw*m2*2);}
  if(f.t<.4){c.beginPath();c.arc(BX+30*K,y,16*K*k,0,TAU);c.fillStyle=`rgba(90,240,255,${.8*k})`;c.fill();}}
 else if(f.k==='shadow'){c.globalCompositeOperation='source-over';for(const[dx,dy]of[[-40,-60],[60,-110],[120,-40]]){c.save();c.globalAlpha=.55*Math.min(1,f.t*4)*fade;c.translate(BX+dx*K,GY+dy*K*.3);c.scale(K*.8,K*.8);c.filter='brightness(0.15) sepia(1) hue-rotate(220deg) saturate(4)';
   HERO().draw(c,{t,atk:(f.t*3)%1,kind:'throw'});c.restore();}
  c.globalCompositeOperation='lighter';for(const m of M)for(let i=0;i<3;i++){const k=((f.t*2+i/3)%1);ell(c,lerp(BX,m.x,k),lerp(GY-80*K,m.y-40*K,k),4*K,4*K);c.fillStyle=col;c.fill();}}
 else if(f.k==='kunai'){c.globalCompositeOperation='source-over';for(let i=0;i<26;i++){const k=((f.t*1.6+i*.137)%1),x=W*(.3+((i*37)%70)/100)+k*40*K,y=-20+k*(GY+20);

 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}

 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dur);}

 $('#sauto').onclick=()=>{S.sauto=!S.sauto;save();updateSkillbar();};updateSkillbar();}
function updateSkillbar(){for(const b of document.querySelectorAll('.sk')){const k=b.dataset.k,open=skOpen(k);b.classList.toggle('lock',!open);
  b.querySelector('i').style.setProperty('--p',(open?skCd[k]/SKILLS[k].cd*100:100)+'%');b.querySelector('b').textContent=open&&skCd[k]>0?Math.ceil(skCd[k]):'';}
 const a=$('#sauto');if(a)a.classList.toggle('on',!!S.sauto);}
function eqSection(slot,title){const k=S.eq[slot],own=Object.keys(S.inv).filter(x=>ITEMS[gsplit(x)[0]].s===slot).sort((x,y)=>gsplit(y)[1]-gsplit(x)[1]||ITEMS[gsplit(x)[0]].n.localeCompare(ITEMS[gsplit(y)[0]].n));
 let card=`<div class="info">장착한 ${title}가 없어요. 뽑기에서 얻을 수 있어요.</div>`;
 if(k){const[id,g]=gsplit(k),it=ITEMS[id],gm=gearMul(slot);card=`<div class="eqcard" data-item="${k}">${gbox(itemIcon(id),g)}<div class="rinfo"><div class="rname">${it.n}<small>+${S.inv[k].lv}</small></div>
  <div class="rval">${slot==='w'?`${KIND[it.k].n} · 공격력`:'체력'} x${gm<100?gm.toFixed(1):fmt(gm)}</div>${it.ult?`<div class="rval" style="color:${ULTS[it.ult].col};filter:brightness(.75)">필살기 · ${ULTS[it.ult].n}</div>`:''}</div><button class="btn2" data-item="${k}">관리</button></div>`;}
 return `<div class="sec">${title}</div>${card}<div class="igrid">${own.map(x=>{const[id,g]=gsplit(x);return gbox(itemIcon(id),g,`<span class="cnt">x${S.inv[x].n}</span>${canMerge(x)?'<span class="new" style="background:#2fb84a">합성</span>':''}`,`data-item="${x}"`).replace('class="ibox"',x===k?'class="ibox on"':'class="ibox"');}).join('')}</div>`;}
function itemPopup(k){const[id,g]=gsplit(k),it=ITEMS[id],o=S.inv[k];if(!o)return;const c=enhCost(g,o.lv),eq=S.eq[it.s]===k;
 const info=`<div style="display:flex;gap:12px;align-items:center;text-align:left">${gbox(itemIcon(id),g)}<div><b style="color:${shade(GCOL[g],-.35)}">${GRADES[g]}등급</b> · 보유 ${o.n}개 · +${o.lv}<br>${it.s==='w'?KIND[it.k].n+' 무기':'장신구 (체력)'}${it.ult?`<br><span style="color:#9a3ad8">필살기 · ${ULTS[it.ult].n}</span>`:''}</div></div>
  <p style="margin-top:10px;font-size:12px">같은 장비 ${MERGE_N}개를 합성하면 <b>${it.n} ${GRADES[Math.min(6,g+1)]}등급</b> 1개가 돼요.</p>`;
 const btns=[];if(!eq)btns.push(['장착',()=>{const hp=bear.hp/MAXHP();S.eq[it.s]=k;bear.hp=hp*MAXHP();save();renderPanel();},1]);
 btns.push([`강화 ${fmt(c)}`,()=>{if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;o.lv++;sfx('level');save();updateHud();renderPanel();itemPopup(k);}]);
 if(canMerge(k))btns.push(['합성',()=>{const nk=merge(k);sfx('clear');banner(`${GRADES[g+1]}등급 ${it.n}!`,GCOL[g+1]);save();updateHud();renderPanel();itemPopup(nk);},1]);
 btns.push(['닫기']);modal(it.n,info,btns);}
const PANEL={
 gear(L){const mc=Object.keys(S.inv).filter(canMerge).length;L.innerHTML=(mc?`<button class="btn2" id="mergeall" style="width:100%">모두 합성 (${mc}종)</button>`:'')+eqSection('w','무기')+eqSection('a','장신구');
  L.querySelectorAll('[data-item]').forEach(e=>e.onclick=()=>itemPopup(e.dataset.item));
  const ma=$('#mergeall');if(ma)ma.onclick=()=>{const n=mergeAll();sfx('clear');toast(`${n}번 합성했어요!`);updateHud();renderPanel();};},
 skill(L){L.innerHTML=Object.keys(SKILLS).map(k=>{const sk=SKILLS[k],open=skOpen(k),c=skCost(k);return `<div class="row"><div class="ric" style="background:linear-gradient(145deg,#2a3a5e,#141e36)">${SKICON[k]}</div>
  <div class="rinfo"><div class="rname">${sk.n}<small>${open?'Lv.'+skLv(k):'잠김'}</small></div><div class="rval">${open?`피해 ${fmt(skDmg(k))} · 재사용 ${sk.cd}초`:`${stageName(sk.unlock)} 도달 시 열려요`}</div><div class="rval">${sk.d}</div></div>
  ${open?`<button class="buy${S.gold<c?' no':''}" data-sk="${k}"><span>레벨업</span><small>${fmt(c)} 골드</small></button>`:''}</div>`;}).join('');
  L.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const k=b.dataset.sk,c=skCost(k);if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;S.skl[k]=skLv(k)+1;sfx('level');save();updateHud();renderPanel();});},
 pet(L){const own=Object.keys(S.pets).sort((x,y)=>gsplit(y)[1]-gsplit(x)[1]);if(!own.length){L.innerHTML='<div class="info"><h3>아직 펫이 없어요</h3>뽑기에서 12종의 펫을 만날 수 있어요. 함께하는 펫 1마리가 백곰과 같이 싸우고 능력치 보너스를 줘요.</div>';return;}
  const mc=own.filter(canMergePet).length;
  L.innerHTML=(mc?`<button class="btn2" id="pmergeall" style="width:100%">모두 합성 (${mc}종)</button>`:'')+own.map(k=>{const[id,g]=gsplit(k),P=PETS[id],o=S.pets[k];return `<div class="row" data-pk="${k}" style="cursor:pointer">${gbox(itemIcon(id,1),g,`<span class="cnt">x${o.n}</span>${canMergePet(k)?'<span class="new" style="background:#2fb84a">합성</span>':''}`)}
  <div class="rinfo"><div class="rname">${P.n}<small>${P.an} · +${o.lv}</small></div><div class="rval">${P.at} · 공격력의 <b>${Math.round(petMul(k)*100)}%</b></div><div class="rval">${PB_N[P.bk]} +${Math.round(petBonusOf(k)*10)/10}${P.bk==='crit'?'%p':'%'}${g>=3?' · <b style="color:#b07a00">펫 스킬</b>':''}</div></div>
  ${S.pet===k?'<span class="btn2" style="height:30px;line-height:30px;font-size:11px;background:#8a96b8;box-shadow:none">함께</span>':''}</div>`;}).join('');
  L.querySelectorAll('[data-pk]').forEach(e=>e.onclick=()=>petPopup(e.dataset.pk));
  const ma=$('#pmergeall');if(ma)ma.onclick=()=>{let n=0;for(let p=0;p<7;p++)for(const k of Object.keys(S.pets))while(canMergePet(k)){mergePet(k);n++;}sfx('clear');toast(`${n}번 합성했어요!`);renderPanel();};},
 gacha(L){const tot=GACHAW.reduce((a,b)=>a+b,0);L.innerHTML=`<div class="gacha"><h3>북극 보물 뽑기</h3><p>무기 · 장신구 · 펫이 나와요. 더 좋은 장비는 자동으로 장착돼요.</p>
  <div class="row2"><button data-n="1">1회<br><small>보석 100</small></button><button data-n="10">10회<br><small>보석 900</small></button></div>
  <div class="odds">${GRADES.map((g,i)=>`<span style="color:${GCOL[i]}"><b>${g}</b> ${(GACHAW[i]/tot*100).toFixed(GACHAW[i]/tot<.01?2:1)}%</span>`).join('')}</div></div>
  <div class="info">보석은 스테이지 클리어(+3), 레벨 업(+10), 보스 처치(+30)로 모을 수 있어요.</div>`;
  L.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const r=gacha(+b.dataset.n);if(!r){toast('보석이 부족해요');return;}sfx('clear');updateHud();
   modal(`뽑기 결과`,`<div class="res">${r.map((x,i)=>{const g=x.g;return gbox(itemIcon(x.id,x.pet),g,x.isNew?'<span class="new">NEW</span>':'','',`animation-delay:${i*.08}s`);}).join('')}</div>`,[['확인',()=>renderPanel(),1]],1);});},
};

function petPopup(k){const[id,g]=gsplit(k),P=PETS[id],o=S.pets[k];if(!o)return;const c=enhCost(g,o.lv);
 const info=`<div style="display:flex;gap:12px;align-items:center;text-align:left">${gbox(itemIcon(id,1),g)}<div><b style="color:${shade(GCOL[g],-.35)}">${GRADES[g]}등급 ${P.an}</b><br>보유 ${o.n}마리 · +${o.lv}<br>${P.at} (${P.cd}초마다)</div></div>
  <p style="margin-top:10px;font-size:12px">같은 펫 ${MERGE_N}마리를 합성하면 <b>${P.n} ${GRADES[Math.min(6,g+1)]}등급</b>이 돼요.${g<3?' S등급부터 5번째 공격마다 펫 스킬이 나가요.':''}</p>`;
 const btns=[];if(S.pet!==k)btns.push(['함께하기',()=>{const hp=bear.hp/MAXHP();S.pet=k;pet.x=0;bear.hp=hp*MAXHP();save();renderPanel();},1]);
 btns.push([`강화 ${fmt(c)}`,()=>{if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;o.lv++;sfx('level');save();updateHud();renderPanel();petPopup(k);}]);
 if(canMergePet(k))btns.push(['합성',()=>{const nk=mergePet(k);sfx('clear');banner(`${GRADES[g+1]}등급 ${P.n}!`,GCOL[g+1]);renderPanel();petPopup(nk);},1]);
 btns.push(['닫기']);modal(`${P.n}`,info,btns);}

/* ---------- boot + main loop ---------- */
resizeStage();measureHud();addEventListener('resize',()=>{resizeStage();measureHud();});
bear.hp=MAXHP();applyTheme();lobbyText();renderPanel();updateHud();offlineReward();
let last=performance.now(),saveT=10,hudT=0;
function frame(now){requestAnimationFrame(frame);const raw=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
 if(screen==='lobby'){drawLobby(t);return;}
 let dt=Math.min(raw,1/20);if(hitstop>0){hitstop-=dt;dt*=.08;}shake=Math.max(0,shake-raw*30);
 step(dt);render(t);
 hudT-=raw;if(hudT<0){hudT=.25;updateHud();}
 saveT-=raw;if(saveT<0){saveT=10;save();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
requestAnimationFrame(frame);

</script>
</body>
</html>
