<title>잃어버린 고향을 찾아서</title>
<style>
:root{--ink:#16233f;--ink2:#4a5a7c;--paper:#f6f9ff;--glass:rgba(255,255,255,.12);--glass-b:rgba(255,255,255,.28);
 --gold:#ffcf3d;--gem:#7fe3ff;--hp:#ff5b6e;--exp:#8ae86a;--accent:#3d8bff;--accent2:#6b5bff;
 --f-title:"Jal","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-body:"Ssr","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0b1630;color:#fff;font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(120% 80% at 50% 0%,#1d3f7a 0%,#0b1630 60%,#060c1c 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
/* stage */
#stage{position:relative;flex:0 0 auto;height:min(56vh,560px);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* hud */
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 10px 0;display:flex;flex-direction:column;gap:7px;pointer-events:none;z-index:5}
.hrow{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:rgba(10,20,45,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--f-title);font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.pill i{width:20px;height:20px;display:block;flex:none}
#lvbox{flex:1;min-width:0;padding-left:5px}
#lvtxt{flex:none}
.bar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;min-width:30px}
.bar b{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#5fd35a,#c3ff79);box-shadow:0 0 8px rgba(160,255,120,.6);transition:width .25s}
#stagebox{justify-content:center;flex-direction:column;align-items:center;height:auto;padding:5px 16px 6px;border-radius:16px;gap:3px}
#cpbox{position:absolute;left:0;top:4px;height:26px;padding:0 9px 0 5px;font-size:13px;color:#ffe9a8}#cpbox i{width:18px;height:18px}
#cpup{position:absolute;left:100%;top:2px;margin-left:4px;font:12px var(--f-title);color:#8aff8a;text-shadow:0 1px 2px #000;opacity:0;white-space:nowrap}#cpup.go{animation:cpup 1.4s ease-out}
@keyframes cpup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#stname{font-size:15px;letter-spacing:.5px}#stagebox{pointer-events:auto;cursor:pointer}#stname::after{content:" ▾";font-size:11px;opacity:.8}
#stsub{font-family:var(--f-body);font-size:11px;opacity:.85}
#killbar{width:150px;height:6px}
#killbar b{background:linear-gradient(90deg,#ffb93d,#ffe680);box-shadow:0 0 8px rgba(255,200,80,.6)}
#bossbtn{pointer-events:auto;font-family:var(--f-title);font-size:13px;padding:7px 14px;border-radius:999px;background:linear-gradient(#ff6a7d,#e2364f);box-shadow:0 3px 0 #9c1d33,0 0 18px rgba(255,80,100,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#bosstimer{width:170px;height:7px}#bosstimer b{background:linear-gradient(90deg,#ff3d5a,#ff9a6a)}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--f-title);font-size:34px;letter-spacing:1px;pointer-events:none;z-index:6;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px currentColor}
#banner.show{animation:ban 1.8s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(8,16,36,.8);border:1px solid rgba(255,255,255,.2);font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s;z-index:7;pointer-events:none}
#toast.show{opacity:1}
/* panel */
#panel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#e9f1ff,#dbe7fb);color:var(--ink);border-radius:22px 22px 0 0;margin-top:-18px;z-index:8;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
#tabs{display:flex;gap:6px;padding:10px 12px 6px}
.tab{flex:1;height:38px;border-radius:12px;font-family:var(--f-title);font-size:14px;color:var(--ink2);background:#cfdcf3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.tab.on{color:#fff;background:linear-gradient(#4f9bff,#2f6fe0);box-shadow:0 3px 0 #1f4fa8,0 6px 14px rgba(47,111,224,.35)}
#ptools{display:flex;align-items:center;gap:6px;padding:2px 14px 6px;font-size:12px;color:var(--ink2)}

const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
const hexRGB=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];};
function fmt(n){n=Math.floor(n);if(n<1e4)return n.toLocaleString('en-US');
 for(const[v,s]of[[1e20,'해'],[1e16,'경'],[1e12,'조'],[1e8,'억'],[1e4,'만']])if(n>=v){const x=n/v;let t=x>=100?String(Math.floor(x)):x.toFixed(x>=10?1:2);if(t.includes('.'))t=t.replace(/\.?0+$/,'');return t+s;}}

];
// passive bonuses (pet PB + sets/title/codex BONUS) are added here so every caller sees them
const PBX=k=>PB(k)+BONUS(k);
const stat=k=>{const v=UPS.find(u=>u.k===k).val(S.up[k]);return k==='crit'||k==='critd'?v+PBX(k):k==='aspd'?v*(1+PBX('aspd')/100):v;};
const lvMul=()=>1+.03*(S.lv-1);
const ATK=()=>stat('atk')*lvMul()*gearMul('w')*(1+PBX('atk')/100), MAXHP=()=>stat('hp')*lvMul()*gearMul('a')*(1+PBX('hp')/100), REGEN=()=>stat('regen')*lvMul()*(1+PBX('regen')/100);
// combat power: expected damage per second (crit included) plus a share of survivability
const CP=()=>Math.floor(ATK()*1.6*stat('aspd')*(1+Math.min(100,stat('crit'))/100*(stat('critd')/100-1))*10+MAXHP()*.5+REGEN()*5);
const KILLS=20;
const mobHp=g=>36*Math.pow(1.36,g), mobAtk=g=>9*Math.pow(1.245,g), mobGold=g=>6*Math.pow(1.145,g), mobExp=g=>3*Math.pow(1.14,g), needExp=l=>12*Math.pow(1.22,l);

const gkey=(id,g)=>id+'#'+g, gsplit=k=>{const i=k.lastIndexOf('#');return[k.slice(0,i),+k.slice(i+1)];};

for(const s of['w','a'])if(S.eq[s]&&!S.eq[s].includes('#'))S.eq[s]=ITEMS[S.eq[s]]?gkey(S.eq[s],ITEMS[S.eq[s]].g):null;
// accessories moved to two slots a1/a2
if(S.eq.a!==undefined){S.eq.a1=S.eq.a1||S.eq.a;delete S.eq.a;}
const SLOTS={w:['w'],a:['a1','a2'],c:['c']};
if(!S.eq.w||!S.inv[S.eq.w]){S.inv[gkey('plank',0)]=S.inv[gkey('plank',0)]||{n:1,lv:0};S.eq.w=gkey('plank',0);}
const enhMul=lv=>1+.15*lv, enhCost=(g,lv)=>Math.floor(200*Math.pow(2.2,g)*Math.pow(1.35,lv));
const slotMul=k=>{if(!k||!S.inv[k])return 0;const[,g]=gsplit(k);return GMUL[g]*enhMul(S.inv[k].lv||0);};
// w: attack multiplier. a: HP multiplier from both accessories and the costume
function gearMul(slot){if(slot==='w')return S.eq.w?slotMul(S.eq.w):1;return(1+.5*(slotMul(S.eq.a1)+slotMul(S.eq.a2)))*(1+.25*slotMul(S.eq.c));}
function curWeapon(){const[id,g]=gsplit(S.eq.w||'plank#0');return Object.assign({id,kind:KIND[ITEMS[id].k]},ITEMS[id],{g});}
function rollGrade(){let r=Math.random()*GACHAW.reduce((a,b)=>a+b,0);for(let g=0;g<GACHAW.length;g++){r-=GACHAW[g];if(r<=0)return g;}return 0;}
function equipItem(k){const s=ITEMS[gsplit(k)[0]].s,sl=SLOTS[s];if(sl.some(x=>S.eq[x]===k))return;const free=sl.find(x=>!S.eq[x]);S.eq[free||sl.reduce((a,b)=>slotMul(S.eq[a])<=slotMul(S.eq[b])?a:b)]=k;}
function addItem(id,g){const k=gkey(id,g),own=S.inv[k];S.inv[k]={n:(own?.n||0)+1,lv:own?.lv||0};const sl=SLOTS[ITEMS[id].s];if(sl.some(x=>!S.eq[x])||sl.some(x=>gsplit(S.eq[x])[1]<g&&S.eq[x]!==k))equipItem(k);return!own;}
function gacha(n){const cost=n>=10?900:100;if(S.gem<cost)return null;S.gem-=cost;const out=[];
 for(let i=0;i<n;i++){const g=rollGrade();
  if(Math.random()<.12){const pg=Math.min(g,4),pool=Object.keys(PETS).filter(k=>PETS[k].g===pg);const id=pick(pool.length?pool:Object.keys(PETS).filter(k=>PETS[k].g===0));out.push({pet:1,id,g:PETS[id].g,isNew:addPet(id,PETS[id].g)});continue;}
  const id=pick(Object.keys(ITEMS).filter(k=>ITEMS[k].g===g));out.push({id,g,isNew:addItem(id,g)});}
 save();return out;}
// merge: 3 of the same item+grade -> 1 of the same item, next grade
function canMerge(k){const[,g]=gsplit(k),o=S.inv[k];return o&&g<6&&o.n>=MERGE_N;}
function merge(k){if(!canMerge(k))return false;const[id,g]=gsplit(k);S.inv[k].n-=MERGE_N;if(S.inv[k].n<=0){delete S.inv[k];for(const s of['w','a1','a2','c'])if(S.eq[s]===k)S.eq[s]=null;}
 addItem(id,g+1);if(!S.eq.w)S.eq.w=gkey(id,g+1);return gkey(id,g+1);}
function mergeAll(){let n=0;for(let pass=0;pass<7;pass++)for(const k of Object.keys(S.inv))while(canMerge(k)){merge(k);n++;}save();return n;}

const BSK={
 barkas:[{n:'대지 분쇄',col:'#ff7a3a',kind:'slam',mul:4},{n:'강철 돌진',col:'#c8ccd6',kind:'charge',mul:3}],

 king:[{n:'어둠의 대검',col:'#ff2a3a',kind:'slash',mul:5},{n:'마왕의 낙인',col:'#ff3a6a',kind:'pillar',mul:5},{n:'멸망의 별',col:'#ff6a2a',kind:'rain',mul:4,ph:3}],
 _:[{n:'분노의 일격',col:'#ff5a3a',kind:'slam',mul:3}],
};
const TELE=.8,CAST=1.5;
function stepBoss(m,dt){if(!m||m.dead)return;if(m.skT==null){m.skT=4;m.phase=1;}
 if(m.id==='king'){const ph=m.hp<m.max*.33?3:m.hp<m.max*.66?2:1;if(ph>m.phase){m.phase=ph;m.size*=1.1;m.skT=1.2;hitstop=.4;shake=16;banner(ph===2?'마왕 각성!':'진정한 마왕 녹스!','#ff2a3a');sfx('boss');sparks(m.x,m.y-90*K,40,'#ff2a3a',500);}}
 else if(!m.enraged&&m.hp<m.max*.5){m.enraged=true;banner('분노!','#ff5a3a');sfx('boss');}
 if(m.frozen>0)return;
 if(!m.cast){m.skT-=dt;if(m.skT<=0&&!bear.dead&&m.x<W){const list=(BSK[m.id]||BSK._).filter(s=>!s.ph||s.ph<=m.phase);m.cast={s:pick(list),t:0,done:false,x0:m.x};num(m.x,m.y-ART_H[m.arch]*K*m.size-24*K,m.cast.s.n,'hurt');}return;}
 const c=m.cast,s=c.s;c.t+=dt;
 if(s.kind==='charge'){const k=c.t<TELE?0:c.t<TELE+.25?(c.t-TELE)/.25:Math.max(0,1-(c.t-TELE-.25)/.4);m.x=lerp(c.x0,BX+40*K,k);}
 if(!c.done&&c.t>=TELE){c.done=true;const d=m.dmg*s.mul;
  if(!bear.dead)hurtBear(d);shake=Math.max(shake,12);hitstop=Math.max(hitstop,.08);sfx('crit');
  if(s.kind==='drain'){const h=m.max*.04;m.hp=Math.min(m.max,m.hp+h);num(m.x,m.y-120*K,'+'+fmt(h),'heal');}
  if(s.kind==='slam'){ring(BX,GY,s.col,70*K,.6);debris(BX,GY-5*K,14,'#8a7a6a',K);}
  if(s.kind==='rain')for(let i=0;i<24;i++)part({x:BX+rnd(-60,60)*K,y:-10,vx:rnd(-40,40),vy:rnd(500,800),g:400,life:.6,ml:.6,size:rnd(3,6),col:s.col,type:'spark'});
  if(s.kind==='pillar'||s.kind==='slash')sparks(BX,GY-60*K,30,s.col,420);}
 if(c.t>=CAST){m.cast=null;m.skT=rnd(6,8)/(m.enraged||m.phase>1?1.5:1);}}
function drawBossFx(c,t){const m=boss;if(!m||m.dead)return;c.save();
 if(m.enraged||m.phase>1){c.globalCompositeOperation='lighter';const cy=m.y-ART_H[m.arch]*.5*K*m.size,r=ART_H[m.arch]*.7*K*m.size;const g=c.createRadialGradient(m.x,cy,r*.2,m.x,cy,r);g.addColorStop(0,`rgba(255,40,60,${.18+.08*Math.sin(t*6)})`);g.addColorStop(1,'rgba(255,40,60,0)');c.fillStyle=g;c.fillRect(m.x-r,cy-r,r*2,r*2);c.globalCompositeOperation='source-over';}

  if(cs.t<TELE){const k=cs.t/TELE;c.fillStyle=`rgba(255,40,60,${.15+.25*k})`;c.beginPath();c.ellipse(BX,GY,(50+30*k)*K,(10+5*k)*K,0,0,TAU);c.fill();c.strokeStyle=`rgba(255,80,90,${.6+.4*Math.sin(t*30)})`;c.lineWidth=2;c.stroke();

   if(s.kind==='slash'){c.save();c.translate(BX+10*K,GY-60*K);c.rotate(-.5);const r=90*K;c.beginPath();c.arc(-r*.4,0,r,-1.1,1.1);c.arc(-r*.4-r*.3,0,r*.9,1,-1,true);c.closePath();c.fillStyle=s.col;c.globalAlpha=a;c.shadowColor=s.col;c.shadowBlur=24;c.fill();c.restore();}

   else if(s.kind==='charge'){c.globalAlpha=a*.7;c.strokeStyle='#fff';c.lineWidth=2;for(let i=0;i<6;i++){const y=m.y-(20+i*18)*K;c.beginPath();c.moveTo(m.x+20*K,y);c.lineTo(m.x+(70+i*8)*K,y);c.stroke();}}}}

function kingWings(c,t){const f=Math.sin(t*3)*.15;for(const s of[1,.85]){c.save();c.translate(-6,-130);c.rotate(-.3-f);c.scale(s,s);c.beginPath();c.moveTo(0,0);c.lineTo(-30,-40);c.lineTo(-80,-46);c.quadraticCurveTo(-70,-20,-86,-8);c.quadraticCurveTo(-64,-6,-70,14);c.quadraticCurveTo(-46,4,-44,26);c.quadraticCurveTo(-26,10,0,10);c.closePath();

 const w=$('#wipe');w.querySelector('b').textContent=D.n;w.querySelector('small').textContent=D.sub;w.style.setProperty('--dc',D.col);w.hidden=false;w.classList.remove('go');void w.offsetWidth;w.classList.add('go');
 setTimeout(()=>{dun={k,t:D.limit,earn:0,dmg:0,spawn:0};document.body.dataset.dun=k;for(const m of mobs)m.dead=true,m.dt=.3;mobs.length=0;boss=null;shots.length=0;pshots.length=0;
  bear.dead=false;bear.hp=MAXHP();curTheme=-1;bgStage.theme(D.th);if(k==='gem'){const g=mkMob('crystgiant',BX+170*K,2);g.hp=g.max=1e300;g.dmg=mobAtk(S.best)*.6;mobs.push(g);}

  if(dun.spawn<=0&&live<(dun.k==='gold'?7:5)){dun.spawn=dun.k==='gold'?.45:.9;const id=dun.k==='gold'?'goldgob':pick(['flame','boiler','charstump','lslime','transformer']);

const QUESTS=[

function track(ev,n=1){S.cnt[ev]=(S.cnt[ev]||0)+n;dailyReset();S.daily.c[ev]=(S.daily.c[ev]||0)+n;questDot();}
// main quest: target scales each full cycle so it never runs out
function curQuest(){const q=QUESTS[S.q.i%QUESTS.length],cyc=Math.floor(S.q.i/QUESTS.length),n=q.goldK?Math.floor(mobGold(Math.max(S.best,1))*200*(1+cyc)):Math.ceil(q.n*(1+cyc*.5));
 return{...q,n,have:Math.min(n,(S.cnt[q.ev]||0)-S.q.base),reward:30+cyc*10,text:q.d.replace('{n}',fmt(n))};}
function claimQuest(){const q=curQuest();if(q.have<q.n)return;S.gem+=q.reward;S.q.i++;S.q.base=S.cnt[QUESTS[S.q.i%QUESTS.length].ev]||0;sfx('clear');save();}
function canAttend(){return S.att.last!==today();}
function attend(){if(!canAttend())return null;const day=S.att.n%7,r=ATTEND[day];S.gem+=r.gem;S.stone=(S.stone||0)+(r.stone||0);S.att.n++;S.att.last=today();sfx('clear');save();return r;}
function dailyDone(i){dailyReset();return(S.daily.c[DAILY[i].ev]||0)>=DAILY[i].n;}
function claimDaily(i){if(!dailyDone(i)||S.daily.got.includes(i))return;S.daily.got.push(i);S.gem+=30;if(S.daily.got.length===DAILY.length&&!S.daily.all){S.daily.all=true;S.gem+=100;S.stone=(S.stone||0)+3;toast('일일 퀘스트 모두 완료! 보석 +100, 강화석 +3');}sfx('clear');save();}
function questReady(){dailyReset();const q=curQuest();return canAttend()||q.have>=q.n||DAILY.some((_,i)=>dailyDone(i)&&!S.daily.got.includes(i));}
function questDot(){const b=$('#qbtn');if(b)b.classList.toggle('dot',questReady());}

 const att=ATTEND.map((r,i)=>{const isToday=i===day&&canAttend();return`<div class="att${i<day?' got':''}${isToday?' now':''}"><small>${i+1}일</small><b>${r.gem}</b>${r.stone?`<i>+석${r.stone}</i>`:''}</div>`;}).join('');
 const dl=DAILY.map((d,i)=>{const have=Math.min(d.n,S.daily.c[d.ev]||0),got=S.daily.got.includes(i);return`<div class="qrow"><span>${d.d}</span><div class="bar"><b style="width:${have/d.n*100}%"></b></div><button class="qbtn2${got?' got':have>=d.n?' ok':''}" data-di="${i}">${got?'완료':have>=d.n?'받기':`${fmt(have)}/${fmt(d.n)}`}</button></div>`;}).join('');

  <div class="qsec">퀘스트 <small>보석 ${q.reward}</small></div><div class="qrow"><span>${q.text}</span><div class="bar"><b style="width:${q.have/q.n*100}%"></b></div><button class="qbtn2${q.have>=q.n?' ok':''}" id="mqbtn">${q.have>=q.n?'받기':`${fmt(q.have)}/${fmt(q.n)}`}</button></div>
  <div class="qsec">일일 퀘스트 <small>각 보석 30 · 모두 완료 시 보석 100 + 강화석 3</small></div>${dl}`,[],1);
 const ab=$('#attbtn');if(ab)ab.onclick=()=>{const r=attend();if(r)toast(`출석 ${S.att.n%7||7}일차! 보석 +${r.gem}${r.stone?`, 강화석 +${r.stone}`:''}`);updateHud();questMenu();};
 $('#mqbtn').onclick=()=>{claimQuest();updateHud();questMenu();};
 document.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{claimDaily(+b.dataset.di);updateHud();questMenu();});questDot();}

function step(dt){
 S.stats.play+=dt;applyTheme();
 // bear
 bear.hit=Math.max(0,bear.hit-dt*5);
 if(bear.dead){bear.deadT-=dt;if(bear.deadT<=0){bear.dead=false;bear.hp=MAXHP();for(const m of mobs)m.x+=120*K;ring(BX,GY,'#9fdcff',50*K);}}

 const f=front(),engaged=f&&f.x<=bearReach(f)+10*K,wk=curWeapon().k;

  const ma=$('#pmergeall');if(ma)ma.onclick=()=>{let n=0;for(let p=0;p<7;p++)for(const k of Object.keys(S.pets))while(canMergePet(k)){mergePet(k);n++;}sfx('clear');toast(`${n}번 합성했어요!`);renderPanel();};},
 gacha(L){const tot=GACHAW.reduce((a,b)=>a+b,0);L.innerHTML=`<div class="gacha"><h3>북극 보물 뽑기</h3><p>무기 · 장신구 · 코스튬 · 펫이 나와요. 더 좋은 장비는 자동으로 장착돼요.</p>
  <div class="row2"><button data-n="1">1회<br><small>보석 100</small></button><button data-n="10">10회<br><small>보석 900</small></button></div>
  <div class="odds">${GRADES.map((g,i)=>`<span style="color:${GCOL[i]}"><b>${g}</b> ${(GACHAW[i]/tot*100).toFixed(GACHAW[i]/tot<.01?2:1)}%</span>`).join('')}</div></div>
  <div class="info">보석은 스테이지 클리어(+3), 레벨 업(+10), 보스 처치(+30)로 모을 수 있어요.</div>`;
  L.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const r=gacha(+b.dataset.n);if(!r){toast('보석이 부족해요');return;}track('gacha',r.length);sfx('clear');updateHud();
   modal(`뽑기 결과`,`<div class="res">${r.map((x,i)=>{const g=x.g;return gbox(itemIcon(x.id,x.pet,x.g),g,x.isNew?'<span class="new">NEW</span>':'','',`animation-delay:${i*.08}s`);}).join('')}</div>`,[['확인',()=>renderPanel(),1]],1);});},
};

function petPopup(k){const[id,g]=gsplit(k),P=PETS[id],o=S.pets[k];if(!o)return;const c=enhCost(g,o.lv);
 const info=`<div style="display:flex;gap:12px;align-items:center;text-align:left">${gbox(itemIcon(id,1,g),g)}<div><b style="color:${shade(GCOL[g],-.35)}">${GRADES[g]}등급 ${P.an}</b><br>보유 ${o.n}마리 · +${o.lv}<br>${P.at} (${P.cd}초마다)</div></div>
  <p style="margin-top:10px;font-size:12px">같은 펫 ${MERGE_N}마리를 합성하면 <b>${P.n} ${GRADES[Math.min(6,g+1)]}등급</b>이 돼요.${g<3?' S등급부터 5번째 공격마다 펫 스킬이 나가요.':''}</p><p style="margin-top:8px;font-size:12px;line-height:1.5"><b>강화</b>: 한 번에 펫 효과 +15% (지금 +${o.lv}). 골드 ${fmt(c)} 또는 <b>강화석</b> 1개가 들어요.<br><small>강화석은 던전에서 얻는 재료예요 · 보유 ${fmt(S.stone||0)}개</small></p>`;
 const btns=[];if(S.pet!==k)btns.push(['함께하기',()=>{const hp=bear.hp/MAXHP();S.pet=k;pet.x=0;bear.hp=hp*MAXHP();save();renderPanel();},1]);
 btns.push([['골드로 강화',`${fmt(c)} 골드`],()=>{if(S.gold<c){toast('골드가 부족해요');return;}S.gold-=c;o.lv++;track('enh');sfx('level');save();updateHud();renderPanel();petPopup(k);}]);
 if(S.stone>0)btns.push([['강화석으로 강화',`1개 사용 · 보유 ${S.stone}`],()=>{S.stone--;o.lv++;track('enh');sfx('level');save();renderPanel();petPopup(k);}]);
 if(canMergePet(k))btns.push(['합성',()=>{const nk=mergePet(k);track('merge');sfx('clear');banner(`${GRADES[g+1]}등급 ${P.n}!`,GCOL[g+1]);renderPanel();petPopup(nk);},1]);
 modal(`${P.n}`,info,btns);}

/* chapter / stage select: tap the stage name. Only stages already reached can be picked */
function stageMenu(){if(dun||boss){toast(boss?'보스전 중에는 이동할 수 없어요':'던전 중에는 이동할 수 없어요');return;}const base=Math.floor(S.best/200)*200;
 modal('챕터 이동',`<div class="chlist">${THEMES.map((th,i)=>{const g0=base+i*10,open=g0<=S.best,here=Math.floor(S.g/10)*10===g0;
  return`<div class="chcard${open?'':' lock'}${here?' here':''}" style="background:linear-gradient(135deg,${th.sky[0]},${th.sky[1]} 60%,${th.sky[2]})"><b>${i+1}. ${th.name}</b>
  <div class="stg">${Array.from({length:10},(_,j)=>{const g=g0+j;return`<button data-g="${g}"${g>S.best?' disabled':''} class="${j===9?'boss':''}${g===S.g?' cur':''}">${j+1}</button>`;}).join('')}</div></div>`;}).join('')}</div>`,[],1);
 document.querySelectorAll('.stg button[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;$('#modal').hidden=true;if(g===S.g)return;
  S.g=g;S.kills=0;S.farm=false;for(const m of mobs)m.dead=true,m.dt=.3;shots.length=0;pshots.length=0;applyTheme();save();updateHud();banner(`${stageName(g)} ${theme().name}`,'#9fdcff');});
 const here=document.querySelector('.chcard.here');if(here)here.scrollIntoView({block:'center'});}
$('#stagebox').onclick=stageMenu;

/* ---------- boot + main loop ---------- */
resizeStage();measureHud();addEventListener('resize',()=>{resizeStage();measureHud();});
bear.hp=MAXHP();applyTheme();questDot();lobbyText();renderPanel();updateHud();offlineReward();
let last=performance.now(),saveT=10,hudT=0;
function frame(now){requestAnimationFrame(frame);const raw=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
 if(screen==='lobby'){drawLobby(t);return;}
 if(screen==='pro'){drawPrologue(t,raw);return;}
 let dt=Math.min(raw,1/20);if(hitstop>0){hitstop-=dt;dt*=.08;}shake=Math.max(0,shake-raw*30);
 step(dt);if(S.spd===2)step(dt);render(t);
 hudT-=raw;if(hudT<0){hudT=.25;updateHud();}
 saveT-=raw;if(saveT<0){saveT=10;save();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
requestAnimationFrame(frame);

</script>
</body>
