<style>
/* layout: phone column. Lobby screen, or game: HUD strip, pixel battle canvas (180x150 at 3x), tabbed growth panel */
:root{--bg:#141022;--panel:#fff7ea;--panel2:#f1e2c8;--ink:#3a2a20;--muted:#8a7360;--line:#1c1424;
  --gold:#ffc43d;--gem:#62d6ff;--go:#7bdc4f;--red:#ff4d5e;
  --f-pix:"DotGothic16","Jua",monospace;--f-num:"Black Han Sans","Jua",sans-serif;--f-ui:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(#221a36 1.5px,transparent 1.7px);background-size:18px 18px;color:var(--ink);font-family:var(--f-ui);margin:0;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
.screen{max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px;min-height:0}
button{font:inherit;color:var(--ink);border:2.5px solid #000;border-radius:12px;box-shadow:0 3px 0 #000;cursor:pointer;transition:transform .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
button:focus-visible{outline:3px solid var(--gem);outline-offset:2px}
canvas.pix{image-rendering:pixelated;display:block}

/* lobby */
#lobby{justify-content:center;gap:12px;color:#fff;text-align:center}
#lobby h1{font-family:var(--f-num);font-weight:400;font-size:40px;margin:0;line-height:1.1;color:#fff;text-shadow:0 4px 0 #000,3px 0 0 #000,-3px 0 0 #000,0 -3px 0 #000;text-wrap:balance}
#lobby h1 small{display:block;font-family:var(--f-pix);font-size:14px;letter-spacing:.2em;color:var(--gem);text-shadow:none;margin-bottom:4px}
#lcv{width:100%;max-width:100%;aspect-ratio:180/120;border:3px solid #000;border-radius:16px}
#lrec{font-family:var(--f-pix);color:#cdbbe8;font-size:14px;margin:0}
.lb{display:flex;flex-direction:column;gap:8px}
#lStart{font-size:22px;padding:12px;background:var(--gold)}
.lrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lrow button{background:#2c2244;color:#e9defc;font-size:15px;padding:9px 4px}
.lrow button:disabled{opacity:.55}
#lConfirm{background:#2c2244;border:2.5px solid #000;border-radius:14px;padding:10px;color:#fff;font-size:14px;display:flex;flex-direction:column;gap:8px}
#lConfirm div{display:flex;gap:8px}#lConfirm button{flex:1;padding:8px}
#lYes{background:var(--red);color:#fff}

/* game */
#hud{display:flex;align-items:center;gap:6px}
.me{display:flex;align-items:center;gap:6px;flex:1;min-width:0;background:#0d0a18;border:2.5px solid #000;border-radius:14px;padding:3px 8px 3px 3px;color:#fff}
.me canvas{width:36px;height:36px;border-radius:9px;background:#2a5a8a;flex:none}
.me .col{flex:1;min-width:0}
.me .nm{font-size:14px;line-height:1.1;white-space:nowrap}
.xb{height:6px;background:#2b2645;border-radius:4px;overflow:hidden;margin-top:3px}
.xb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ff06a,#3fcf6b)}
.pill{display:flex;align-items:center;gap:5px;background:#0d0a18;border:2.5px solid #000;border-radius:999px;padding:4px 10px 4px 5px;color:#fff;font-family:var(--f-pix);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill b{width:16px;height:16px;border-radius:50%;border:2px solid #000;flex:none;background:var(--gold)}
.pill.j b{background:var(--gem);border-radius:4px;transform:rotate(45deg) scale(.8)}
#home{background:#2c2244;color:#fff;padding:5px 8px;font-size:13px;border-radius:10px}
#field{position:relative;flex:none;width:100%;aspect-ratio:180/150;max-height:52vh;max-width:100%;margin:0 auto;border:3px solid #000;border-radius:16px;overflow:hidden;background:#5cb8f0}
#cv{position:absolute;inset:0;width:100%;height:100%}
#sbar{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:64%;background:rgba(12,8,22,.82);border:2.5px solid #000;border-radius:10px;padding:3px 9px 6px;color:#fff;text-align:center}
#sbar .st{font-size:14px;display:flex;justify-content:space-between;gap:6px}
#sbar .st span:last-child{font-family:var(--f-pix);font-variant-numeric:tabular-nums}

.g0{background:#8a9096}.g1{background:#3fae50}.g2{background:#f2b51c}.g3{background:#e83a4a}.g4{background:#9150e0}.g5{background:#d63ab8}

#skills{position:absolute;right:6px;bottom:6px;display:flex;gap:5px;align-items:flex-end}

#skills .sk.lock{filter:grayscale(1);opacity:.6}
#auto{height:26px;padding:0 6px;font-size:12px;background:#56607a;color:#fff;border-radius:8px}
#auto.on{background:var(--go);color:#173b0a}

#phead{display:flex;gap:6px;align-items:center;padding:7px 8px 0;flex-wrap:wrap}
#phead:empty{display:none}

#nav .dot.on{display:block}
.row .sub{font-size:12px;color:var(--muted);font-family:var(--f-ui)}
.tog{min-width:70px;padding:7px 8px;background:#56607a;color:#fff}.tog.on{background:var(--go);color:#173b0a}

/* ---- cartoon skin: chunky outlines, dark brown panels, gold accents ---- */
:root{--f-pix:"Fredoka","Jua",sans-serif;--f-num:"Fredoka","Jua",sans-serif;--olc:#140c0a;--pan1:#3b2f2b;--pan2:#231a18;--cr1:#fff8ea;--cr2:#f2e2c4}
body{background:#1c1530!important;background-image:radial-gradient(#2a2148 1.5px,transparent 1.7px)!important}
.me,.pill,.hbtn,#cpbox,#sbar,#mission,#buff,#toast,.slot,#lConfirm,#panel,#nav button{background:linear-gradient(var(--pan1),var(--pan2))!important;border:3px solid var(--olc)!important;border-radius:14px!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.45)!important;color:#fff}
.pill{border-radius:999px!important;font-family:var(--f-num)!important;font-weight:600;padding:2px 10px 2px 4px!important}
.me{padding:2px 8px 2px 2px!important}.me canvas{border-radius:10px!important;border:2px solid var(--olc);background:#5aa8e8!important}
.me .nm{font-family:var(--f-num);font-weight:700}
.xb{border:2px solid var(--olc);height:8px!important;background:#120c0a!important}
.hbtn{font-size:13px!important;padding:4px 8px!important}.hbtn.off{opacity:.55;text-decoration:line-through}
#field{border:3px solid var(--olc)!important;border-radius:18px!important;box-shadow:0 4px 0 rgba(0,0,0,.5)!important}
#cpbox{padding:2px 9px 3px!important;border-radius:12px!important}
#cpbox small{color:#ffb070!important;font-size:11px}
#cpbox b{font-family:var(--f-num)!important;font-weight:700;color:#ffd23a!important;font-size:17px!important;text-shadow:0 2px 0 #000}
#sbar{background:none!important;border:0!important;box-shadow:none!important;right:auto!important;left:50%!important;transform:translateX(-50%)!important;width:56%!important;padding:0!important}
#sbar .st{justify-content:center!important;gap:8px!important;font-family:var(--f-num);font-weight:700;font-size:15px!important;text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000,1px 1px 0 #000,-1px -1px 0 #000}
#sbar .tr{height:12px!important;border:3px solid var(--olc);border-radius:999px!important;background:#2a2238!important;margin-top:3px;position:relative;overflow:visible!important}
#sfill{border-radius:999px;background:linear-gradient(#8fe0ff,#3a9ae8)!important}
#sbar.boss #sfill{background:linear-gradient(#ff9a9a,#e8303c)!important}
#sbar .tr::after{content:"";position:absolute;right:-10px;top:50%;width:22px;height:22px;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle at 50% 42%,#fff 0 22%,#3a3a4a 23% 30%,#fff 31% 46%,transparent 47%),#2a2238;border:3px solid var(--olc)}
#sdots{display:none!important}
#log div{font-family:var(--f-num)!important;font-weight:600;font-size:12.5px!important;text-shadow:0 2px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
#mission{border-radius:12px!important;padding:3px 6px!important}
#mission .mn{border-radius:8px;font-family:var(--f-num);font-weight:700;border:2px solid var(--olc)}
#mission .mb{border:2px solid var(--olc);height:7px!important;border-radius:999px!important}
#mission.ready{background:linear-gradient(#ffe27a,#f0a818)!important;color:#3a2600!important}
#panel{border-radius:18px!important}
#phead .lbl{color:#c9b8a8!important}
#phead .chip,.row,.buy,.tog,#bossBtn,#modal button,#modal .box{border:3px solid var(--olc)!important;border-radius:12px!important;image-rendering:auto}
.row{color:var(--ink)!important;background:linear-gradient(var(--cr1),var(--cr2))!important;box-shadow:inset 0 2px 0 #fff,0 3px 0 rgba(0,0,0,.35)!important;border-radius:14px!important;padding:5px 7px!important}
.row canvas{border:3px solid var(--olc)!important;border-radius:12px!important;background:radial-gradient(circle at 50% 35%,#fffaf0,#e8d4ae)!important;image-rendering:auto!important}
.row .inf b{font-size:16px}.row .inf span{font-family:var(--f-num)!important;font-weight:600;color:#3d8a1a!important}
.buy,#modal button,.tog.on{background:linear-gradient(#a6ec7a,#5cbc3e)!important;color:#173b0a!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 #24601a!important;font-weight:400}
.buy small{font-family:var(--f-num)!important;font-weight:700}
.buy:active,#modal button:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 1px 0 #24601a!important}
#modal button,.buy.on,#nav button.on,#phead .chip.on{background:linear-gradient(#ffe27a,#f0a818)!important;color:#3a2600!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #8a5a00!important}
.buy:disabled{background:linear-gradient(#ddd4c6,#b9ae9c)!important;color:#6b5f52!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 4px 0 #6e6556!important}
.buy.gemb{background:linear-gradient(#a6dcff,#3a9ae8)!important;color:#062a4a!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 #1a4f8a!important}
.buy.gemb:disabled{background:linear-gradient(#ddd4c6,#b9ae9c)!important;color:#6b5f52!important}
.tog{background:linear-gradient(#ddd4c6,#b9ae9c)!important;color:#3a3028!important}
#bossBtn,#lYes{background:linear-gradient(#ff8a8a,#d8303c)!important;color:#fff!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 4px 0 #7a0f20!important}
#phead .chip{background:linear-gradient(#5a4a44,#3b2f2b)!important;color:#e8dccc!important;font-family:var(--f-num)!important;font-weight:700;padding:2px 10px!important;box-shadow:0 3px 0 rgba(0,0,0,.5)!important}
#nav{gap:5px!important}
#nav button{border-radius:14px!important;color:#e0d2c0!important;font-weight:400;padding:3px 0 2px!important}
#nav button canvas{width:34px!important;height:34px!important;image-rendering:auto!important;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
#nav .dot{border:2px solid var(--olc)!important;top:2px!important;right:6px!important}
#modal .box{color:var(--ink)!important;background:linear-gradient(var(--cr1),var(--cr2))!important;border-radius:18px!important}
#lcv{border:3px solid var(--olc)!important;border-radius:16px!important}
.slot canvas{image-rendering:auto!important;border:2px solid var(--olc);border-radius:10px!important;background:radial-gradient(circle at 50% 35%,#5a4a64,#2a2238)!important}
.slot b{font-size:12px}
.pill b,.buy small b{background-size:100% 100%!important;border:0!important;border-radius:0!important;image-rendering:auto!important;width:22px!important;height:22px!important}
.buy small b{width:14px!important;height:14px!important}
.pill b{background:var(--ic-coin) center/100% 100% no-repeat!important}.pill.j b{background:var(--ic-gem) center/100% 100% no-repeat!important;transform:none!important}
.buy small b{background:var(--ic-coin) center/100% 100% no-repeat!important}.gemb small b{background:var(--ic-gem) center/100% 100% no-repeat!important}
#buff{background:linear-gradient(#ffe27a,#f0a818)!important;color:#3a2600!important;font-family:var(--f-num);font-weight:700;padding:1px 7px!important}
.gb{font-family:var(--f-num)!important;font-weight:700;border-width:2px!important;border-radius:7px!important}
.note{color:#c9b8a8!important}
#toast{border-radius:12px!important;padding:5px 12px!important}
#lobby h1 small{font-family:var(--f-num);font-weight:600}

#lobby h1{display:flex;flex-direction:column;align-items:center;gap:0;font-family:"Jua",sans-serif!important;line-height:1.05!important}
#lobby h1 .t1{font-size:34px;color:#e8f6ff}#lobby h1 .t2{font-size:44px;color:#ffe27a}
#lobby h1 .t1,#lobby h1 .t2{-webkit-text-stroke:0;text-shadow:0 5px 0 #140c0a,3px 0 0 #140c0a,-3px 0 0 #140c0a,0 -3px 0 #140c0a,3px 3px 0 #140c0a,-3px 3px 0 #140c0a,3px -3px 0 #140c0a,-3px -3px 0 #140c0a}
#lobby h1 small{letter-spacing:.18em!important;color:#8fd0ff!important;font-size:13px!important;margin-bottom:6px!important}
#intro{justify-content:center;gap:8px;color:#fff}
.ihead{display:flex;align-items:center;justify-content:space-between}
.ihead b{font-weight:400;font-size:20px;color:#ffe27a;text-shadow:0 2px 0 #000}
#comic{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cut{margin:0;background:#fff8ea;border:3px solid var(--olc);border-radius:10px;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.5);opacity:0;transform:translateY(10px) scale(.94);transition:opacity .45s,transform .45s;min-width:0}

/* ================= v5: benchmark skin (chamfered frames, outlined text) ================= */
:root{--o8:0 2px 0 #140c0a,2px 0 0 #140c0a,-2px 0 0 #140c0a,0 -2px 0 #140c0a,2px 2px 0 #140c0a,-2px 2px 0 #140c0a,2px -2px 0 #140c0a,-2px -2px 0 #140c0a,0 4px 0 #140c0a;--o4:0 1px 0 #140c0a,1px 0 0 #140c0a,-1px 0 0 #140c0a,0 -1px 0 #140c0a,1px 1px 0 #140c0a,-1px -1px 0 #140c0a,1px -1px 0 #140c0a,-1px 1px 0 #140c0a,0 2px 0 #140c0a}
.ot{color:#fff;text-shadow:var(--o4)}

.lrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

#lConfirm{border:8px solid transparent!important;border-image:var(--cf-dark) 16 fill / 8px stretch!important;background:none!important;color:#fff;text-align:center}

/* webtoon prologue */
#intro{gap:8px!important;justify-content:flex-start!important}
.ihead{display:flex;align-items:center;justify-content:space-between}
.tagd{font-family:"Black Han Sans","Jua",sans-serif;font-size:20px;color:#ffe27a;text-shadow:var(--o8)}
#iSkip{font-size:14px!important;padding:2px 8px!important}
#toon{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:8px 2px 30px;scroll-behavior:smooth}
.pw{position:relative;display:none;flex:none}
.pw.on{display:block;animation:pin .55s cubic-bezier(.2,1.4,.4,1)}
.pw:nth-child(even).on{animation-name:pin2}
@keyframes pin{from{opacity:0;transform:translateX(-30px) rotate(-1.5deg)}to{opacity:1;transform:none}}
@keyframes pin2{from{opacity:0;transform:translateX(30px) rotate(1.5deg)}to{opacity:1;transform:none}}
.pan{background:#140c0a;padding:4px;clip-path:var(--cp)}
.pan canvas{display:block;width:100%;height:auto;image-rendering:pixelated;clip-path:var(--cp)}
.p1{--cp:polygon(0 0,100% 0,100% 84%,0 100%)}.p2{--cp:polygon(0 12%,100% 0,100% 100%,0 92%)}
.p3{--cp:polygon(0 0,100% 6%,100% 94%,0 100%)}.p4{--cp:polygon(0 6%,100% 0,100% 100%,0 100%)}
.cap{position:absolute;z-index:2;background:#ffe27a;color:#2a1a10;border:3px solid #140c0a;padding:5px 9px;font-size:13.5px;line-height:1.35;box-shadow:3px 3px 0 #140c0a;max-width:66%;word-break:keep-all}
.bub{position:absolute;z-index:2;background:#fff;color:#140c0a;border:3px solid #140c0a;border-radius:999px;padding:5px 12px;font-size:13px;line-height:1.3;text-align:center;white-space:nowrap}
.bub::after{content:"";position:absolute;bottom:-11px;width:14px;height:12px;background:#fff;border:3px solid #140c0a;border-top:0;clip-path:polygon(0 0,100% 0,30% 100%)}
.bub.tl::after{left:22px}.bub.tr::after{right:22px;transform:scaleX(-1)}
.inset{position:absolute;z-index:3;right:2%;bottom:-14px;width:36%;background:#140c0a;padding:4px;transform:rotate(3deg)}
.inset canvas{display:block;width:100%;image-rendering:pixelated}
.act{position:absolute;z-index:3;right:39%;bottom:2px;width:30px;height:46px;background:conic-gradient(from 200deg,transparent 0 10deg,#ffe066 10deg 22deg,transparent 22deg 38deg,#ffe066 38deg 50deg,transparent 50deg 66deg,#ffe066 66deg 78deg,transparent 78deg);filter:drop-shadow(1px 1px 0 #140c0a)}
.ifoot{display:flex;flex-direction:column;gap:6px}
#iHint{margin:0;text-align:center;color:#c9b8e8;font-size:13px}
#iGo{font-size:22px!important;padding:6px 0!important}
/* victory */
#victory{position:fixed;inset:0;z-index:30;background:rgba(10,6,24,.82);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-left,0px))}
.vwrap{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:8px;animation:vin .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes vin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.vtop{position:relative;width:150px;height:130px;display:flex;align-items:flex-end;justify-content:center}
.vrays{position:absolute;inset:-60px;background:repeating-conic-gradient(rgba(255,230,140,.32) 0 10deg,transparent 10deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#vIcon{position:relative;width:126px;height:156px;image-rendering:pixelated;margin-bottom:-24px}
.ribbon{position:relative;width:96%;height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#ff7a6a,#e2454a);border:4px solid #140c0a;box-shadow:inset 0 4px 0 rgba(255,255,255,.35),0 4px 0 #140c0a}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:14px;width:40px;height:50px;background:#c23038;border:4px solid #140c0a;z-index:-1}
.ribbon::before{left:-30px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}.ribbon::after{right:-30px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.ribbon span{font-family:"Black Han Sans","Jua",sans-serif;font-size:32px;color:#fff;text-shadow:var(--o8)}
.vrec{font-family:"Black Han Sans","Jua",sans-serif;font-size:22px;color:#ffe066;text-shadow:var(--o8)}
.hexb{width:120px;height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#ff8a6a,#e2454a);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);position:relative}
.hexb small{font-family:"Black Han Sans","Jua",sans-serif;color:#fff;font-size:15px;text-shadow:var(--o4)}
.hexb b{font-family:"Fredoka",sans-serif;font-weight:700;font-size:46px;line-height:1;color:#ffe066;text-shadow:var(--o8)}
.vrow,.vrew{width:100%;border:8px solid transparent;border-image:var(--cf-dark) 16 fill / 8px stretch}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:2px 14px;color:#fff;font-family:"Black Han Sans","Jua",sans-serif;font-size:20px;text-shadow:var(--o4)}
.vrow b{font-family:"Fredoka",sans-serif;font-weight:700;font-size:24px}
.vh{text-align:center;color:#fff;font-family:"Black Han Sans","Jua",sans-serif;font-size:18px;text-shadow:var(--o4);margin-bottom:6px}
#vTiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-bottom:4px}
.vt{position:relative;width:66px;height:66px;border:6px solid transparent;border-image:var(--cf-blue) 16 fill / 6px stretch;display:flex;align-items:center;justify-content:center;opacity:0;animation:tin .4s cubic-bezier(.2,1.6,.4,1) forwards}
.vt canvas{width:44px;height:44px}
.vt b{position:absolute;right:2px;bottom:-2px;font-family:"Fredoka",sans-serif;font-weight:700;font-size:14px;color:#fff;text-shadow:var(--o4)}
.vt .gb{position:absolute;left:-4px;top:-6px;margin:0}
@keyframes tin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
#vOk{width:70%;font-size:26px!important;padding:4px 0!important;margin-top:6px}
/* in-game panels & cards */
#panel{border:8px solid transparent!important;border-image:var(--cf-panel) 16 fill / 8px stretch!important;background:none!important;box-shadow:none!important;border-radius:0!important}
.row{border:7px solid transparent!important;border-image:var(--cf-card) 16 fill / 7px stretch!important;background:none!important;box-shadow:none!important;border-radius:0!important;padding:2px 3px!important}
.row .inf b{font-family:"Jua",sans-serif;color:#2a1a10}
.buy{border:7px solid transparent!important;border-image:var(--cf-yel) 16 fill / 7px stretch!important;background:none!important;box-shadow:none!important;border-radius:0!important;color:#fff!important;text-shadow:var(--o4)!important;font-family:"Black Han Sans","Jua",sans-serif!important;padding:1px 6px!important}
.buy small{color:#fff!important;text-shadow:var(--o4)}
.buy:disabled{border-image:var(--cf-grey) 16 fill / 7px stretch!important;color:#f4efe6!important}
.buy.on{border-image:var(--cf-green) 16 fill / 7px stretch!important}
.buy.gemb{border-image:var(--cf-blue) 16 fill / 7px stretch!important;color:#fff!important}
.buy.gemb:disabled{border-image:var(--cf-grey) 16 fill / 7px stretch!important}
.tog{border:7px solid transparent!important;border-image:var(--cf-grey) 16 fill / 7px stretch!important;background:none!important;box-shadow:none!important;color:#fff!important;text-shadow:var(--o4)}.tog.on{border-image:var(--cf-green) 16 fill / 7px stretch!important}
.me,.pill,.hbtn,#cpbox,#mission,#toast,.slot,#nav button,#phead .chip,#buff{border:7px solid transparent!important;border-image:var(--cf-dark) 16 fill / 7px stretch!important;background:none!important;box-shadow:none!important;border-radius:0!important}
.pill{padding:0 6px 0 0!important}.me{padding:0 4px 0 0!important}.hbtn{padding:0 4px!important;text-shadow:var(--o4)}
#nav button{padding:0!important;text-shadow:var(--o4);color:#fff!important}
#nav button.on{border-image:var(--cf-yel) 16 fill / 7px stretch!important;color:#fff!important}
#phead .chip{padding:0 6px!important;color:#fff!important;text-shadow:var(--o4)}#phead .chip.on{border-image:var(--cf-yel) 16 fill / 7px stretch!important}
#mission{padding:0 2px!important}#mission.ready{border-image:var(--cf-yel) 16 fill / 7px stretch!important;color:#fff!important;text-shadow:var(--o4)}
#mission.ready .mr{color:#fff!important}
#cpbox{padding:0 4px!important}
#buff{border-image:var(--cf-yel) 16 fill / 7px stretch!important;color:#fff!important;text-shadow:var(--o4)}
#bossBtn{border:7px solid transparent!important;border-image:var(--cf-red) 16 fill / 7px stretch!important;background:none!important;box-shadow:none!important;border-radius:0!important;font-family:"Black Han Sans","Jua",sans-serif;text-shadow:var(--o4)}
#modal .box{border:8px solid transparent!important;border-image:var(--cf-card) 16 fill / 8px stretch!important;background:none!important;box-shadow:none!important;border-radius:0!important;padding-top:0!important}
#modal h3{font-family:"Black Han Sans","Jua",sans-serif;color:#fff;text-shadow:var(--o8);background:linear-gradient(#ffd94a,#f2a51c);border:3px solid #140c0a;margin:-14px -6px 10px!important;padding:6px 0 8px;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 3px 0 #140c0a}
#modal button{border:8px solid transparent!important;border-image:var(--cf-yel) 16 fill / 8px stretch!important;background:none!important;box-shadow:none!important;border-radius:0!important;color:#fff!important;text-shadow:var(--o8);font-family:"Black Han Sans","Jua",sans-serif;font-size:22px!important}
#phead .lbl{color:#fff!important;text-shadow:var(--o4)}
.note{color:#fff!important;text-shadow:var(--o4);opacity:.9}
#field{border-radius:6px!important}
#list .buy,#list .buy:disabled,#list .buy.on,#list .buy.gemb,#list .buy:active,#list .tog.on,#phead .chip.on,#nav button.on,#bossBtn,#lYes{box-shadow:none!important;background:none!important}
.vrow,.vrew,.ribbon{box-sizing:border-box}
#vTiles .vt{box-sizing:border-box}

/* hud wallet stacked */
.wal{display:flex;flex-direction:column;gap:2px;flex:none}
.wal .pill{height:auto;min-height:0;font-size:13px!important;line-height:1.15;padding:0 6px 0 0!important;border-width:6px!important;gap:3px!important;justify-content:flex-start}
.wal .pill b{width:15px!important;height:15px!important}
.wal .pill span{min-width:44px;text-align:right}
.me{flex:1 1 auto!important;min-width:0}
.me .nm{font-size:15px!important;overflow:visible!important}
/* gacha */
#gacha{position:fixed;inset:0;z-index:31;background:radial-gradient(circle at 50% 40%,rgba(60,40,120,.92),rgba(8,4,20,.96));display:flex;align-items:center;justify-content:center;padding:16px}
.gwrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ribbon.gr{width:86%}
.ribbon.gr span{font-size:28px}
#gGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;perspective:600px}
#gGrid.one{grid-template-columns:1fr;width:38%}
.gc{position:relative;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,1.4,.5,1);animation:gdeal .35s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes gdeal{from{transform:translateY(40px) scale(.4);opacity:0}}
.gc.open{transform:rotateY(180deg)}
.gc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:polygon(14% 0,86% 0,100% 11%,100% 89%,86% 100%,14% 100%,0 89%,0 11%);background:#140c0a}
.gc .bk{display:flex;align-items:center;justify-content:center}
.gc .bk::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:linear-gradient(#5a4cb8,#2e2470);}
.gc .bk::after{content:"?";position:relative;font-family:"Black Han Sans","Jua",sans-serif;font-size:26px;color:#fff;text-shadow:var(--o4)}
.gc .fr{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.gc .fr::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:linear-gradient(var(--gc1),var(--gc2))}
.gc .fr canvas{position:relative;width:78%;aspect-ratio:1}
.gc .fr .gb{position:absolute;left:4px;top:4px;margin:0;transform:scale(.85);transform-origin:0 0}
.gc .fr em{position:relative;font-style:normal;font-size:10px;line-height:1.1;color:#fff;text-shadow:var(--o4);text-align:center;padding:0 2px;word-break:keep-all;max-height:2.3em;overflow:hidden}
#gGrid.one .fr em{font-size:14px}
@keyframes gshake{0%{transform:translate(-2px,0) rotate(-2deg)}50%{transform:translate(2px,-1px) rotate(2deg)}100%{transform:translate(-2px,0) rotate(-2deg)}}
.gc .glow{position:absolute;inset:-40%;z-index:-1;pointer-events:none;background:repeating-conic-gradient(var(--gc1) 0 12deg,transparent 12deg 30deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 66%);mask:radial-gradient(circle,#000 20%,transparent 66%);opacity:0;transition:opacity .3s;animation:spin 6s linear infinite}
.gc.lit .glow{opacity:.9}
.gc.charge:not(.open)::after{content:"";position:absolute;inset:-6px;border-radius:12px;box-shadow:0 0 18px 6px var(--gc1);animation:gpulse .3s ease-in-out infinite alternate;pointer-events:none}
@keyframes gpulse{from{opacity:.4}to{opacity:1}}
.gc.pop{animation:gpop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes gpop{0%{scale:1}35%{scale:1.35}100%{scale:1}}
.spark{position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--gc1);border:2px solid #140c0a;rotate:45deg;pointer-events:none;z-index:3;animation:sparkf .7s ease-out forwards}
@keyframes sparkf{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#gFlash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#gFlash.on{animation:gfl .6s ease-out}
@keyframes gfl{0%{opacity:.95}100%{opacity:0}}
#gacha.shake .gwrap{animation:gsh .4s linear}
@keyframes gsh{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.gbig{position:fixed;left:50%;top:24%;z-index:5;transform:translate(-50%,-50%);font-family:"Black Han Sans","Jua",sans-serif;font-size:44px;color:var(--gc1);text-shadow:var(--o8),0 0 24px var(--gc1);white-space:nowrap;pointer-events:none;animation:gbig 1.4s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes gbig{0%{transform:translate(-50%,-50%) scale(3);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
#gHint{margin:0;color:#c9b8e8;font-size:13px}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.gbtns button{font-size:20px!important;padding:4px 0!important}
.gbtns .gemr{border-image:var(--cf-blue) 16 fill / 8px stretch!important}
.gbtns[hidden]{display:none!important}

.gshow{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.7));animation:gsbg .25s ease-out}
@keyframes gsbg{from{opacity:0}}
.gshow.out{animation:gsout .3s ease-in forwards}
@keyframes gsout{to{opacity:0}}
.gshow.out .scard{transition:transform .3s ease-in;transform:translate(var(--fx),var(--fy)) scale(.25)}
.srays{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(var(--gc1) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 6%,transparent 42%);mask:radial-gradient(circle,#000 6%,transparent 42%);opacity:.55;animation:spin 7s linear infinite}
.srays.b{animation-direction:reverse;animation-duration:11s;opacity:.3;background:repeating-conic-gradient(#fff 0 3deg,transparent 3deg 26deg)}
.scard{position:relative;width:min(58vw,230px);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;clip-path:polygon(14% 0,86% 0,100% 11%,100% 89%,86% 100%,14% 100%,0 89%,0 11%);background:#140c0a;animation:gsin .55s cubic-bezier(.2,1.6,.35,1) both;overflow:hidden}
.scard::before{content:"";position:absolute;inset:6px;clip-path:inherit;background:radial-gradient(circle at 50% 38%,#fff 0,var(--gc1) 38%,var(--gc2) 100%)}
.scard canvas{position:relative;width:86%;aspect-ratio:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));animation:gfloat 1.4s ease-in-out infinite alternate}
@keyframes gfloat{from{transform:translateY(-4px) rotate(-3deg)}to{transform:translateY(4px) rotate(3deg)}}
@keyframes gsin{0%{transform:translate(var(--fx),var(--fy)) scale(.25) rotate(-20deg)}70%{transform:none scale(1.08)}100%{transform:none}}
.shine{position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.0) 42%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 58%,transparent 62%);transform:translateX(-120%);animation:gshine 1.1s .45s ease-in-out infinite}
@keyframes gshine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.gshow .spark{width:10px;height:10px;background:#fff;box-shadow:0 0 10px var(--gc1);animation-duration:1s}
.gshow.hi .scard{box-shadow:none}
.gshow.hi .srays{opacity:.75}

#gGrid .gc{transition:transform .42s cubic-bezier(.3,1.4,.5,1),opacity .3s,filter .3s}
#gGrid.focus .gc:not(.charge){opacity:.3;filter:grayscale(.6)}
.gc.charge{z-index:4;animation:gchg var(--cd,1.2s) cubic-bezier(.5,0,.6,1) forwards}
@keyframes gchg{0%{translate:0 0;scale:1;rotate:y 0deg}25%{translate:var(--tx,0) -18px;scale:1.35;rotate:y 0deg}80%{translate:var(--tx,0) -18px;scale:1.35;rotate:y var(--spin,1080deg)}100%{translate:var(--tx,0) -18px;scale:1.5;rotate:y var(--spin,1080deg)}}
.gc.charge .bk::before{animation:gtint var(--cd,1.2s) ease-in forwards}
@keyframes gtint{0%,25%{background:linear-gradient(#5a4cb8,#2e2470)}100%{background:linear-gradient(#fff,var(--gc1))}}
.gc.charge .bk::after{animation:gq var(--cd,1.2s) ease-in forwards}
@keyframes gq{0%,60%{opacity:1}100%{opacity:0;transform:scale(2)}}
.gc.charge .glow{opacity:0;animation:spin 1.5s linear infinite,gglow var(--cd,1.2s) ease-in forwards}
@keyframes gglow{0%,30%{opacity:0;scale:.4}100%{opacity:1;scale:1.6}}
.gc.tremble{animation:gtrem .05s linear infinite!important;translate:var(--tx,0) -18px;scale:1.5}
@keyframes gtrem{0%{transform:translate(-3px,1px)}50%{transform:translate(3px,-2px)}100%{transform:translate(-2px,2px)}}
#gacha.dim::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:none;animation:gsbg .3s}
#gFlash.c{background:var(--fc,#fff)}
.gc.charge .bk{backface-visibility:visible!important;-webkit-backface-visibility:visible!important}.gc.charge .fr{visibility:hidden}

/* victory rewards v2 */
#victory{background:radial-gradient(circle at 50% 30%,rgba(40,28,90,.9),rgba(6,4,16,.95))!important;backdrop-filter:blur(3px)}
.vpanel{width:100%;box-sizing:border-box;border:8px solid transparent;border-image:var(--cf-dark) 16 fill / 8px stretch;padding:4px 6px 10px;display:flex;flex-direction:column;gap:8px}
.vrow2{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(0,0,0,.28);border-radius:4px;color:#fff;font-size:18px;text-shadow:var(--o4)}
.vrow2 b{font-size:24px;color:#ffe066;text-shadow:var(--o4)}
.vh2{display:flex;align-items:center;gap:8px;color:#fff;font-size:16px;text-shadow:var(--o4);padding:0 4px}
.vh2 i{flex:1;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent)}
#vTiles{display:grid!important;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 2px}
.rw{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;animation:rwin .5s cubic-bezier(.2,1.6,.4,1) forwards;min-width:0}
@keyframes rwin{0%{opacity:0;transform:translateY(16px) scale(.4)}100%{opacity:1;transform:none}}
.rt{position:relative;width:100%;aspect-ratio:1;background:#140c0a;clip-path:polygon(16% 0,84% 0,100% 16%,100% 84%,84% 100%,16% 100%,0 84%,0 16%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.rt::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:radial-gradient(circle at 50% 40%,var(--r0) 0,var(--r1) 45%,var(--r2) 100%)}
.rt::after{content:"";position:absolute;left:3px;right:3px;top:3px;height:34%;clip-path:polygon(14% 0,86% 0,100% 30%,100% 100%,0 100%,0 30%);background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0))}
.rt canvas{position:relative;width:70%;height:70%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));z-index:1}

<script>

R('skinD',['#0f0a16','#1c1229','#2c1d40','#3f2a57']);
R('wing',['#16060c','#2e0b18','#4d1426','#6e2035','#8d2d45']);

R('orb',['#3a0d66','#7a2fc4','#b77bff','#e7d2ff']);
R('slime',['#2b1550','#4c2a86','#7449b8','#a07be0','#c9b0ff']);
R('ground',['#1a1220','#2a1d33','#3b2a45','#4f3a58']);
const OUTC=hex('#150f1e');
const LV=(()=>{const v=[-.52,-.68,.52],l=Math.hypot(...v);return v.map(x=>x/l)})();

function prim_bbox(p){
  if(p.k==='e'){const r=Math.max(p.rx,p.ry);return[p.x-r,p.y-r,p.x+r,p.y+r]}
  if(p.k==='c'){const r=Math.max(p.r1,p.r2);return[Math.min(p.x1,p.x2)-r,Math.min(p.y1,p.y2)-r,Math.max(p.x1,p.x2)+r,Math.max(p.y1,p.y2)+r]}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.pts.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)});p.bb=[x0,y0,x1,y1];return p.bb;
}
function inPoly(pts,x,y){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function lit(nx,ny,nz){return nx*LV[0]+ny*LV[1]+nz*LV[2]}
function shade(p,x,y){
  if(p.k==='e'){const dx=x-p.x,dy=y-p.y,c=Math.cos(p.a||0),s=Math.sin(p.a||0);const u=(dx*c+dy*s)/p.rx,v=(-dx*s+dy*c)/p.ry;const d2=u*u+v*v;if(d2>1)return null;
    const nz=Math.sqrt(1-d2);return lit(u*c-v*s,u*s+v*c,nz)}
  if(p.k==='c'){const ax=p.x2-p.x1,ay=p.y2-p.y1,L2=ax*ax+ay*ay||1;let t=((x-p.x1)*ax+(y-p.y1)*ay)/L2;t=t<0?0:t>1?1:t;
    const qx=p.x1+ax*t,qy=p.y1+ay*t,r=p.r1+(p.r2-p.r1)*t;const dx=x-qx,dy=y-qy,d=Math.hypot(dx,dy);if(d>r)return null;
    const nx=dx/r,ny=dy/r;return lit(nx,ny,Math.sqrt(Math.max(0,1-nx*nx-ny*ny)))}
  if(!inPoly(p.pts,x,y))return null;const[x0,y0,x1,y1]=p.bb;
  return -(((x-(x0+x1)/2)/((x1-x0)/2||1))*.35+((y-(y0+y1)/2)/((y1-y0)/2||1))*.55)*.9+.25;

const RFAM={fur:'f',furD:'f',snout:'f'};
function raster(prims,w,h){
  const N=w*h,C=new Uint8ClampedArray(N*4),Z=new Float32Array(N).fill(-1e9),G=new Int32Array(N).fill(-1),P=new Int32Array(N).fill(-1);
  prims.forEach((p,i)=>{p.i=i;if(p.g==null)p.g=1000+i});
  const ord=prims.slice().sort((a,b)=>a.z-b.z||a.i-b.i);
  for(const p of ord){
    const[bx0,by0,bx1,by1]=prim_bbox(p);const ramp=p.ramp?RAMP[p.ramp]:null;
    for(let y=Math.max(0,Math.floor(by0));y<=Math.min(h-1,Math.ceil(by1));y++)for(let x=Math.max(0,Math.floor(bx0));x<=Math.min(w-1,Math.ceil(bx1));x++){
      const s=shade(p,x+.5,y+.5);if(s==null)continue;const k=y*w+x;let col;
      if(p.col)col=p.col;else{const n=ramp.length;let f=(s*.5+.5)*n+(p.bias||0);col=ramp[Math.max(0,Math.min(n-1,Math.floor(f)))]}
      C[k*4]=col[0];C[k*4+1]=col[1];C[k*4+2]=col[2];C[k*4+3]=255;Z[k]=p.z;G[k]=p.g;P[k]=p.i;
    }
  }
  const O=new Uint8ClampedArray(C);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=y*w+x;
    const nb=[x>0?k-1:-1,x<w-1?k+1:-1,y>0?k-w:-1,y<h-1?k+w:-1];
    if(C[k*4+3]===0){if(nb.some(q=>q>=0&&C[q*4+3]&&!prims[P[q]].noout)){O[k*4]=OUTC[0];O[k*4+1]=OUTC[1];O[k*4+2]=OUTC[2];O[k*4+3]=255}continue}
    const me=prims[P[k]];if(me.noline||me.col)continue;if(me.jr&&Math.hypot(x+.5-me.jx,y+.5-me.jy)<me.jr)continue;

    if(hit>=0){const rq=prims[P[hit]].ramp,same=rq===me.ramp||(RFAM[rq]&&RFAM[rq]===RFAM[me.ramp]);const rr=RAMP[me.ramp];const d=same?rr[Math.min(1,rr.length-1)]:rr[0];O[k*4]=d[0];O[k*4+1]=d[1];O[k*4+2]=d[2]}
  }

const E=(x,y,rx,ry,ramp,z,o)=>Object.assign({k:'e',x,y,rx,ry,a:0,ramp,z},o||{});
const Cp=(a,b,r1,r2,ramp,z,o)=>Object.assign({k:'c',x1:a.x,y1:a.y,x2:b.x,y2:b.y,r1,r2,ramp,z},o||{});

const DEG=Math.PI/180;
const dirp=(deg,len,o)=>({x:o.x+Math.sin(deg*DEG)*len,y:o.y+Math.cos(deg*DEG)*len});

/* ---------- 북실이 model (side view, facing right) ---------- */
const BW=84,BH=104,BG=98,BAX=34;
const BLACK=hex('#140f1a'),WHITE=hex('#ffffff'),PINK=hex('#e59bb2');
R('cyber',['#232836','#465066','#7f8aa3','#c9d1e2']);
R('umb',['#0c0c14','#20202e','#383850','#565676']);
R('ice',['#22609e','#4f9ee0','#a2dcff','#ffffff']);
R('rainbow',['#6a22c8','#ff3a8a','#ffb43a','#8af06a']);
R('gunm',['#121218','#262632','#44445a','#74748e']);
R('gunb',['#0e468a','#2a78d6','#6ab6ff','#c6eaff']);
R('bookP',['#260c36','#461864','#7438a4','#a46ad6']);
R('bookB',['#0e2848','#1a4878','#3a78b6','#7ab6e6']);
R('bookG',['#241600','#523600','#a07418','#ecce5c']);
R('bookR',['#26140a','#462a12','#784822','#a46e40']);
R('swim',['#86103e','#ce2a68','#ff5a98','#ffb0d0']);
R('weed',['#0c3618','#185628','#2c8638','#58c058']);
R('ghil',['#26360f','#465a1c','#6a822c','#96ae48']);

let GEAR={w:{kind:'blunt',ramp:'plank',len:25,r:2.6},sp:-1,nr:-1,sande:false,cos:'none'};
function headPrims(P,T,u,head,z,ramp){const v={x:-u.y,y:u.x},pt=(a,b)=>[T.x+u.x*a+v.x*b,T.y+u.y*a+v.y*b],A=Math.atan2(u.y,u.x);

  else if(head==='toy'){P.push(Pg([pt(-3,-5),pt(3,-5),pt(3,5),pt(-3,5)],'can',z+.1));P.push(Pg([pt(-3,-1),pt(3,-1),pt(3,1),pt(-3,1)],'gold',z+.11))}

function tween(keys,total){

  return out;
}

function killMob(m){m.dead=1;m.dt=0;deathStart(m);S.cnt.kill=(S.cnt.kill||0)+1;S.chKill=(S.chKill||0)+1;overkill=W().w.kind==='blunt'?1:0;debris(m.x,GY-10,14,MOBCOL[m.type],120);
