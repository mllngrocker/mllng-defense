<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>용사의 마왕 토벌기</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;max-width:520px;margin:0 auto}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#auto{position:absolute;right:10px;top:46px;border:2px solid #1c1420;border-radius:10px;padding:5px 10px;font:bold 12px sans-serif;background:#ffd23a;color:#3a2a00}
#auto.off{background:#8a96b8;color:#fff}
#atk{position:absolute;right:18px;bottom:calc(28px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;border:3px solid #1c1420;background:#e8483a;color:#fff;font:bold 15px sans-serif;box-shadow:0 4px 0 #8a1a10}
#atk:active{transform:translateY(3px);box-shadow:0 1px 0 #8a1a10}
#menu{position:absolute;right:10px;top:8px;display:flex;gap:6px}
#menu a,#menu button{border:0;border-radius:99px;padding:5px 11px;background:#2f6ae0;color:#fff;font:12px sans-serif;text-decoration:none}
#menu button{background:#5a5a6a}
#credit{position:absolute;left:10px;bottom:calc(6px + env(safe-area-inset-bottom));font:9px sans-serif;color:rgba(255,255,255,.55);text-shadow:0 1px 2px #000;pointer-events:none}
</style>
</head>
<body>
<div id="game">
 <canvas id="cv"></canvas>
 <div id="menu"><a href="../">게임 선택</a><button id="reset">처음부터</button></div>
 <button id="auto">AUTO</button>
 <button id="atk">공격</button>
 <div id="credit">Graphics: ArMM1998 (OpenGameArt)</div>
</div>
<script src="maps.js"></script>
<script src="game.js"></script>
</body>
</html>
